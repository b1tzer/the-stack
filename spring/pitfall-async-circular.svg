<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13">
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">案例3：@Async + 循环依赖 → 异步变同步</text>

  <!-- Timeline -->
  <line x1="60" y1="60" x2="60" y2="390" stroke="#a0aec0" stroke-width="2"/>
  <text x="60" y="50" text-anchor="middle" fill="#718096" font-size="12">时间 ↓</text>

  <!-- Step 1: Create OrderService -->
  <rect x="100" y="65" width="260" height="35" rx="6" fill="#ebf8ff" stroke="#3182ce"/>
  <text x="230" y="87" text-anchor="middle" fill="#2b6cb0">① 实例化 OrderService（半成品）</text>
  <circle cx="60" cy="82" r="4" fill="#3182ce"/>

  <!-- Step 2: Populate - need NotificationService -->
  <rect x="100" y="110" width="260" height="35" rx="6" fill="#fefcbf" stroke="#d69e2e"/>
  <text x="230" y="132" text-anchor="middle" fill="#975a16">② 属性填充：需要 NotificationService</text>
  <circle cx="60" cy="127" r="4" fill="#d69e2e"/>

  <!-- Step 3: Create NotificationService -->
  <rect x="100" y="155" width="260" height="35" rx="6" fill="#ebf8ff" stroke="#3182ce"/>
  <text x="230" y="177" text-anchor="middle" fill="#2b6cb0">③ 实例化 NotificationService（半成品）</text>
  <circle cx="60" cy="172" r="4" fill="#3182ce"/>

  <!-- Step 4: Three-level cache -->
  <rect x="100" y="200" width="260" height="45" rx="6" fill="#e9d8fd" stroke="#805ad5"/>
  <text x="230" y="218" text-anchor="middle" fill="#553c9a" font-weight="bold">④ 三级缓存 ObjectFactory 被调用</text>
  <text x="230" y="236" text-anchor="middle" fill="#553c9a" font-size="12">getEarlyBeanReference() → wrapIfNecessary()</text>
  <circle cx="60" cy="222" r="4" fill="#805ad5"/>

  <!-- Step 5: Problem! -->
  <rect x="100" y="255" width="260" height="50" rx="6" fill="#fed7d7" stroke="#e53e3e" stroke-width="2"/>
  <text x="230" y="273" text-anchor="middle" fill="#c53030" font-weight="bold">⑤ AsyncAnnotationBeanPostProcessor</text>
  <text x="230" y="293" text-anchor="middle" fill="#c53030" font-size="12">❌ 没有重写 getEarlyBeanReference</text>
  <circle cx="60" cy="280" r="5" fill="#e53e3e"/>

  <!-- Step 6: Result -->
  <rect x="100" y="315" width="260" height="40" rx="6" fill="#fed7d7" stroke="#e53e3e"/>
  <text x="230" y="333" text-anchor="middle" fill="#c53030" font-weight="bold">⑥ OrderService 拿到裸对象</text>
  <text x="230" y="348" text-anchor="middle" fill="#c53030" font-size="12">没有 @Async 代理，同步执行</text>
  <circle cx="60" cy="335" r="4" fill="#e53e3e"/>

  <!-- Right side: Comparison table -->
  <rect x="420" y="65" width="380" height="180" rx="8" fill="#f7fafc" stroke="#e2e8f0"/>
  <text x="610" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3748">提前代理支持对比</text>

  <rect x="440" y="98" width="170" height="30" rx="4" fill="#c6f6d5" stroke="#38a169"/>
  <text x="525" y="118" text-anchor="middle" fill="#276749" font-size="12">✅ @Transactional</text>
  <text x="630" y="118" fill="#276749" font-size="12">重写了 getEarlyBeanReference</text>

  <rect x="440" y="135" width="170" height="30" rx="4" fill="#c6f6d5" stroke="#38a169"/>
  <text x="525" y="155" text-anchor="middle" fill="#276749" font-size="12">✅ @Aspect</text>
  <text x="630" y="155" fill="#276749" font-size="12">重写了 getEarlyBeanReference</text>

  <rect x="440" y="172" width="170" height="30" rx="4" fill="#fed7d7" stroke="#e53e3e"/>
  <text x="525" y="192" text-anchor="middle" fill="#c53030" font-size="12">❌ @Async</text>
  <text x="630" y="192" fill="#c53030" font-size="12">没有重写，拿裸对象</text>

  <!-- Solution box -->
  <rect x="420" y="260" width="380" height="130" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="610" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#276749">解法</text>
  <text x="440" y="310" fill="#276749" font-size="12">1. 消除循环依赖（推荐）— 拆公共组件 / 事件解耦</text>
  <text x="440" y="332" fill="#276749" font-size="12">2. @Lazy 延迟注入 — 首次使用才创建</text>
  <text x="440" y="354" fill="#276749" font-size="12">3. allow-circular-references=true（兜底）</text>
  <text x="445" y="372" fill="#975a16" font-size="11">⚠️ 但 @Async 仍然失效，治标不治本</text>

  <!-- Legend -->
  <circle cx="430" cy="408" r="4" fill="#e53e3e"/>
  <text x="440" y="412" fill="#718096" font-size="11">= 问题发生点</text>
</svg>
