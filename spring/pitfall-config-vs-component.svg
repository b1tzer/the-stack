<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13">
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">案例4：@Configuration vs @Component — 单例失效</text>

  <!-- Left: @Configuration (CGLIB proxy) -->
  <rect x="20" y="50" width="385" height="310" rx="12" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="212" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#38a169">@Configuration（CGLIB 代理）</text>

  <!-- AppConfig class -->
  <rect x="45" y="95" width="160" height="35" rx="6" fill="#c6f6d5" stroke="#38a169"/>
  <text x="125" y="117" text-anchor="middle" font-weight="bold" fill="#276749">AppConfig$$CGLIB</text>

  <!-- dataSource call -->
  <rect x="45" y="145" width="160" height="30" rx="4" fill="#ebf8ff" stroke="#3182ce"/>
  <text x="125" y="165" text-anchor="middle" fill="#2b6cb0" font-size="12">dataSource() 调用</text>

  <!-- CGLIB intercept -->
  <line x1="125" y1="175" x2="125" y2="195" stroke="#38a169" stroke-width="2" marker-end="url(#arrowG)"/>
  <rect x="45" y="198" width="160" height="30" rx="4" fill="#e9d8fd" stroke="#805ad5"/>
  <text x="125" y="218" text-anchor="middle" fill="#553c9a" font-size="12">CGLIB 拦截 → 容器有缓存?</text>

  <!-- Return cached -->
  <line x1="125" y1="228" x2="125" y2="248" stroke="#38a169" stroke-width="2" marker-end="url(#arrowG)"/>
  <rect x="45" y="250" width="160" height="35" rx="6" fill="#c6f6d5" stroke="#38a169"/>
  <text x="125" y="268" text-anchor="middle" fill="#276749" font-size="12">✅ 有 → 返回缓存实例</text>
  <text x="125" y="280" text-anchor="middle" fill="#276749" font-size="11">无 → super.dataSource()</text>

  <!-- Single instance -->
  <rect x="240" y="160" width="140" height="50" rx="8" fill="#fefcbf" stroke="#d69e2e" stroke-width="2"/>
  <text x="310" y="182" text-anchor="middle" fill="#975a16" font-weight="bold">容器单例池</text>
  <text x="310" y="200" text-anchor="middle" fill="#975a16" font-size="12">1 个 DataSource</text>
  <line x1="205" y1="200" x2="240" y2="185" stroke="#38a169" stroke-width="1.5" marker-end="url(#arrowG)" stroke-dasharray="4,3"/>

  <!-- jdbcTemplate calls dataSource -->
  <rect x="240" y="230" width="140" height="45" rx="6" fill="#ebf8ff" stroke="#3182ce"/>
  <text x="310" y="250" text-anchor="middle" fill="#2b6cb0" font-size="12">jdbcTemplate()</text>
  <text x="310" y="266" text-anchor="middle" fill="#2b6cb0" font-size="11">→ dataSource() ✅</text>
  <line x1="205" y1="255" x2="240" y2="255" stroke="#38a169" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <text x="212" y="340" text-anchor="middle" fill="#276749" font-weight="bold">结果：单例语义正常 ✅</text>

  <!-- Right: @Component (no proxy) -->
  <rect x="415" y="50" width="385" height="310" rx="12" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="607" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#e53e3e">@Component（无代理）</text>

  <!-- AppConfig class -->
  <rect x="440" y="95" width="160" height="35" rx="6" fill="#fed7d7" stroke="#e5303e"/>
  <text x="520" y="117" text-anchor="middle" font-weight="bold" fill="#c53030">AppConfig（原始类）</text>

  <!-- dataSource call -->
  <rect x="440" y="145" width="160" height="30" rx="4" fill="#fed7d7" stroke="#e53e3e"/>
  <text x="520" y="165" text-anchor="middle" fill="#c53030" font-size="12">dataSource() 调用</text>

  <!-- Direct Java call -->
  <line x1="520" y1="175" x2="520" y2="195" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowR)"/>
  <rect x="440" y="198" width="160" height="30" rx="4" fill="#fed7d7" stroke="#e53e3e"/>
  <text x="520" y="218" text-anchor="middle" fill="#c53030" font-size="12">普通 Java 方法 → new</text>

  <!-- TWO instances -->
  <rect x="640" y="140" width="140" height="75" rx="8" fill="#fefcbf" stroke="#d69e2e" stroke-width="2"/>
  <text x="710" y="162" text-anchor="middle" fill="#975a16" font-weight="bold">容器</text>
  <text x="710" y="180" text-anchor="middle" fill="#e53e3e" font-size="12">DataSource #1</text>
  <text x="710" y="196" text-anchor="middle" fill="#e53e3e" font-size="12">DataSource #2 ❌</text>
  <line x1="600" y1="200" x2="640" y2="180" stroke="#e53e3e" stroke-width="1.5" marker-end="url(#arrowR)" stroke-dasharray="4,3"/>

  <!-- jdbcTemplate calls dataSource -->
  <rect x="640" y="230" width="140" height="45" rx="6" fill="#fed7d7" stroke="#e53e3e"/>
  <text x="710" y="250" text-anchor="middle" fill="#c53030" font-size="12">jdbcTemplate()</text>
  <text x="710" y="266" text-anchor="middle" fill="#c53030" font-size="11">→ new DataSource ❌</text>
  <line x1="600" y1="255" x2="640" y2="255" stroke="#e53e3e" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <text x="607" y="340" text-anchor="middle" fill="#c53030" font-weight="bold">结果：连接池翻倍，连接数超限 ❌</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38a169"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e53e3e"/>
    </marker>
  </defs>
</svg>
