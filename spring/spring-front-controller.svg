<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
<style>
  text { text-anchor: middle; dominant-baseline: central; }
  .title { font-size: 17px; font-weight: bold; fill: #333333; }
  .label { font-size: 14px; fill: #333333; }
  .note { font-size: 12px; fill: #666666; }
  .arrow { stroke: #7b1fa2; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  .box { rx: 8; ry: 8; }
  .phase { fill: #eceff1; stroke: #666666; stroke-width: 1.5; }
  .highlight { fill: #fff3e0; stroke: #e65100; stroke-width: 1.5; }
  .action { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.5; }
  .important { fill: #ffcdd2; stroke: #e65100; stroke-width: 1.5; }
  .step { fill: #e1bee7; stroke: #7b1fa2; stroke-width: 1.5; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#7b1fa2"/>
  </marker>
</defs>
<text x="320" y="24" class="title">前端控制器（Front Controller）模式</text>
<rect x="20" y="42" width="600" height="356" rx="10" class="phase"/>
<text x="320" y="64" class="label" font-weight="bold">Tomcat（Servlet 容器）</text>
<rect x="45" y="192" width="158" height="76" class="box step"/>
<text x="124" y="218" class="label" font-weight="bold">Filter 链</text>
<text x="124" y="239" class="note">请求 / 响应过滤</text>
<line x1="203" y1="230" x2="263" y2="230" class="arrow"/>
<rect x="268" y="88" width="332" height="290" rx="10" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.7"/>
<text x="434" y="110" class="label" font-weight="bold" fill="#7b1fa2">DispatcherServlet</text>
<rect x="285" y="124" width="298" height="54" class="box step"/>
<text x="434" y="144" class="label" font-weight="bold">HandlerMapping</text>
<text x="434" y="162" class="note">找到处理器</text>
<rect x="285" y="186" width="298" height="54" class="box action"/>
<text x="434" y="206" class="label" font-weight="bold">HandlerAdapter</text>
<text x="434" y="224" class="note">调用处理器</text>
<rect x="285" y="248" width="298" height="54" class="box highlight"/>
<text x="434" y="268" class="label" font-weight="bold">ViewResolver</text>
<text x="434" y="286" class="note">解析视图</text>
<rect x="285" y="310" width="298" height="54" class="box important"/>
<text x="434" y="330" class="label" font-weight="bold">ExceptionResolver</text>
<text x="434" y="348" class="note">异常处理</text>
</svg>