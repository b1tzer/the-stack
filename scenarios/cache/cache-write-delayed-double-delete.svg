<svg xmlns="http://www.w3.org/2000/svg" width="620" height="120" viewBox="0 0 620 120" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="620" height="120" fill="#ffffff"/>

  <rect x="15" y="38" width="90" height="44" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="60" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">删除缓存</text>

  <rect x="155" y="38" width="110" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="210" y="60" text-anchor="middle" font-size="13" fill="#24292f">更新数据库</text>

  <rect x="305" y="38" width="110" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="360" y="60" text-anchor="middle" font-size="13" fill="#24292f">延迟 500ms</text>

  <rect x="460" y="38" width="120" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="520" y="60" text-anchor="middle" font-size="13" fill="#24292f">再次删除缓存</text>

  <line x1="105" y1="60" x2="155" y2="60" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="265" y1="60" x2="305" y2="60" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="415" y1="60" x2="460" y2="60" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
