<svg width="700" height="285" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 285" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#57606a"/>
    </marker>
  </defs>

  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#24292f">线程池隔离（舱壁模式）</text>

  <!-- API Gateway（入口，中性） -->
  <rect x="230" y="48" width="240" height="44" rx="6" fill="#f6f8fa" stroke="#9aa4af" stroke-width="1.5"/>
  <text x="350" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">API Gateway</text>

  <!-- 分发箭头（主干 + 汇流排，两侧折线连接） -->
  <line x1="350" y1="92" x2="350" y2="115" stroke="#57606a" stroke-width="1.5"/>
  <line x1="120" y1="115" x2="580" y2="115" stroke="#57606a" stroke-width="1.5"/>
  <line x1="120" y1="115" x2="120" y2="136" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="350" y1="115" x2="350" y2="136" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="580" y1="115" x2="580" y2="136" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 订单服务（正常） -->
  <rect x="25" y="138" width="190" height="110" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="120" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">订单服务</text>
  <rect x="50" y="166" width="140" height="48" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="120" y="186" text-anchor="middle" font-size="11" fill="#1b5e20">线程池 A</text>
  <text x="120" y="203" text-anchor="middle" font-size="11" fill="#1b5e20">20 线程</text>

  <!-- 支付服务（故障） -->
  <rect x="255" y="138" width="190" height="110" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="350" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">支付服务</text>
  <rect x="280" y="166" width="140" height="48" rx="4" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="350" y="186" text-anchor="middle" font-size="11" fill="#b71c1c">线程池 B</text>
  <text x="350" y="203" text-anchor="middle" font-size="11" fill="#b71c1c">10 线程</text>

  <!-- 库存服务（正常） -->
  <rect x="485" y="138" width="190" height="110" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="580" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">库存服务</text>
  <rect x="510" y="166" width="140" height="48" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="580" y="186" text-anchor="middle" font-size="11" fill="#1b5e20">线程池 C</text>
  <text x="580" y="203" text-anchor="middle" font-size="11" fill="#1b5e20">15 线程</text>

  <!-- 故障标注 -->
  <text x="350" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#b71c1c">变慢 · 只耗尽自身线程池</text>
</svg>