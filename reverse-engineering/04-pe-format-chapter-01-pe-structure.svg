<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" width="360" height="520">
  <defs>
    <style>
      text { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
    </style>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 头部区域 -->
  <rect x="40" y="14" width="280" height="44" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="180" y="41" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">DOS Header（MZ）</text>

  <rect x="40" y="66" width="280" height="44" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="180" y="93" text-anchor="middle" font-size="13" fill="#1565c0">DOS Stub</text>

  <rect x="40" y="118" width="280" height="44" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="180" y="145" text-anchor="middle" font-size="13" fill="#1565c0">PE Signature（PE\0\0）</text>

  <rect x="40" y="170" width="280" height="44" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="180" y="197" text-anchor="middle" font-size="13" fill="#1565c0">COFF File Header</text>

  <rect x="40" y="222" width="280" height="44" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="180" y="249" text-anchor="middle" font-size="13" fill="#1565c0">Optional Header</text>

  <rect x="40" y="274" width="280" height="44" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="180" y="301" text-anchor="middle" font-size="13" fill="#1565c0">Section Table</text>

  <!-- 节区区域 -->
  <rect x="40" y="326" width="280" height="168" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="180" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">节区（Section）</text>
  <rect x="56" y="362" width="248" height="34" rx="4" fill="#ffffff" stroke="#9ccc9c" stroke-width="0.8"/>
  <text x="180" y="384" text-anchor="middle" font-size="11" fill="#2e7d32">.text — 机器代码</text>
  <rect x="56" y="402" width="248" height="34" rx="4" fill="#ffffff" stroke="#9ccc9c" stroke-width="0.8"/>
  <text x="180" y="424" text-anchor="middle" font-size="11" fill="#2e7d32">.data / .rdata — 数据、常量、导入表</text>
  <rect x="56" y="442" width="248" height="34" rx="4" fill="#ffffff" stroke="#9ccc9c" stroke-width="0.8"/>
  <text x="180" y="464" text-anchor="middle" font-size="11" fill="#2e7d32">.reloc / .rsrc — 重定位、资源</text>
</svg>
