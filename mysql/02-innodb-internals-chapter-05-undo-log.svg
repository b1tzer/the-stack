<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 814 292" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrRollback" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e65100"/>
    </marker>
    <marker id="arrVersion" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="407" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Undo Log：回滚段里的一张「表」，服务回滚与 MVCC</text>

  <!-- ============ 左侧：Undo Log 表（物理形态） ============ -->
  <!-- Undo 表空间 -->
  <rect x="24" y="40" width="520" height="232" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="36" y="58" fill="#1b5e20" font-weight="bold" font-size="12">Undo 表空间</text>

  <!-- 回滚段 -->
  <rect x="40" y="68" width="488" height="192" rx="4" fill="#ffffff" stroke="#81c784" stroke-width="1"/>
  <text x="52" y="84" fill="#2e7d32" font-size="12">回滚段（rollback segment）</text>

  <!-- 表头 -->
  <rect x="52" y="92" width="472" height="28" rx="2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <line x1="170" y1="92" x2="170" y2="120" stroke="#2e7d32" stroke-width="1"/>
  <line x1="288" y1="92" x2="288" y2="120" stroke="#2e7d32" stroke-width="1"/>
  <line x1="406" y1="92" x2="406" y2="120" stroke="#2e7d32" stroke-width="1"/>
  <text x="111" y="110" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="bold">undo_no</text>
  <text x="229" y="110" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="bold">trx_id</text>
  <text x="347" y="110" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="bold">旧值</text>
  <text x="465" y="110" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="bold">roll_ptr</text>

  <!-- 行1（最新） -->
  <rect x="52" y="120" width="472" height="28" rx="2" fill="#e8f5e9" stroke="#81c784" stroke-width="1"/>
  <line x1="170" y1="120" x2="170" y2="148" stroke="#81c784" stroke-width="1"/>
  <line x1="288" y1="120" x2="288" y2="148" stroke="#81c784" stroke-width="1"/>
  <line x1="406" y1="120" x2="406" y2="148" stroke="#81c784" stroke-width="1"/>
  <text x="111" y="138" text-anchor="middle" fill="#333333" font-size="12">3</text>
  <text x="229" y="138" text-anchor="middle" fill="#333333" font-size="12">105</text>
  <text x="347" y="138" text-anchor="middle" fill="#333333" font-size="12">350</text>
  <text x="465" y="138" text-anchor="middle" fill="#1565c0" font-size="12">↓</text>

  <!-- 行2 -->
  <rect x="52" y="148" width="472" height="28" rx="2" fill="#ffffff" stroke="#81c784" stroke-width="1"/>
  <line x1="170" y1="148" x2="170" y2="176" stroke="#81c784" stroke-width="1"/>
  <line x1="288" y1="148" x2="288" y2="176" stroke="#81c784" stroke-width="1"/>
  <line x1="406" y1="148" x2="406" y2="176" stroke="#81c784" stroke-width="1"/>
  <text x="111" y="166" text-anchor="middle" fill="#333333" font-size="12">2</text>
  <text x="229" y="166" text-anchor="middle" fill="#333333" font-size="12">102</text>
  <text x="347" y="166" text-anchor="middle" fill="#333333" font-size="12">420</text>
  <text x="465" y="166" text-anchor="middle" fill="#1565c0" font-size="12">↓</text>

  <!-- 行3（最旧） -->
  <rect x="52" y="176" width="472" height="28" rx="2" fill="#e8f5e9" stroke="#81c784" stroke-width="1"/>
  <line x1="170" y1="176" x2="170" y2="204" stroke="#81c784" stroke-width="1"/>
  <line x1="288" y1="176" x2="288" y2="204" stroke="#81c784" stroke-width="1"/>
  <line x1="406" y1="176" x2="406" y2="204" stroke="#81c784" stroke-width="1"/>
  <text x="111" y="194" text-anchor="middle" fill="#333333" font-size="12">1</text>
  <text x="229" y="194" text-anchor="middle" fill="#333333" font-size="12">101</text>
  <text x="347" y="194" text-anchor="middle" fill="#333333" font-size="12">500</text>
  <text x="465" y="194" text-anchor="middle" fill="#999999" font-size="12">—</text>

  <!-- 表内说明 -->
  <text x="52" y="224" fill="#555555" font-size="11">每条 undo 记录是表里的一行，roll_ptr 从上到下串成链</text>
  <text x="52" y="240" fill="#555555" font-size="11">最新记录在最上，越往下越旧</text>

  <!-- ============ 右侧：两个用途 ============ -->
  <rect x="600" y="52" width="190" height="64" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.4"/>
  <text x="612" y="76" fill="#bf360c" font-weight="bold" font-size="14">① 回滚（逆向操作）</text>
  <text x="612" y="98" fill="#6d4c41" font-size="11">读旧值，改回修改前的状态</text>

  <rect x="600" y="156" width="190" height="64" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="612" y="180" fill="#0d47a1" font-weight="bold" font-size="14">② MVCC（版本链）</text>
  <text x="612" y="202" fill="#555555" font-size="11">沿 roll_ptr 回溯，找历史版本</text>

  <!-- 箭头：表 → 两个用途 -->
  <line x1="546" y1="86" x2="598" y2="86" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrRollback)"/>
  <line x1="546" y1="188" x2="598" y2="188" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrVersion)"/>
</svg>
