<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2e7d32"/>
    </marker>
  </defs>

  <text x="470" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Undo 页的内部结构</text>
  <text x="470" y="50" text-anchor="middle" fill="#757575" font-size="11">Undo 页（16KB）· 属于回滚段页链的一环</text>

  <!-- 页链 -->
  <rect x="80" y="170" width="130" height="44" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="145" y="197" text-anchor="middle" fill="#1b5e20" font-size="11" font-weight="bold">… 前一个 Undo 页</text>

  <line x1="210" y1="192" x2="266" y2="192" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrGreen)"/>

  <rect x="700" y="170" width="130" height="44" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="765" y="197" text-anchor="middle" fill="#1b5e20" font-size="11" font-weight="bold">后一个 Undo 页 …</text>

  <line x1="660" y1="192" x2="686" y2="192" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrGreen)"/>

  <!-- 页主体 -->
  <rect x="280" y="70" width="380" height="244" rx="6" fill="#f1f8e9" stroke="#1565c0" stroke-width="1.4"/>

  <rect x="296" y="86" width="348" height="48" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="312" y="106" fill="#1b5e20" font-size="11" font-weight="bold">Undo Page Header</text>
  <text x="312" y="124" fill="#555555" font-size="9">页元信息（链表指针等）</text>

  <rect x="296" y="146" width="348" height="40" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="312" y="171" fill="#bf360c" font-size="11" font-weight="bold">Undo Record</text>
  <text x="628" y="171" text-anchor="end" fill="#8d6e63" font-size="10">一条逆向操作记录</text>

  <rect x="296" y="194" width="348" height="40" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="312" y="219" fill="#bf360c" font-size="11" font-weight="bold">Undo Record</text>
  <text x="628" y="219" text-anchor="end" fill="#8d6e63" font-size="10">…</text>

  <rect x="296" y="242" width="348" height="56" rx="4" fill="#ffffff" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="470" y="266" text-anchor="middle" fill="#757575" font-size="11" font-weight="bold">Free Space</text>
  <text x="470" y="286" text-anchor="middle" fill="#9e9e9e" font-size="10">可复用</text>
</svg>
