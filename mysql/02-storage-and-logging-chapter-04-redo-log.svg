<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="470" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Redo Log 循环缓冲：两个 LSN 游标把环切成三段</text>

  <!-- Log Buffer -->
  <rect x="60" y="160" width="200" height="48" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="160" y="189" text-anchor="middle" fill="#0d47a1" font-weight="bold" font-size="12">Log Buffer（内存）</text>

  <!-- fsync 刷盘：水平进入环带 -->
  <text x="390" y="172" text-anchor="middle" fill="#1565c0" font-size="10" font-weight="bold">fsync 刷盘</text>
  <line x1="264" y1="184" x2="520" y2="184" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrBlue)"/>

  <!-- 循环环：已刷盘（绿）→ 未刷盘（橙）→ 空闲（灰），顺时针 -->
  <path d="M640,104 A96,96 0 0 1 736,200 A96,96 0 0 1 640,296" fill="none" stroke="#c8e6c9" stroke-width="40"/>
  <path d="M640,296 A96,96 0 0 1 544,200" fill="none" stroke="#ffcc80" stroke-width="40"/>
  <path d="M544,200 A96,96 0 0 1 640,104" fill="none" stroke="#eceff1" stroke-width="40"/>
  <text x="640" y="206" text-anchor="middle" fill="#333333" font-weight="bold" font-size="14">Redo Log</text>

  <!-- 写入方向：终点切线在圆顶，箭头水平 -->
  <path d="M512,200 A128,128 0 0 1 640,72" fill="none" stroke="#e65100" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="660" y="56" fill="#e65100" font-size="10" font-weight="bold">顺时针 = LSN 递增</text>

  <!-- checkpoint LSN 游标（底部，绿/橙分界） -->
  <line x1="640" y1="318" x2="640" y2="344" stroke="#e65100" stroke-width="1.6"/>
  <text x="640" y="362" text-anchor="middle" fill="#e65100" font-size="11" font-weight="bold">checkpoint LSN</text>
  <text x="640" y="378" text-anchor="middle" fill="#8d6e63" font-size="10">已刷盘 / 未刷盘分界</text>

  <!-- 当前 LSN 游标（左侧，橙/灰分界） -->
  <line x1="524" y1="200" x2="490" y2="200" stroke="#e65100" stroke-width="1.6"/>
  <text x="486" y="204" text-anchor="end" fill="#e65100" font-size="11" font-weight="bold">当前 LSN</text>
  <text x="486" y="222" text-anchor="end" fill="#8d6e63" font-size="10">写入位置</text>

  <!-- 图例 -->
  <rect x="790" y="234" width="16" height="16" rx="2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="814" y="247" fill="#555555" font-size="10">已刷盘，可覆盖</text>
  <rect x="790" y="266" width="16" height="16" rx="2" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="814" y="279" fill="#555555" font-size="10">未刷盘，恢复重放</text>
  <rect x="790" y="298" width="16" height="16" rx="2" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="814" y="311" fill="#555555" font-size="10">空闲</text>
</svg>
