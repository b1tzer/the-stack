<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#757575"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="470" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Buffer Pool 内部的三张链表</text>

  <!-- Buffer Pool 容器 -->
  <rect x="40" y="56" width="860" height="300" rx="12" fill="#fafafa" stroke="#455a64" stroke-width="1.4"/>
  <text x="56" y="80" font-size="12" font-weight="bold" fill="#455a64">Buffer Pool（内存）</text>

  <!-- Free List -->
  <rect x="64" y="110" width="190" height="140" rx="8" fill="#f5f5f5" stroke="#757575" stroke-width="1.4"/>
  <text x="78" y="136" font-size="13" font-weight="bold" fill="#424242">Free List</text>
  <text x="78" y="158" fill="#555555" font-size="10">空闲页链表</text>
  <text x="78" y="176" fill="#555555" font-size="10">启动时全挂这里</text>
  <rect x="78" y="188" width="64" height="26" rx="4" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1"/>
  <text x="110" y="205" text-anchor="middle" fill="#424242" font-size="11">空页</text>
  <text x="78" y="240" font-size="11" font-weight="bold" fill="#424242">回答：去哪找空页</text>

  <!-- LRU List -->
  <rect x="330" y="110" width="320" height="140" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="344" y="136" font-size="13" font-weight="bold" fill="#0d47a1">LRU List</text>
  <text x="344" y="158" fill="#555555" font-size="10">已缓存页 · 按最近访问时间排序</text>
  <rect x="344" y="176" width="292" height="36" rx="4" fill="#ffffff" stroke="#90caf9" stroke-width="1"/>
  <text x="356" y="198" fill="#1565c0" font-size="10">头部（最近访问）</text>
  <text x="624" y="198" text-anchor="end" fill="#1565c0" font-size="10">尾部（淘汰点）</text>
  <text x="344" y="240" font-size="11" font-weight="bold" fill="#0d47a1">回答：内存满了淘汰谁</text>

  <!-- Flush List -->
  <rect x="730" y="110" width="160" height="140" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.4"/>
  <text x="744" y="136" font-size="13" font-weight="bold" fill="#bf360c">Flush List</text>
  <text x="744" y="158" fill="#555555" font-size="10">脏页链表</text>
  <text x="744" y="176" fill="#555555" font-size="10">按修改时间排序</text>
  <text x="744" y="196" fill="#555555" font-size="10">刷盘后从表中摘除</text>
  <text x="744" y="240" font-size="11" font-weight="bold" fill="#bf360c">回答：哪些脏页刷盘</text>

  <!-- 箭头：Free → LRU（读入取空页） -->
  <line x1="254" y1="150" x2="316" y2="150" stroke="#757575" stroke-width="1.8" marker-end="url(#arrGray)"/>
  <text x="294" y="172" text-anchor="middle" fill="#555555" font-size="10">读入时取空页</text>

  <!-- 箭头：LRU → Flush（标脏后同时挂入，虚线表示成员关系而非搬动） -->
  <line x1="650" y1="150" x2="716" y2="150" stroke="#e65100" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrOrange)"/>
  <text x="690" y="172" text-anchor="middle" fill="#bf360c" font-size="10">标脏后同时挂入</text>

  <!-- 箭头：LRU 淘汰 → Free（圆角走廊，水平收尾） -->
  <path d="M600,250 V288 Q600,296 592,296 H306 Q290,296 290,288 V218 Q290,210 282,210 H268" fill="none" stroke="#757575" stroke-width="1.8" marker-end="url(#arrGray)"/>
  <text x="440" y="316" text-anchor="middle" fill="#555555" font-size="10">淘汰后回收（脏页先刷盘）</text>

  <!-- 底部总结 -->
  <rect x="40" y="376" width="860" height="40" rx="8" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.2"/>
  <text x="470" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#424242">Free List 找空页 · LRU List 定淘汰 · Flush List 管刷盘</text>
</svg>
