<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrOrange" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="470" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">行溢出：大字段搬进独立的溢出页</text>
  <text x="470" y="54" text-anchor="middle" fill="#757575" font-size="11">一行超过页大小的一半（约 8KB）→ 触发行溢出</text>

  <!-- 主索引页里的一行 -->
  <rect x="40" y="76" width="420" height="224" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="56" y="102" fill="#0d47a1" font-size="12" font-weight="bold">主索引页里的一行</text>

  <rect x="56" y="116" width="388" height="140" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <rect x="64" y="126" width="372" height="34" rx="2" fill="#90caf9" stroke="#1565c0" stroke-width="0.8"/>
  <text x="250" y="147" text-anchor="middle" fill="#0d47a1" font-size="10">记录头 + 隐藏列 + 短字段（id、name…）</text>
  <rect x="64" y="168" width="372" height="40" rx="2" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="250" y="193" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="bold">20 字节溢出指针</text>
  <text x="64" y="236" fill="#0d47a1" font-size="10">大字段不在本行，只留指针；本页因此能容纳更多行</text>

  <text x="56" y="282" fill="#555555" font-size="10">读大字段时要多一次「跳溢出页」的 IO</text>

  <!-- 指针箭头 -->
  <path d="M460,188 H502 Q510,188 510,180 V158 Q510,150 518,150 H546" fill="none" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>
  <text x="506" y="178" text-anchor="middle" fill="#e65100" font-size="10" font-weight="bold">20 字节指针</text>

  <!-- 溢出页 -->
  <rect x="560" y="76" width="340" height="224" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.4"/>
  <text x="576" y="102" fill="#bf360c" font-size="12" font-weight="bold">溢出页（Overflow Page）</text>

  <rect x="576" y="116" width="308" height="96" rx="3" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="730" y="152" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="bold">大字段的完整内容</text>
  <text x="730" y="174" text-anchor="middle" fill="#6d4c41" font-size="10">（TEXT / BLOB 长内容）</text>
  <text x="730" y="196" text-anchor="middle" fill="#6d4c41" font-size="10">独立成页，不占主索引页空间</text>

  <text x="576" y="236" fill="#bf360c" font-size="10" font-weight="bold">内容超过一页时，多个溢出页串成链：</text>
  <rect x="576" y="246" width="120" height="36" rx="3" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="636" y="268" text-anchor="middle" fill="#6d4c41" font-size="10">溢出页 1</text>
  <line x1="700" y1="264" x2="716" y2="264" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>
  <rect x="730" y="246" width="120" height="36" rx="3" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="790" y="268" text-anchor="middle" fill="#6d4c41" font-size="10">溢出页 2</text>

  <!-- Compact vs Dynamic -->
  <text x="40" y="334" font-size="12" font-weight="bold" fill="#333333">两种行格式，本页留的东西不同</text>

  <rect x="40" y="348" width="430" height="110" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="56" y="372" fill="#1b5e20" font-size="11" font-weight="bold">Compact（8.0 之前默认）</text>
  <rect x="56" y="384" width="150" height="44" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="131" y="411" text-anchor="middle" fill="#1b5e20" font-size="11" font-weight="bold">768 字节前缀</text>
  <rect x="214" y="384" width="90" height="44" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="259" y="411" text-anchor="middle" fill="#bf360c" font-size="10" font-weight="bold">20B 指针</text>
  <line x1="308" y1="406" x2="322" y2="406" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>
  <rect x="336" y="384" width="118" height="44" rx="3" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="395" y="411" text-anchor="middle" fill="#bf360c" font-size="10" font-weight="bold">溢出页：其余</text>
  <text x="56" y="446" fill="#888888" font-size="10">前缀留在本页，读前缀不跳页</text>

  <rect x="490" y="348" width="430" height="110" rx="6" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.4"/>
  <text x="506" y="372" fill="#6a1b9a" font-size="11" font-weight="bold">Dynamic（8.0 默认）</text>
  <rect x="506" y="384" width="90" height="44" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="551" y="411" text-anchor="middle" fill="#bf360c" font-size="10" font-weight="bold">20B 指针</text>
  <line x1="600" y1="406" x2="614" y2="406" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>
  <rect x="628" y="384" width="196" height="44" rx="3" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="726" y="411" text-anchor="middle" fill="#bf360c" font-size="10" font-weight="bold">溢出页：整个大字段</text>
  <text x="506" y="446" fill="#888888" font-size="10">连 768 字节前缀都不留，主记录更紧凑</text>

  <!-- 底部结论 -->
  <text x="470" y="496" text-anchor="middle" fill="#757575" font-size="11">TEXT/BLOB 单独拆表的依据：留在主表会让行频繁溢出、拖慢整行扫描</text>
</svg>
