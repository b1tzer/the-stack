<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrOrange" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <text x="470" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">二级索引与回表</text>

  <!-- 左：二级索引 -->
  <rect x="40" y="56" width="380" height="214" rx="8" fill="#fafafa" stroke="#1565c0" stroke-width="1.4"/>
  <text x="230" y="82" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="bold">二级索引 idx_name（按 name 有序）</text>

  <rect x="110" y="100" width="240" height="36" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="230" y="123" text-anchor="middle" fill="#0d47a1" font-size="11" font-weight="bold">[Amy | Tom | Zoe]</text>

  <line x1="230" y1="136" x2="125" y2="176" stroke="#90caf9" stroke-width="1.4"/>
  <line x1="230" y1="136" x2="230" y2="176" stroke="#90caf9" stroke-width="1.4"/>
  <line x1="230" y1="136" x2="335" y2="176" stroke="#90caf9" stroke-width="1.4"/>

  <rect x="70" y="180" width="110" height="44" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="125" y="207" text-anchor="middle" fill="#1b5e20" font-size="11">Amy → 3</text>

  <rect x="190" y="180" width="110" height="44" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="245" y="207" text-anchor="middle" fill="#bf360c" font-size="11" font-weight="bold">Tom → 5</text>

  <rect x="310" y="180" width="100" height="44" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="360" y="207" text-anchor="middle" fill="#1b5e20" font-size="11">Zoe → 9</text>

  <text x="230" y="252" text-anchor="middle" fill="#555555" font-size="10">叶子存主键值，不存行数据</text>

  <!-- 右：聚簇索引 -->
  <rect x="540" y="56" width="360" height="214" rx="8" fill="#fafafa" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="720" y="82" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="bold">聚簇索引（按 id 有序）</text>

  <rect x="620" y="100" width="200" height="36" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="720" y="123" text-anchor="middle" fill="#1b5e20" font-size="11" font-weight="bold">[4 | 8 | 12]</text>

  <line x1="720" y1="136" x2="630" y2="176" stroke="#a5d6a7" stroke-width="1.4"/>
  <line x1="720" y1="136" x2="810" y2="176" stroke="#a5d6a7" stroke-width="1.4"/>

  <rect x="560" y="180" width="200" height="44" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="660" y="207" text-anchor="middle" fill="#bf360c" font-size="11" font-weight="bold">id=5 → 完整行</text>

  <rect x="780" y="180" width="100" height="44" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="830" y="207" text-anchor="middle" fill="#1b5e20" font-size="11">其他行</text>

  <text x="720" y="252" text-anchor="middle" fill="#555555" font-size="10">叶子存完整行数据</text>

  <!-- 回表箭头：先上行绕过本侧叶子，再从左侧水平进入目标叶 -->
  <text x="525" y="194" text-anchor="middle" fill="#e65100" font-size="10" font-weight="bold">回表</text>
  <path d="M245,180 V166 Q245,158 253,158 H492 Q500,158 500,166 V194 Q500,202 508,202 H546" fill="none" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>

  <!-- 底部两步 -->
  <rect x="40" y="284" width="860" height="28" rx="6" fill="#f5f5f5"/>
  <text x="470" y="303" text-anchor="middle" fill="#424242" font-size="11" font-weight="bold">① 在二级索引定位 name='Tom'，取出 id=5 → ② 拿 id=5 回聚簇索引，取出完整行</text>
</svg>
