<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrOrange" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="470" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">自适应哈希索引（AHI）：热点等值查询从走树变直达</text>

  <!-- 左：B+ 树查找 -->
  <rect x="40" y="56" width="430" height="270" rx="8" fill="#fafafa" stroke="#1565c0" stroke-width="1.4"/>
  <text x="255" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">B+ 树查找 · O(log N)</text>

  <rect x="200" y="100" width="110" height="36" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="255" y="123" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">根页</text>

  <rect x="90" y="156" width="90" height="36" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="135" y="179" text-anchor="middle" fill="#0d47a1" font-size="11">内部页</text>
  <rect x="210" y="156" width="90" height="36" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="255" y="179" text-anchor="middle" fill="#0d47a1" font-size="11">内部页</text>
  <rect x="330" y="156" width="90" height="36" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="375" y="179" text-anchor="middle" fill="#0d47a1" font-size="11">内部页</text>

  <rect x="79" y="212" width="64" height="36" rx="4" fill="#f5f5f5" stroke="#90caf9" stroke-width="1"/>
  <text x="111" y="235" text-anchor="middle" fill="#555555" font-size="10">叶页</text>
  <rect x="151" y="212" width="64" height="36" rx="4" fill="#f5f5f5" stroke="#90caf9" stroke-width="1"/>
  <text x="183" y="235" text-anchor="middle" fill="#555555" font-size="10">叶页</text>
  <rect x="223" y="212" width="64" height="36" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="255" y="235" text-anchor="middle" fill="#1b5e20" font-size="10" font-weight="bold">叶页</text>
  <rect x="295" y="212" width="64" height="36" rx="4" fill="#f5f5f5" stroke="#90caf9" stroke-width="1"/>
  <text x="327" y="235" text-anchor="middle" fill="#555555" font-size="10">叶页</text>
  <rect x="367" y="212" width="64" height="36" rx="4" fill="#f5f5f5" stroke="#90caf9" stroke-width="1"/>
  <text x="399" y="235" text-anchor="middle" fill="#555555" font-size="10">叶页</text>

  <!-- 走树路径（无箭头的高亮连线） -->
  <line x1="255" y1="136" x2="255" y2="156" stroke="#e65100" stroke-width="2"/>
  <line x1="255" y1="192" x2="255" y2="212" stroke="#e65100" stroke-width="2"/>

  <text x="255" y="280" text-anchor="middle" fill="#555555" font-size="10">从根走到叶：每步都要比较</text>
  <text x="255" y="300" text-anchor="middle" fill="#555555" font-size="10">路径长，等值查询也要走完</text>

  <!-- 右：AHI 哈希直达 -->
  <rect x="510" y="56" width="390" height="270" rx="8" fill="#fafafa" stroke="#e65100" stroke-width="1.4"/>
  <text x="705" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#bf360c">AHI 哈希直达 · O(1)</text>

  <rect x="540" y="120" width="90" height="40" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="585" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">id = 500</text>

  <line x1="630" y1="140" x2="660" y2="140" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>

  <rect x="674" y="120" width="110" height="40" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1.2"/>
  <text x="729" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">哈希桶</text>

  <line x1="784" y1="140" x2="814" y2="140" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>

  <rect x="828" y="120" width="66" height="40" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="861" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">目标行</text>

  <text x="705" y="210" text-anchor="middle" fill="#555555" font-size="10">一次哈希直接定位，无需走树</text>
  <text x="705" y="230" text-anchor="middle" fill="#555555" font-size="10">只为热点页建立，所以叫「自适应」</text>
  <text x="705" y="250" text-anchor="middle" fill="#555555" font-size="10">监控到频繁等值查询 → 自动建、自动用</text>

  <!-- 底部边界条件 -->
  <rect x="40" y="346" width="860" height="44" rx="8" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.2"/>
  <text x="470" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">只对等值查询有效：范围查询（&gt;、BETWEEN）仍走 B+ 树</text>
  <text x="470" y="383" text-anchor="middle" fill="#555555" font-size="10">高并发写入下 AHI 锁竞争明显时，可 SET GLOBAL innodb_adaptive_hash_index = OFF</text>
</svg>
