<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#757575"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <text x="470" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Change Buffer：把「为写而读」推迟到页被读入时</text>

  <!-- 朴素做法 -->
  <text x="40" y="58" font-size="12" font-weight="bold" fill="#c62828">朴素做法：立刻读磁盘</text>

  <rect x="60" y="70" width="140" height="52" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="1.4"/>
  <text x="130" y="101" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">写（改聚簇索引）</text>

  <line x1="200" y1="96" x2="230" y2="96" stroke="#757575" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <rect x="244" y="70" width="190" height="52" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.4"/>
  <text x="339" y="101" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">读二级索引页（磁盘）</text>

  <line x1="434" y1="96" x2="464" y2="96" stroke="#757575" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <rect x="478" y="70" width="120" height="52" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="1.4"/>
  <text x="538" y="101" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">修改页</text>

  <line x1="598" y1="96" x2="628" y2="96" stroke="#757575" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <rect x="642" y="70" width="140" height="52" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="1.4"/>
  <text x="712" y="101" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">刷盘</text>

  <!-- 省下的 IO -->
  <rect x="60" y="144" width="800" height="36" rx="8" fill="#fff8e1" stroke="#e65100" stroke-width="1.2"/>
  <text x="460" y="167" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">Change Buffer 省掉的正是这一步：一次「为写而读」的磁盘 IO</text>

  <!-- Change Buffer 做法 -->
  <text x="40" y="214" font-size="12" font-weight="bold" fill="#0d47a1">Change Buffer：先记账，晚点合并</text>

  <rect x="40" y="226" width="140" height="52" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="1.4"/>
  <text x="110" y="257" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">写（改聚簇索引）</text>

  <line x1="180" y1="252" x2="210" y2="252" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrBlue)"/>

  <rect x="224" y="226" width="230" height="52" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="339" y="257" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">记录修改到 Change Buffer</text>

  <line x1="454" y1="252" x2="484" y2="252" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrBlue)"/>

  <rect x="498" y="226" width="230" height="52" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.4"/>
  <text x="613" y="257" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">索引页被读入时 merge</text>

  <line x1="728" y1="252" x2="758" y2="252" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrBlue)"/>

  <rect x="772" y="226" width="140" height="52" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="1.4"/>
  <text x="842" y="257" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">刷盘</text>

  <!-- 适用范围 -->
  <rect x="60" y="302" width="852" height="44" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.2"/>
  <text x="486" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#6a1b9a">只对非唯一二级索引生效</text>
  <text x="486" y="338" text-anchor="middle" fill="#555555" font-size="10">聚簇索引必须立即改行 · 唯一索引必须立即读页校验唯一性</text>
</svg>
