<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 280" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="470" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Checkpoint：推进标记与可覆盖区域</text>

  <!-- redo 文件三段 -->
  <rect x="80" y="110" width="280" height="64" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="220" y="146" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="bold">已刷盘部分</text>

  <rect x="360" y="110" width="280" height="64" fill="#ffcc80" stroke="#e65100" stroke-width="1.4"/>
  <text x="500" y="146" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="bold">未刷盘部分</text>

  <rect x="640" y="110" width="220" height="64" fill="#eceff1" stroke="#90a4ae" stroke-width="1.4"/>
  <text x="750" y="146" text-anchor="middle" fill="#546e7a" font-size="12" font-weight="bold">空闲</text>

  <!-- checkpoint 游标 -->
  <text x="360" y="76" text-anchor="middle" fill="#e65100" font-size="12" font-weight="bold">checkpoint LSN</text>
  <line x1="360" y1="84" x2="360" y2="106" stroke="#e65100" stroke-width="1.8"/>

  <!-- 段说明 -->
  <text x="360" y="216" text-anchor="middle" fill="#8d6e63" font-size="10">之前的日志可安全覆盖</text>
  <text x="220" y="216" text-anchor="middle" fill="#2e7d32" font-size="10">可覆盖</text>
  <text x="500" y="216" text-anchor="middle" fill="#bf360c" font-size="10">恢复要用，不可覆盖</text>
  <text x="750" y="216" text-anchor="middle" fill="#78909c" font-size="10">等待写入</text>

  <!-- 底部 -->
  <rect x="80" y="234" width="780" height="34" rx="8" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.2"/>
  <text x="470" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">Checkpoint 推进 = 脏页批量刷盘后移动标记；标记停住 = 未刷盘部分持续变大，最终写满</text>
</svg>
