<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#757575"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2e7d32"/>
    </marker>
  </defs>

  <text x="470" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">索引失效的判定框架：两个问题决定走不走索引</text>

  <!-- 主链 -->
  <rect x="40" y="110" width="150" height="56" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="1.4"/>
  <text x="115" y="143" text-anchor="middle" fill="#424242" font-size="12" font-weight="bold">查询条件</text>

  <line x1="196" y1="138" x2="236" y2="138" stroke="#757575" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <rect x="250" y="100" width="210" height="76" rx="6" fill="#fff8e1" stroke="#e65100" stroke-width="1.4"/>
  <text x="355" y="143" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="bold">能翻译成有序区间？</text>

  <line x1="466" y1="138" x2="506" y2="138" stroke="#757575" stroke-width="1.8" marker-end="url(#arrGray)"/>
  <text x="486" y="128" text-anchor="middle" fill="#1b5e20" font-size="10" font-weight="bold">是</text>

  <rect x="520" y="100" width="210" height="76" rx="6" fill="#fff8e1" stroke="#e65100" stroke-width="1.4"/>
  <text x="625" y="134" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="bold">回表代价 &lt; 全表扫描？</text>
  <text x="625" y="156" text-anchor="middle" fill="#8d6e63" font-size="10">优化器的成本估算</text>

  <line x1="736" y1="138" x2="776" y2="138" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <text x="756" y="128" text-anchor="middle" fill="#1b5e20" font-size="10" font-weight="bold">是</text>

  <rect x="790" y="110" width="110" height="56" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="845" y="143" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="bold">使用索引</text>

  <!-- 否分支（结构连线，无箭头） -->
  <line x1="355" y1="176" x2="355" y2="250" stroke="#c62828" stroke-width="1.6" stroke-dasharray="6,5"/>
  <text x="368" y="220" fill="#c62828" font-size="11" font-weight="bold">否</text>

  <line x1="625" y1="176" x2="625" y2="250" stroke="#c62828" stroke-width="1.6" stroke-dasharray="6,5"/>
  <text x="638" y="220" fill="#c62828" font-size="11" font-weight="bold">否</text>

  <rect x="250" y="250" width="240" height="110" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.4"/>
  <text x="370" y="280" text-anchor="middle" fill="#b71c1c" font-size="12" font-weight="bold">无法使用索引（条件类失效）</text>
  <text x="370" y="306" text-anchor="middle" fill="#555555" font-size="10">函数操作 · 隐式类型转换 · 左模糊</text>
  <text x="370" y="326" text-anchor="middle" fill="#555555" font-size="10">范围之后的列 · 单侧 OR</text>

  <rect x="560" y="250" width="240" height="110" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.4"/>
  <text x="680" y="280" text-anchor="middle" fill="#b71c1c" font-size="12" font-weight="bold">优化器主动放弃（成本类）</text>
  <text x="680" y="306" text-anchor="middle" fill="#555555" font-size="10">!= / NOT IN：剩余行太多</text>
  <text x="680" y="326" text-anchor="middle" fill="#555555" font-size="10">IS NOT NULL：取决于 NULL 占比</text>
</svg>
