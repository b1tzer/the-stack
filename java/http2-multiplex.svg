<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 663 323" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10">
  <text x="332" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">HTTP/2 多路复用 vs HTTP/1.1 串行</text>

  <!-- Left: HTTP/1.1 串行 -->
  <text x="162" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">HTTP/1.1（串行 / 队头阻塞）</text>
  <g transform="translate(30, 70)">
    <!-- Timeline -->
    <line x1="0" y1="0" x2="272" y2="0" stroke="#bdbdbd" stroke-width="0.8"/>
    <text x="-10" y="3" font-size="8" fill="#999999">t</text>

    <!-- Request 1 -->
    <rect x="0" y="12" width="85" height="26" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="0.8"/>
    <text x="42" y="28" text-anchor="middle" font-size="9" fill="#b71c1c" font-weight="bold">请求 1</text>
    <rect x="85" y="12" width="68" height="26" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="0.8"/>
    <text x="119" y="28" text-anchor="middle" font-size="9" fill="#b71c1c">响应 1</text>

    <!-- Request 2 -->
    <rect x="153" y="12" width="51" height="26" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="0.8"/>
    <text x="178" y="28" text-anchor="middle" font-size="9" fill="#b71c1c" font-weight="bold">请求 2</text>
    <rect x="204" y="12" width="42" height="26" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="0.8"/>
    <text x="225" y="28" text-anchor="middle" font-size="9" fill="#b71c1c">响应 2</text>

    <!-- Waiting indicator -->
    <rect x="85" y="44" width="68" height="19" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="119" y="57" text-anchor="middle" font-size="8" fill="#c62828">⏳ 等待响应 1</text>

    <!-- Problems -->
    <text x="0" y="85" font-size="9" fill="#c62828">❌ 请求必须排队等前一个响应</text>
    <text x="0" y="100" font-size="9" fill="#c62828">❌ 响应严格按请求顺序返回</text>
    <text x="0" y="116" font-size="9" fill="#c62828">❌ 一个慢请求阻塞所有后续</text>
  </g>

  <!-- Right: HTTP/2 多路复用 -->
  <text x="484" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">HTTP/2（多路复用）</text>
  <g transform="translate(410, 70)">
    <!-- Single TCP connection -->
    <rect x="0" y="0" width="289" height="136" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
    <text x="144" y="17" text-anchor="middle" font-size="10" fill="#0d47a1" font-weight="bold">单个 TCP 连接</text>

    <!-- Stream 1 -->
    <rect x="14" y="26" width="51" height="20" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="0.8"/>
    <text x="39" y="39" text-anchor="middle" font-size="8" fill="#0d47a1">S1 请求</text>
    <rect x="65" y="26" width="34" height="20" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="0.8"/>
    <text x="82" y="39" text-anchor="middle" font-size="8" fill="#0d47a1">帧</text>
    <rect x="99" y="26" width="34" height="20" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="0.8"/>
    <text x="116" y="39" text-anchor="middle" font-size="8" fill="#0d47a1">帧</text>

    <!-- Stream 2 -->
    <rect x="14" y="51" width="34" height="20" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8"/>
    <text x="31" y="65" text-anchor="middle" font-size="8" fill="#1b5e20">S2</text>
    <rect x="48" y="51" width="42" height="20" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8"/>
    <text x="69" y="65" text-anchor="middle" font-size="8" fill="#1b5e20">请求</text>
    <rect x="90" y="51" width="26" height="20" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8"/>
    <text x="103" y="65" text-anchor="middle" font-size="8" fill="#1b5e20">帧</text>

    <!-- Stream 3 -->
    <rect x="14" y="76" width="26" height="20" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
    <text x="26" y="90" text-anchor="middle" font-size="8" fill="#bf360c">S3</text>
    <rect x="39" y="76" width="34" height="20" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
    <text x="56" y="90" text-anchor="middle" font-size="8" fill="#bf360c">请求</text>
    <rect x="73" y="76" width="51" height="20" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
    <text x="99" y="90" text-anchor="middle" font-size="8" fill="#bf360c">响应帧</text>

    <!-- Interleaving note -->
    <text x="144" y="119" text-anchor="middle" font-size="8" fill="#1565c0">帧可以交错传输，按 Stream ID 重组</text>
    <text x="144" y="131" text-anchor="middle" font-size="8" fill="#1565c0">Stream 1 的大文件不会阻塞 Stream 3 的小文件</text>
  </g>

  <!-- Benefits -->
  <g transform="translate(410, 240)">
    <text x="0" y="0" font-size="9" fill="#1565c0">✅ 多个请求/响应并行交错</text>
    <text x="0" y="15" font-size="9" fill="#1565c0">✅ 无应用层队头阻塞</text>
    <text x="0" y="31" font-size="9" fill="#1565c0">✅ 单 TCP 连接，减少握手开销</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 290)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="0.8"/>
    <text x="15" y="9" font-size="8" fill="#333333">Stream 1 (GET /index.html)</text>
    <rect x="153" y="0" width="10" height="10" rx="2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8"/>
    <text x="168" y="9" font-size="8" fill="#333333">Stream 2 (GET /style.css)</text>
    <rect x="306" y="0" width="10" height="10" rx="2" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
    <text x="321" y="9" font-size="8" fill="#333333">Stream 3 (GET /app.js)</text>
  </g>
</svg>
