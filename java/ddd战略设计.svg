<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 442" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10">
  <defs>
    <marker id="arD1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666666"/>
    </marker>
  </defs>

  <text x="298" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">DDD 战略设计：绞杀者模式渐进改造</text>

  <!-- Phase 1 -->
  <text x="298" y="51" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">阶段 1：选择一个子域开始</text>
  <g transform="translate(100,72)">
    <rect x="0" y="0" width="425" height="153" rx="7" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="1.3"/>
    <text x="212" y="19" text-anchor="middle" font-size="11" fill="#666666">单体 CRUD 系统</text>
    <!-- DDD zone -->
    <rect x="17" y="31" width="391" height="68" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3" stroke-dasharray="6,3"/>
    <text x="212" y="46" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">订单子域（用 DDD 重写）</text>
    <rect x="34" y="54" width="119" height="31" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8"/>
    <text x="94" y="73" text-anchor="middle" font-size="9" fill="#1b5e20">新领域模型</text>
    <rect x="187" y="54" width="119" height="31" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8"/>
    <text x="246" y="73" text-anchor="middle" font-size="9" fill="#1b5e20">防腐层 (ACL)</text>
    <!-- Arrows down -->
    <line x1="94" y1="88" x2="94" y2="107" stroke="#666666" stroke-width="1" marker-end="url(#arD1)"/>
    <line x1="246" y1="88" x2="246" y2="107" stroke="#666666" stroke-width="1" marker-end="url(#arD1)"/>
    <!-- Other subdomains -->
    <rect x="34" y="110" width="357" height="31" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
    <text x="212" y="129" text-anchor="middle" font-size="10" fill="#bf360c">其他子域（仍然是 CRUD）</text>
  </g>

  <!-- Phase 2 -->
  <text x="298" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">阶段 2：逐步扩大 DDD 范围</text>
  <g transform="translate(100,300)">
    <rect x="0" y="0" width="425" height="68" rx="7" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="1.3"/>
    <rect x="17" y="10" width="187" height="48" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
    <text x="110" y="31" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">DDD 区域扩大</text>
    <text x="110" y="46" text-anchor="middle" font-size="8" fill="#2e7d32">订单 + 支付 + 库存</text>
    <rect x="221" y="10" width="187" height="48" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
    <text x="314" y="31" text-anchor="middle" font-size="10" fill="#bf360c">剩余 CRUD 子域</text>
    <text x="314" y="46" text-anchor="middle" font-size="8" fill="#e65100">逐步迁移中</text>
  </g>

  <!-- Phase 3 -->
  <text x="298" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">阶段 3：最终替换整个单体</text>
  <g transform="translate(100,428)">
    <rect x="0" y="0" width="425" height="51" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7"/>
    <text x="212" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">全新 DDD 架构</text>
    <text x="212" y="41" text-anchor="middle" font-size="9" fill="#2e7d32">所有子域均已领域建模，单体完全替换</text>
  </g>

  <!-- Down arrows between phases -->
  <line x1="298" y1="221" x2="298" y2="238" stroke="#1565c0" stroke-width="1.3" marker-end="url(#arD1)"/>
  <line x1="298" y1="330" x2="298" y2="357" stroke="#1565c0" stroke-width="1.3" marker-end="url(#arD1)"/>

  <!-- Side note -->
  <g transform="translate(30,300)">
    <rect x="0" y="0" width="51" height="68" rx="3" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="0.8"/>
    <text x="26" y="24" text-anchor="middle" font-size="8" fill="#4a148c">关键</text>
    <text x="26" y="37" text-anchor="middle" font-size="8" fill="#4a148c">原则：</text>
    <text x="26" y="51" text-anchor="middle" font-size="8" fill="#4a148c">ACL</text>
    <text x="26" y="63" text-anchor="middle" font-size="8" fill="#4a148c">隔离</text>
  </g>
</svg>