<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10">
<defs>
  <marker id="arGray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#666666"/>
  </marker>
  <marker id="arBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/>
  </marker>
  <marker id="arOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#e65100"/>
  </marker>
</defs>

<text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">网络分区发生时，读从节点必须二选一</text>

<!-- 客户端 -->
<g transform="translate(250,48)">
  <rect x="0" y="0" width="180" height="50" rx="5" fill="#eceff1" stroke="#546e7a" stroke-width="1.3"/>
  <text x="90" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474f">客户端</text>
</g>

<!-- 主节点 N1 -->
<g transform="translate(40,140)">
  <rect x="0" y="0" width="180" height="58" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="90" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">主节点 N1</text>
  <text x="90" y="44" text-anchor="middle" font-size="10" fill="#1565c0">已写入 x = 2</text>
</g>

<!-- 从节点 N2 -->
<g transform="translate(460,140)">
  <rect x="0" y="0" width="180" height="58" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="90" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">从节点 N2</text>
  <text x="90" y="44" text-anchor="middle" font-size="10" fill="#2e7d32">仍持有 x = 1</text>
</g>

<!-- 网络分区断线 -->
<line x1="220" y1="169" x2="460" y2="169" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="340" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">网络分区，同步中断</text>

<!-- 客户端读请求 → 从节点 -->
<path d="M340,98 L340,128 L550,128 L550,138" fill="none" stroke="#666666" stroke-width="1.3" marker-end="url(#arGray)"/>

<!-- 从节点 → CP / AP 两条分支 -->
<path d="M550,198 L550,226 L180,226 L180,244" fill="none" stroke="#1565c0" stroke-width="1.3" marker-end="url(#arBlue)"/>
<path d="M550,198 L550,226 L480,226 L480,244" fill="none" stroke="#e65100" stroke-width="1.3" marker-end="url(#arOrange)"/>

<!-- CP 框 -->
<g transform="translate(40,246)">
  <rect x="0" y="0" width="280" height="72" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="140" y="26" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">选择 CP：拒绝服务，返回错误</text>
  <text x="140" y="48" text-anchor="middle" font-size="9" fill="#1565c0">牺牲可用性 —— 宁可不响应，也不返回旧数据</text>
</g>

<!-- AP 框 -->
<g transform="translate(340,246)">
  <rect x="0" y="0" width="280" height="72" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="140" y="26" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">选择 AP：返回 x = 1（旧数据）</text>
  <text x="140" y="48" text-anchor="middle" font-size="9" fill="#e65100">牺牲一致性 —— 返回过时数据，但不拒绝请求</text>
</g>
</svg>
