<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 323" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="221" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Selector 多路复用器</text>
  <!-- Selector thread -->
  <rect x="136" y="42" width="170" height="51" rx="7" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.7"/>
  <text x="221" y="65" text-anchor="middle" fill="#4a148c" font-weight="bold">Selector 线程</text>
  <text x="221" y="82" text-anchor="middle" fill="#666666" font-size="10">select() 阻塞等待事件</text>
  <!-- Channels -->
  <rect x="34" y="170" width="102" height="60" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="85" y="194" text-anchor="middle" fill="#0d47a1" font-weight="bold">Channel 1</text>
  <text x="85" y="211" text-anchor="middle" fill="#666666" font-size="10">可读事件 ✓</text>
  <text x="85" y="224" text-anchor="middle" fill="#888888" font-size="9">客户端连接</text>
  <rect x="170" y="170" width="102" height="60" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="221" y="194" text-anchor="middle" fill="#1b5e20" font-weight="bold">Channel 2</text>
  <text x="221" y="211" text-anchor="middle" fill="#666666" font-size="10">可写事件 ✓</text>
  <text x="221" y="224" text-anchor="middle" fill="#888888" font-size="9">客户端连接</text>
  <rect x="306" y="170" width="102" height="60" rx="7" fill="#eceff1" stroke="#bdbdbd" stroke-width="1.3"/>
  <text x="357" y="194" text-anchor="middle" fill="#333333" font-weight="bold">Channel N</text>
  <text x="357" y="211" text-anchor="middle" fill="#999999" font-size="10">无事件</text>
  <text x="357" y="224" text-anchor="middle" fill="#888888" font-size="9">客户端连接</text>
  <!-- Arrows -->
  <line x1="170" y1="94" x2="85" y2="168" stroke="#1565c0" stroke-width="1.3" marker-end="url(#ar2)"/>
  <line x1="221" y1="94" x2="221" y2="168" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#ar2)"/>
  <line x1="272" y1="94" x2="357" y2="168" stroke="#bdbdbd" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#ar2)"/>
  <!-- Event labels -->
  <text x="110" y="136" fill="#1565c0" font-size="9">OP_READ</text>
  <text x="228" y="136" fill="#2e7d32" font-size="9">OP_WRITE</text>
  <!-- Footer -->
  <text x="221" y="264" text-anchor="middle" fill="#888888" font-size="10">一个线程通过 select() 同时监听多个 Channel 的 I/O 事件</text>
  <text x="221" y="280" text-anchor="middle" fill="#888888" font-size="10">只有就绪的 Channel 才会被处理，无需为每个连接阻塞一个线程</text>
  <defs><marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#555555"/></marker></defs>
</svg>