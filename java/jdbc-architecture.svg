<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 408" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color: #1565c0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color: #1565c0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect x="68" y="17" width="306" height="374" rx="8" fill="none" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="6,3"/>

  <!-- Layer 1: Business Code -->
  <rect x="85" y="34" width="272" height="44" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="221" y="61" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="bold">业务代码（你的 Java 代码）</text>

  <!-- Arrow -->
  <line x1="221" y1="78" x2="221" y2="94" stroke="#666666" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Layer 2: ORM -->
  <rect x="85" y="95" width="272" height="44" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="221" y="122" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="bold">ORM 框架（MyBatis / Hibernate）</text>
  <text x="357" y="122" fill="#888888" font-size="9">← 第3、4章讲的</text>

  <!-- Arrow -->
  <line x1="221" y1="139" x2="221" y2="155" stroke="#666666" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Layer 3: JDBC -->
  <rect x="85" y="156" width="272" height="44" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.7"/>
  <text x="221" y="184" text-anchor="middle" fill="#e65100" font-size="12" font-weight="bold">JDBC（java.sql.*）</text>
  <text x="357" y="184" fill="#888888" font-size="9">← 本章讲的</text>

  <!-- Arrow -->
  <line x1="221" y1="201" x2="221" y2="216" stroke="#666666" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Layer 4: JDBC Driver -->
  <rect x="85" y="218" width="272" height="44" rx="5" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.3"/>
  <text x="221" y="245" text-anchor="middle" fill="#4a148c" font-size="12" font-weight="bold">JDBC 驱动（mysql-connector-java 等）</text>

  <!-- Arrow -->
  <line x1="221" y1="262" x2="221" y2="277" stroke="#666666" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Layer 5: Protocol -->
  <rect x="85" y="279" width="272" height="44" rx="5" fill="#eceff1" stroke="#bdbdbd" stroke-width="1.3"/>
  <text x="221" y="306" text-anchor="middle" fill="#333333" font-size="12" font-weight="bold">数据库通信协议（TCP/IP）</text>
  <text x="357" y="306" fill="#888888" font-size="9">← 第四卷讲的</text>

  <!-- Arrow -->
  <line x1="221" y1="323" x2="221" y2="338" stroke="#666666" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Layer 6: Database -->
  <rect x="85" y="340" width="272" height="44" rx="5" fill="#ffcdd2" stroke="#c62828" stroke-width="1.3"/>
  <text x="221" y="367" text-anchor="middle" fill="#b71c1c" font-size="12" font-weight="bold">数据库服务器（MySQL / Oracle / PG）</text>
</svg>