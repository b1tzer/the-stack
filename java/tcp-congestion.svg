<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 561 340" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow-axis" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">TCP 拥塞控制示意图</text>

  <!-- Axes -->
  <line x1="68" y1="289" x2="527" y2="289" stroke="#555555" stroke-width="1.7" marker-end="url(#arrow-axis)"/>
  <line x1="68" y1="289" x2="68" y2="42" stroke="#555555" stroke-width="1.7" marker-end="url(#arrow-axis)"/>

  <!-- Axis labels -->
  <text x="298" y="319" text-anchor="middle" font-size="12" fill="#555555">时间</text>
  <text x="47" y="170" text-anchor="middle" font-size="12" fill="#555555" transform="rotate(-90,55,200)">cwnd</text>

  <!-- ssthresh dashed line -->
  <line x1="68" y1="128" x2="510" y2="128" stroke="#c62828" stroke-width="0.8" stroke-dasharray="8,4"/>
  <text x="514" y="123" font-size="10" fill="#c62828">ssthresh</text>

  <!-- Phase 1: Slow Start (exponential) -->
  <path d="M80,330 Q120,320 140,290 Q160,250 180,200 Q195,165 210,150" fill="none" stroke="#1565c0" stroke-width="2.1"/>
  <!-- Phase label -->
  <text x="128" y="264" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="bold">慢启动</text>
  <text x="128" y="276" text-anchor="middle" font-size="9" fill="#0d47a1">指数增长</text>

  <!-- Phase 2: Congestion Avoidance (linear) -->
  <path d="M210,150 L380,100" fill="none" stroke="#2e7d32" stroke-width="2.1"/>
  <!-- Phase label -->
  <text x="255" y="102" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="bold">拥塞避免</text>
  <text x="255" y="115" text-anchor="middle" font-size="9" fill="#1b5e20">线性增长</text>

  <!-- Timeout / packet loss point -->
  <circle cx="380" cy="100" r="5" fill="#c62828"/>
  <text x="336" y="81" font-size="9" fill="#c62828">超时/丢包</text>
  <line x1="323" y1="89" x2="323" y2="212" stroke="#c62828" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Phase 3: Fast Recovery -->
  <path d="M380,250 L420,230 L560,190" fill="none" stroke="#e65100" stroke-width="2.1"/>
  <!-- Phase label -->
  <text x="400" y="183" text-anchor="middle" font-size="10" fill="#e65100" font-weight="bold">快速恢复</text>
  <text x="400" y="196" text-anchor="middle" font-size="9" fill="#bf360c">cwnd = ssthresh + 3</text>

  <!-- Arrow annotations -->
  <!-- Slow start arrow -->
  <line x1="85" y1="255" x2="110" y2="221" stroke="#1565c0" stroke-width="0.8" marker-end="url(#arrow-axis)"/>

  <!-- Congestion avoidance arrow -->
  <line x1="221" y1="110" x2="264" y2="94" stroke="#2e7d32" stroke-width="0.8" marker-end="url(#arrow-axis)"/>

  <!-- Fast recovery arrow -->
  <line x1="366" y1="200" x2="400" y2="183" stroke="#e65100" stroke-width="0.8" marker-end="url(#arrow-axis)"/>

  <!-- Legend box -->
  <rect x="374" y="47" width="153" height="68" rx="5" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="0.8"/>
  <circle cx="460" cy="75" r="4" fill="#1565c0"/>
  <text x="400" y="67" font-size="9" fill="#555555">慢启动（指数增长）</text>
  <circle cx="460" cy="95" r="4" fill="#2e7d32"/>
  <text x="400" y="84" font-size="9" fill="#555555">拥塞避免（线性增长）</text>
  <circle cx="460" cy="115" r="4" fill="#e65100"/>
  <text x="400" y="101" font-size="9" fill="#555555">快速恢复</text>
</svg>