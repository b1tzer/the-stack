<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10">
<defs>
  <marker id="arGray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#666666"/>
  </marker>
  <marker id="arOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#e65100"/>
  </marker>
  <marker id="arGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2e7d32"/>
  </marker>
</defs>

<text x="380" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">电商下单的 BASE 实践：基本可用 → 软状态 → 最终一致</text>

<!-- 段1：基本可用 -->
<g transform="translate(20,44)">
  <rect x="0" y="0" width="220" height="258" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="14" y="20" font-size="11" font-weight="bold" fill="#37474f">基本可用</text>

  <rect x="20" y="34" width="180" height="40" rx="5" fill="#eceff1" stroke="#546e7a" stroke-width="1.2"/>
  <text x="110" y="59" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">用户下单</text>
  <line x1="110" y1="74" x2="110" y2="90" stroke="#666666" stroke-width="1.2" marker-end="url(#arGray)"/>

  <rect x="20" y="90" width="180" height="40" rx="5" fill="#eceff1" stroke="#546e7a" stroke-width="1.2"/>
  <text x="110" y="115" text-anchor="middle" font-size="11" fill="#37474f">创建订单（本地事务）</text>
  <line x1="110" y1="130" x2="110" y2="146" stroke="#666666" stroke-width="1.2" marker-end="url(#arGray)"/>

  <rect x="20" y="146" width="180" height="52" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.2"/>
  <text x="110" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#795548">库存服务是否可用？</text>

  <text x="110" y="226" text-anchor="middle" font-size="9" fill="#2e7d32">可用 → 同步扣减，立即一致</text>
</g>

<!-- 段2：软状态 -->
<g transform="translate(270,44)">
  <rect x="0" y="0" width="220" height="258" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="14" y="20" font-size="11" font-weight="bold" fill="#37474f">软状态</text>

  <rect x="20" y="70" width="180" height="90" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="110" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">订单已支付</text>
  <text x="110" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">库存待扣减</text>
  <text x="110" y="144" text-anchor="middle" font-size="9" fill="#e65100">（软状态：数据暂时不一致）</text>
</g>

<!-- 段3：最终一致 -->
<g transform="translate(520,44)">
  <rect x="0" y="0" width="220" height="258" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="14" y="20" font-size="11" font-weight="bold" fill="#37474f">最终一致</text>

  <rect x="20" y="40" width="180" height="44" rx="5" fill="#eceff1" stroke="#546e7a" stroke-width="1.2"/>
  <text x="110" y="67" text-anchor="middle" font-size="11" fill="#37474f">MQ 消费者扣减库存</text>
  <line x1="110" y1="84" x2="110" y2="104" stroke="#666666" stroke-width="1.2" marker-end="url(#arGray)"/>

  <rect x="20" y="104" width="180" height="90" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="110" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">订单已支付</text>
  <text x="110" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">库存已扣减</text>
  <text x="110" y="178" text-anchor="middle" font-size="9" fill="#2e7d32">（最终一致：数据补齐）</text>
</g>

<!-- 段1 → 段2：降级 -->
<path d="M200,172 L240,172 L240,115 L268,115" fill="none" stroke="#e65100" stroke-width="1.3" marker-end="url(#arOrange)"/>
<text x="234" y="162" text-anchor="middle" font-size="9" font-weight="bold" fill="#e65100">不可用</text>
<text x="250" y="100" text-anchor="middle" font-size="9" fill="#e65100">发 MQ 降级</text>

<!-- 段2 → 段3：异步消费 -->
<path d="M470,115 L490,115 L500,115 L518,66" fill="none" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#arGreen)"/>
<text x="494" y="100" text-anchor="middle" font-size="9" fill="#2e7d32">异步消费</text>
</svg>
