<svg xmlns="http://www.w3.org/2000/svg" width="580" viewBox="0 0 580 270" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <!-- 进程外框 -->
  <rect x="8" y="8" width="564" height="254" rx="10" fill="#eef4fb" stroke="#1565c0" stroke-width="1.6"/>
  <text x="290" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">进程（Process）</text>

  <!-- 线程 A -->
  <rect x="24" y="46" width="170" height="104" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="109" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">线程 A</text>
  <rect x="36" y="76" width="146" height="28" rx="4" fill="#ffffff" stroke="#9ccc9c" stroke-width="0.8"/>
  <text x="109" y="94" text-anchor="middle" font-size="10" fill="#333333">栈 A</text>
  <text x="109" y="126" text-anchor="middle" font-size="10" fill="#555555">PC / 寄存器</text>

  <!-- 线程 B -->
  <rect x="204" y="46" width="170" height="104" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="289" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">线程 B</text>
  <rect x="216" y="76" width="146" height="28" rx="4" fill="#ffffff" stroke="#9ccc9c" stroke-width="0.8"/>
  <text x="289" y="94" text-anchor="middle" font-size="10" fill="#333333">栈 B</text>
  <text x="289" y="126" text-anchor="middle" font-size="10" fill="#555555">PC / 寄存器</text>

  <!-- 线程 C -->
  <rect x="384" y="46" width="170" height="104" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="469" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">线程 C</text>
  <rect x="396" y="76" width="146" height="28" rx="4" fill="#ffffff" stroke="#9ccc9c" stroke-width="0.8"/>
  <text x="469" y="94" text-anchor="middle" font-size="10" fill="#333333">栈 C</text>
  <text x="469" y="126" text-anchor="middle" font-size="10" fill="#555555">PC / 寄存器</text>

  <!-- 共享内存 -->
  <rect x="24" y="168" width="260" height="86" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.3"/>
  <text x="154" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">共享内存区域</text>
  <text x="154" y="210" text-anchor="middle" font-size="10" fill="#555555">堆（Heap）</text>
  <text x="154" y="228" text-anchor="middle" font-size="10" fill="#555555">方法区（Method Area）</text>

  <!-- 共享资源 -->
  <rect x="294" y="168" width="260" height="86" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="424" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">共享资源</text>
  <text x="424" y="210" text-anchor="middle" font-size="10" fill="#555555">文件描述符</text>
  <text x="424" y="228" text-anchor="middle" font-size="10" fill="#555555">网络连接等</text>
</svg>
