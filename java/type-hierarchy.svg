<svg xmlns="http://www.w3.org/2000/svg" width="448" viewBox="0 0 448 289" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="224" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Java 类型体系</text>

  <!-- Root: Type -->
  <rect x="164" y="41" width="119" height="37" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7"/>
  <text x="224" y="65" text-anchor="middle" fill="#0d47a1" font-weight="bold" font-size="11">Type</text>

  <!-- Branch lines -->
  <line x1="190" y1="78" x2="102" y2="110" stroke="#555555" stroke-width="1.3"/>
  <line x1="258" y1="78" x2="326" y2="110" stroke="#555555" stroke-width="1.3"/>

  <!-- Primitive -->
  <rect x="34" y="112" width="136" height="37" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="102" y="136" text-anchor="middle" fill="#1b5e20" font-weight="bold">Primitive</text>

  <!-- Reference -->
  <rect x="238" y="112" width="176" height="37" rx="7" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.3"/>
  <text x="326" y="136" text-anchor="middle" fill="#4a148c" font-weight="bold">Reference</text>

  <!-- Primitive types -->
  <line x1="68" y1="150" x2="68" y2="170" stroke="#555555" stroke-width="0.8"/>
  <line x1="102" y1="150" x2="102" y2="170" stroke="#555555" stroke-width="0.8"/>
  <line x1="136" y1="150" x2="136" y2="170" stroke="#555555" stroke-width="0.8"/>

  <rect x="34" y="172" width="31" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="49" y="189" text-anchor="middle" fill="#333333" font-size="9">int</text>
  <rect x="70" y="172" width="31" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="85" y="189" text-anchor="middle" fill="#333333" font-size="9">long</text>
  <rect x="105" y="172" width="44" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="128" y="189" text-anchor="middle" fill="#333333" font-size="9">double</text>
  <rect x="34" y="202" width="44" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="56" y="219" text-anchor="middle" fill="#333333" font-size="9">boolean</text>
  <rect x="83" y="202" width="31" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="99" y="219" text-anchor="middle" fill="#333333" font-size="9">char</text>
  <rect x="119" y="202" width="20" height="26" rx="3" fill="#eceff1" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="129" y="219" text-anchor="middle" fill="#999999" font-size="9">...</text>

  <!-- Reference types -->
  <line x1="266" y1="150" x2="266" y2="170" stroke="#555555" stroke-width="0.8"/>
  <line x1="322" y1="150" x2="322" y2="170" stroke="#555555" stroke-width="0.8"/>
  <line x1="379" y1="150" x2="379" y2="170" stroke="#555555" stroke-width="0.8"/>

  <rect x="246" y="172" width="40" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="266" y="189" text-anchor="middle" fill="#333333" font-size="9">Class</text>
  <rect x="293" y="172" width="58" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="322" y="189" text-anchor="middle" fill="#333333" font-size="9">Interface</text>
  <rect x="358" y="172" width="42" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="379" y="189" text-anchor="middle" fill="#333333" font-size="9">Array</text>
  <rect x="246" y="202" width="40" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="266" y="219" text-anchor="middle" fill="#333333" font-size="9">Enum</text>
  <rect x="293" y="202" width="58" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="322" y="219" text-anchor="middle" fill="#333333" font-size="9">Record</text>
  <rect x="358" y="202" width="42" height="26" rx="3" fill="#eceff1" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="379" y="219" text-anchor="middle" fill="#999999" font-size="9">...</text>
  <!-- Footer -->
  <text x="224" y="264" text-anchor="middle" fill="#888888" font-size="10">8 种基本类型是值类型，其余一切皆对象（引用类型）</text>
</svg>