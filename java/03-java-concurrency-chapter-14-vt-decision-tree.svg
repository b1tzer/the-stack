<svg width="520" height="700" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 700" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#555555"/></marker>
  </defs>
  <style>
    text{font-size:13px;fill:#333333}
    .title{font-size:16px;font-weight:bold;fill:#333333}
    .dec{font-size:13px;fill:#bf360c}
    .yes{fill:#2e7d32;font-size:13px;font-weight:bold}
    .no{fill:#c62828;font-size:13px;font-weight:bold}
    .hint{fill:#666666;font-size:12px}
  </style>

  <text x="260" y="30" text-anchor="middle" class="title">虚拟线程选型决策树</text>

  <!-- Start -->
  <ellipse cx="360" cy="55" rx="50" ry="18" fill="#ffffff" stroke="#e65100" stroke-width="1.3"/>
  <text x="360" y="60" text-anchor="middle" class="dec">提交任务</text>
  <line x1="360" y1="73" x2="360" y2="92" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- Decision 1: CPU -->
  <polygon points="360,92 470,120 360,148 250,120" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="360" y="124" text-anchor="middle" class="dec">任务是 CPU 密集吗？</text>

  <!-- Yes: 平台线程池 -->
  <line x1="250" y1="120" x2="190" y2="120" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="220" y="113" text-anchor="middle" class="yes">是</text>
  <rect x="20" y="97" rx="5" width="150" height="46" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="95" y="117" text-anchor="middle" fill="#1b5e20" font-weight="bold">平台线程池</text>
  <text x="95" y="133" text-anchor="middle" class="hint">(N_CPU + 1)</text>

  <!-- No: down -->
  <line x1="360" y1="148" x2="360" y2="182" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="372" y="168" class="no">否</text>

  <!-- Decision 2: synchronized -->
  <polygon points="360,182 470,218 360,254 250,218" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="360" y="222" text-anchor="middle" class="dec">用了 synchronized + 阻塞 IO？</text>

  <!-- Yes: to JDK -->
  <line x1="250" y1="218" x2="180" y2="218" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="215" y="211" text-anchor="middle" class="yes">是</text>

  <!-- JDK decision -->
  <polygon points="135,190 180,218 135,246 90,218" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="135" y="222" text-anchor="middle" class="dec">JDK &lt; 24？</text>

  <!-- JDK yes: down -->
  <line x1="135" y1="246" x2="135" y2="296" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="147" y="274" class="yes">是</text>
  <rect x="15" y="298" rx="5" width="240" height="46" fill="#ffcdd2" stroke="#c62828" stroke-width="1.3"/>
  <text x="135" y="317" text-anchor="middle" fill="#b71c1c" font-weight="bold">改 ReentrantLock</text>
  <text x="135" y="333" text-anchor="middle" class="hint">或使用平台线程</text>

  <!-- JDK no: to virtual thread (diagonal) -->
  <line x1="180" y1="218" x2="312" y2="316" stroke="#555555" stroke-width="1.3"/>
  <text x="225" y="255" text-anchor="middle" class="no">否</text>

  <!-- synchronized no: down to virtual thread -->
  <line x1="360" y1="254" x2="360" y2="300" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="372" y="280" class="no">否</text>

  <!-- Virtual thread -->
  <rect x="312" y="300" rx="5" width="96" height="32" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="360" y="321" text-anchor="middle" fill="#1b5e20">虚拟线程</text>

  <!-- Down to backpressure -->
  <line x1="360" y1="332" x2="360" y2="368" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- Decision 3: backpressure -->
  <polygon points="360,368 470,400 360,432 250,400" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="360" y="404" text-anchor="middle" class="dec">还需要背压吗？</text>

  <!-- Yes: VT + Semaphore -->
  <line x1="250" y1="400" x2="190" y2="400" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="220" y="393" text-anchor="middle" class="yes">是</text>
  <rect x="20" y="377" rx="5" width="150" height="46" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="95" y="396" text-anchor="middle" fill="#0d47a1" font-weight="bold">VT + Semaphore</text>
  <text x="95" y="412" text-anchor="middle" class="hint">显式限流</text>

  <!-- No: 直接用 VT -->
  <line x1="360" y1="432" x2="360" y2="476" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="372" y="458" class="no">否</text>
  <rect x="308" y="478" rx="5" width="104" height="34" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="360" y="500" text-anchor="middle" fill="#1b5e20" font-weight="bold">直接用 VT</text>

  <!-- Legend -->
  <rect x="30" y="520" rx="7" width="460" height="160" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="46" y="540" class="title" font-size="14px">速查表</text>
  <text x="46" y="562" fill="#1b5e20" font-size="13px">✅  IO 密集（DB / RPC / HTTP）→ 虚拟线程，无需调参</text>
  <text x="46" y="584" fill="#1b5e20" font-size="13px">✅  IO 密集 + 需要限流 → 虚拟线程 + Semaphore</text>
  <text x="46" y="606" fill="#1b5e20" font-size="13px">✅  CPU 密集 → 平台线程池（N_CPU + 1），虚拟线程无收益</text>
  <text x="46" y="628" fill="#c62828" font-size="13px">⚠️  synchronized + 阻塞 IO（JDK &lt; 24）→ 改 ReentrantLock 或用平台线程</text>
  <text x="46" y="650" fill="#666666" font-size="13px">💡  定时任务、需要线程亲和性的库 → 仍用平台线程池</text>
  <text x="46" y="672" fill="#666666" font-size="13px">💡  ThreadLocal 密集 → 注意百万 VT 的内存开销，考虑 ScopedValue</text>
</svg>
