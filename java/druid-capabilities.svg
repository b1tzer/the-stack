<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5f6368"/>
    </marker>
  </defs>

  <!-- 应用 -->
  <rect x="20" y="135" width="110" height="60" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="75" y="170" text-anchor="middle" font-size="15" fill="#1a1a1a">应用</text>

  <!-- DruidDataSource -->
  <rect x="180" y="70" width="380" height="190" rx="8" fill="#fef7e0" stroke="#f4b400" stroke-width="1.5"/>
  <text x="370" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">DruidDataSource</text>

  <!-- Filter 链 -->
  <rect x="195" y="112" width="108" height="44" rx="6" fill="#ffffff" stroke="#f4b400" stroke-width="1"/>
  <text x="249" y="139" text-anchor="middle" font-size="13" fill="#1a1a1a">StatFilter</text>
  <rect x="309" y="112" width="108" height="44" rx="6" fill="#ffffff" stroke="#f4b400" stroke-width="1"/>
  <text x="363" y="139" text-anchor="middle" font-size="13" fill="#1a1a1a">WallFilter</text>
  <rect x="423" y="112" width="108" height="44" rx="6" fill="#ffffff" stroke="#f4b400" stroke-width="1"/>
  <text x="477" y="139" text-anchor="middle" font-size="13" fill="#1a1a1a">LogFilter</text>

  <!-- 连接池 -->
  <text x="370" y="200" text-anchor="middle" font-size="13" fill="#5f6368">连接池：复用物理连接</text>
  <text x="370" y="224" text-anchor="middle" font-size="12" fill="#9aa0a6">max-active / min-idle / max-wait</text>

  <!-- 数据库 -->
  <rect x="630" y="135" width="110" height="60" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="685" y="170" text-anchor="middle" font-size="15" fill="#1a1a1a">数据库</text>

  <!-- 箭头 -->
  <line x1="130" y1="165" x2="176" y2="165" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="165" x2="626" y2="165" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 监控台 -->
  <rect x="180" y="288" width="380" height="44" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="370" y="306" text-anchor="middle" font-size="13" fill="#1a1a1a">StatViewServlet 监控台</text>
  <text x="370" y="322" text-anchor="middle" font-size="11" fill="#9aa0a6">SQL 统计 / 慢查询 / 数据源状态</text>

  <!-- StatFilter → 监控台 虚线 -->
  <polyline points="249,156 249,288 370,288" fill="none" stroke="#ea4335" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
