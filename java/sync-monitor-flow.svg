<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 476" width="544" height="476">
  <defs>
    <style>
      text { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
    </style>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="#2e7d32"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="#c62828"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="#666666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="272" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Monitor 工作流程：synchronized 字节码执行</text>

  <!-- Bytecode source box -->
  <rect x="17" y="38" width="238" height="153" rx="7" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="1" filter="url(#shadow)"/>
  <text x="136" y="57" text-anchor="middle" font-size="10" font-weight="bold" fill="#333333">javap -c 反编译</text>
  <text x="30" y="75" font-family="monospace" font-size="10.5" fill="#666666">public void syncBlock();</text>
  <text x="30" y="88" font-family="monospace" font-size="10.5" fill="#666666">  Code:</text>
  <text x="30" y="102" font-family="monospace" font-size="10.5" fill="#666666">    6: <tspan font-weight="bold" fill="#0d47a1">monitorenter</tspan>   ← 获取监视器</text>
  <text x="30" y="116" font-family="monospace" font-size="10.5" fill="#666666">    8: invokevirtual #3  doSomething()</text>
  <text x="30" y="129" font-family="monospace" font-size="10.5" fill="#666666">   12: <tspan font-weight="bold" fill="#2e7d32">monitorexit</tspan>    ← 正常释放</text>
  <text x="30" y="143" font-family="monospace" font-size="10.5" fill="#666666">   16: astore_2  (异常)</text>
  <text x="30" y="156" font-family="monospace" font-size="10.5" fill="#666666">   18: <tspan font-weight="bold" fill="#c62828">monitorexit</tspan>    ← 异常也释放!</text>
  <text x="30" y="170" font-family="monospace" font-size="10.5" fill="#666666">   20: athrow</text>
  <text x="30" y="185" font-size="8" fill="#888888">编译器保证生成两个 monitorexit</text>

  <!-- ObjectMonitor box -->
  <rect x="289" y="38" width="238" height="204" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="408" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">ObjectMonitor</text>

  <!-- _owner -->
  <rect x="306" y="70" width="204" height="31" rx="5" fill="#e1bee7" stroke="#7b1fa2" stroke-width="0.8"/>
  <text x="319" y="85" font-size="9" font-weight="bold" fill="#4a148c">_owner</text>
  <text x="319" y="97" font-size="8" fill="#4a148c">当前持锁线程 (CAS 写入)</text>
  <text x="489" y="89" text-anchor="end" font-family="monospace" font-size="9" fill="#7b1fa2">Thread-A</text>

  <!-- _recursions -->
  <rect x="306" y="105" width="204" height="26" rx="5" fill="#e1bee7" stroke="#7b1fa2" stroke-width="0.8"/>
  <text x="319" y="122" font-size="9" font-weight="bold" fill="#4a148c">_recursions</text>
  <text x="489" y="122" text-anchor="end" font-family="monospace" font-size="9" fill="#7b1fa2">重入计数: 1</text>

  <!-- _EntryList -->
  <rect x="306" y="138" width="204" height="34" rx="5" fill="#ffcdd2" stroke="#c62828" stroke-width="0.8"/>
  <text x="319" y="151" font-size="9" font-weight="bold" fill="#b71c1c">_EntryList</text>
  <text x="319" y="166" font-size="8" fill="#c62828">等锁队列 → BLOCKED</text>
  <text x="489" y="159" text-anchor="end" font-family="monospace" font-size="9" fill="#c62828">[B, D, ...]</text>

  <!-- _WaitSet -->
  <rect x="306" y="178" width="204" height="34" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
  <text x="319" y="192" font-size="9" font-weight="bold" fill="#bf360c">_WaitSet</text>
  <text x="319" y="207" font-size="8" fill="#e65100">等待队列 → WAITING</text>
  <text x="489" y="200" text-anchor="end" font-family="monospace" font-size="9" fill="#e65100">[C, E, ...]</text>

  <!-- Flow section title -->
  <text x="272" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">执行流程</text>

  <!-- Step boxes -->
  <!-- Step 1 -->
  <rect x="26" y="280" width="144" height="42" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="98" y="298" text-anchor="middle" font-size="9" font-weight="bold" fill="#0d47a1">① monitorenter</text>
  <text x="98" y="314" text-anchor="middle" font-size="8" fill="#1565c0">CAS 抢占 _owner</text>

  <!-- Arrow 1→2 -->
  <line x1="170" y1="302" x2="196" y2="302" stroke="#555555" stroke-width="1.3" marker-end="url(#arrowB)"/>

  <!-- Step 2 -->
  <rect x="200" y="280" width="144" height="42" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="272" y="298" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b5e20">② 执行临界区</text>
  <text x="272" y="314" text-anchor="middle" font-size="8" fill="#2e7d32">doSomething()</text>

  <!-- Arrow 2→3 -->
  <line x1="344" y1="302" x2="370" y2="302" stroke="#555555" stroke-width="1.3" marker-end="url(#arrowB)"/>

  <!-- Step 3 normal -->
  <rect x="374" y="280" width="144" height="42" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="446" y="298" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b5e20">③a monitorexit</text>
  <text x="446" y="314" text-anchor="middle" font-size="8" fill="#2e7d32">正常释放锁</text>

  <!-- Exception path -->
  <rect x="200" y="340" width="144" height="42" rx="7" fill="#ffcdd2" stroke="#c62828" stroke-width="1.3"/>
  <text x="272" y="357" text-anchor="middle" font-size="9" font-weight="bold" fill="#b71c1c">③b monitorexit</text>
  <text x="272" y="374" text-anchor="middle" font-size="8" fill="#c62828">异常路径也要释放</text>

  <!-- Arrow from step 2 down to exception -->
  <line x1="272" y1="323" x2="272" y2="340" stroke="#c62828" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowR)"/>
  <text x="285" y="336" font-size="8" fill="#c62828">异常</text>

  <!-- Arrow from step 2 to normal exit -->
  <line x1="344" y1="293" x2="370" y2="293" stroke="#2e7d32" stroke-width="1.3"/>

  <!-- Key insight callout -->
  <rect x="26" y="400" width="493" height="60" rx="7" fill="#fff3e0" stroke="#e65100" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="272" y="419" text-anchor="middle" font-size="10" font-weight="bold" fill="#bf360c">关键设计：synchronized 天然不会漏解锁</text>
  <text x="272" y="436" text-anchor="middle" font-size="9" fill="#bf360c">编译器保证生成两个 monitorexit（正常 + 异常），与手写 lock.lock()/unlock() 的核心差异</text>
  <text x="272" y="453" text-anchor="middle" font-size="9" fill="#bf360c">锁属于对象，不属于代码块 → 每个 Java 对象都能当锁</text>
</svg>
