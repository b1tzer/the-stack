<svg xmlns="http://www.w3.org/2000/svg" width="560" viewBox="0 0 560 400" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/>
    </marker>
  </defs>

  <text x="280" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">GC 可达性 ≠ 业务使用状态</text>

  <!-- GC Roots 分组 -->
  <rect x="16" y="44" width="528" height="92" rx="8" fill="#f6f8fa" stroke="#9aa4af" stroke-dasharray="5 4"/>
  <text x="30" y="64" font-size="11" fill="#57606a">GC Roots</text>
  <rect x="110" y="74" width="120" height="40" rx="7" fill="#ffffff" stroke="#c0c8d0" stroke-width="1.3"/>
  <text x="170" y="99" text-anchor="middle" fill="#24292f" font-weight="bold">静态字段</text>
  <rect x="320" y="74" width="140" height="40" rx="7" fill="#ffffff" stroke="#c0c8d0" stroke-width="1.3"/>
  <text x="390" y="99" text-anchor="middle" fill="#24292f" font-weight="bold">静态集合 / 缓存</text>

  <!-- 对象 A：可达 + 业务仍在使用 -->
  <rect x="24" y="196" width="160" height="88" rx="8" fill="#ffffff" stroke="#c0c8d0" stroke-width="1.3"/>
  <text x="104" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">对象 A</text>
  <text x="104" y="238" text-anchor="middle" font-size="10" fill="#57606a">可达</text>
  <rect x="38" y="252" width="132" height="20" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="104" y="266" text-anchor="middle" font-size="9" fill="#1b5e20">业务仍在使用</text>

  <!-- 对象 B：核心误解点，业务已弃用但仍可达 -->
  <rect x="200" y="196" width="160" height="88" rx="8" fill="#fff1f0" stroke="#DC382D" stroke-width="1.6"/>
  <text x="280" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#DC382D">对象 B</text>
  <text x="280" y="238" text-anchor="middle" font-size="10" fill="#DC382D">仍可达 · 缓存持有引用</text>
  <rect x="214" y="252" width="132" height="20" rx="10" fill="#fff3e0" stroke="#e65100"/>
  <text x="280" y="266" text-anchor="middle" font-size="9" fill="#bf360c">业务已弃用</text>

  <!-- 对象 C：不可达，可回收 -->
  <rect x="376" y="196" width="160" height="88" rx="8" fill="#f6f8fa" stroke="#c0c8d0" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="456" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#57606a">对象 C</text>
  <text x="456" y="238" text-anchor="middle" font-size="10" fill="#57606a">不可达</text>
  <rect x="418" y="252" width="76" height="20" rx="10" fill="#f6f8fa" stroke="#c0c8d0"/>
  <text x="456" y="266" text-anchor="middle" font-size="9" fill="#57606a">可回收</text>

  <!-- 引用关系 -->
  <path d="M170,114 C170,150 104,150 104,194" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M390,114 C390,150 280,150 280,194" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 底部结论 -->
  <line x1="16" y1="316" x2="544" y2="316" stroke="#C0C8D0" stroke-width="1"/>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#DC382D" font-weight="bold">业务已弃用 ≠ 不可达：对象 B 仍可达，GC 不会回收</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#57606a">可达性是 GC 的判断，业务使用是业务层的判断，两者相互独立</text>
</svg>
