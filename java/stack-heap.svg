<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 425 221" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#e65100"/></marker>
  </defs>

  <text x="212" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">栈与堆的协作关系</text>

  <!-- Stack -->
  <rect x="26" y="42" width="153" height="136" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7"/>
  <text x="102" y="65" text-anchor="middle" fill="#0d47a1" font-weight="bold" font-size="11">栈（Stack）</text>

  <!-- Stack frame -->
  <rect x="42" y="78" width="119" height="41" rx="3" fill="#ffffff" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="102" y="95" text-anchor="middle" fill="#333333" font-weight="bold">user</text>
  <text x="102" y="110" text-anchor="middle" fill="#888888" font-size="9">引用地址 → 0x7f8b</text>

  <!-- Arrow: Stack → Heap -->
  <line x1="162" y1="99" x2="236" y2="99" stroke="#e65100" stroke-width="1.7" marker-end="url(#ah)"/>

  <!-- Heap -->
  <rect x="238" y="42" width="162" height="136" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7"/>
  <text x="319" y="65" text-anchor="middle" fill="#1b5e20" font-weight="bold" font-size="11">堆（Heap）</text>

  <!-- Object -->
  <rect x="255" y="78" width="128" height="85" rx="3" fill="#ffffff" stroke="#bdbdbd" stroke-width="0.8"/>
  <rect x="255" y="78" width="128" height="24" rx="3" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="0.8"/>
  <text x="319" y="95" text-anchor="middle" fill="#4a148c" font-weight="bold" font-size="10">User 对象</text>
  <text x="264" y="117" fill="#666666" font-size="10">├─ 对象头</text>
  <text x="264" y="133" fill="#666666" font-size="10">├─ name: null</text>
  <text x="264" y="148" fill="#666666" font-size="10">└─ age: 0</text>

  <!-- Labels -->
  <text x="102" y="199" text-anchor="middle" fill="#888888" font-size="10">局部变量（基本类型 + 引用）</text>
  <text x="319" y="199" text-anchor="middle" fill="#888888" font-size="10">对象实例（new 出来的）</text>
</svg>