<svg xmlns="http://www.w3.org/2000/svg" width="560" viewBox="0 0 560 360" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11">
  <text x="280" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">内存管理责任由谁承担</text>

  <!-- 左列：C/C++ 手动管理 -->
  <rect x="16" y="44" width="256" height="216" rx="8" fill="#f6f8fa" stroke="#9aa4af" stroke-dasharray="5 4"/>
  <text x="144" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#bf360c">C/C++ 手动管理</text>
  <rect x="44" y="82" width="200" height="40" rx="7" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="144" y="107" text-anchor="middle" fill="#bf360c" font-weight="bold">开发者 malloc / free</text>
  <text x="44" y="146" font-size="10" fill="#57606a">常见风险</text>
  <circle cx="52" cy="162" r="3" fill="#c62828"/>
  <text x="62" y="166" fill="#24292f">遗漏释放 → 资源占用</text>
  <circle cx="52" cy="188" r="3" fill="#c62828"/>
  <text x="62" y="192" fill="#24292f">重复释放 → 破坏内存状态</text>
  <circle cx="52" cy="214" r="3" fill="#c62828"/>
  <text x="62" y="218" fill="#24292f">越界写入 → 覆盖其他数据</text>

  <!-- 右列：Java 自动管理 -->
  <rect x="288" y="44" width="256" height="216" rx="8" fill="#f6f8fa" stroke="#9aa4af" stroke-dasharray="5 4"/>
  <text x="416" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">Java 自动管理</text>
  <rect x="316" y="82" width="200" height="40" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="416" y="107" text-anchor="middle" fill="#0d47a1" font-weight="bold">开发者创建、使用对象</text>
  <rect x="316" y="130" width="200" height="40" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="416" y="155" text-anchor="middle" fill="#0d47a1" font-weight="bold">GC 回收不可达堆对象</text>
  <text x="416" y="204" text-anchor="middle" font-size="10" fill="#DC382D">自动回收 ≠ 没有内存泄漏</text>

  <!-- 底部结论 -->
  <line x1="16" y1="286" x2="544" y2="286" stroke="#C0C8D0" stroke-width="1"/>
  <text x="280" y="314" text-anchor="middle" fill="#24292f">Java 把部分内存管理责任交给运行时，但没有消除所有资源管理问题</text>
</svg>
