<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 357" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr-right" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
    </marker>
    <marker id="arr-left" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="298" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">TCP 三次握手</text>

  <!-- Client column -->
  <rect x="68" y="42" width="119" height="34" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7"/>
  <text x="128" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">客户端 (Client)</text>
  <line x1="128" y1="76" x2="128" y2="323" stroke="#1565c0" stroke-width="1.7" stroke-dasharray="6,3"/>

  <!-- Server column -->
  <rect x="408" y="42" width="119" height="34" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7"/>
  <text x="468" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">服务端 (Server)</text>
  <line x1="468" y1="76" x2="468" y2="323" stroke="#2e7d32" stroke-width="1.7" stroke-dasharray="6,3"/>

  <!-- Step 1: SYN -->
  <line x1="144" y1="119" x2="450" y2="119" stroke="#1565c0" stroke-width="2.1" marker-end="url(#arr-right)"/>
  <text x="298" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">① SYN, seq=x</text>
  <rect x="221" y="126" width="153" height="24" rx="3" fill="#e3f2fd" stroke="#bbdefb" stroke-width="0.8"/>
  <text x="298" y="142" text-anchor="middle" font-size="9" fill="#1565c0">我想连接你，初始序列号 x</text>

  <!-- Step 2: SYN+ACK -->
  <line x1="450" y1="187" x2="144" y2="187" stroke="#2e7d32" stroke-width="2.1" marker-end="url(#arr-left)"/>
  <text x="298" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">② SYN+ACK, seq=y, ack=x+1</text>
  <rect x="204" y="194" width="187" height="24" rx="3" fill="#e8f5e9" stroke="#c8e6c9" stroke-width="0.8"/>
  <text x="298" y="210" text-anchor="middle" font-size="9" fill="#2e7d32">同意连接，初始序列号 y，确认 x+1</text>

  <!-- Step 3: ACK -->
  <line x1="144" y1="264" x2="450" y2="264" stroke="#1565c0" stroke-width="2.1" marker-end="url(#arr-right)"/>
  <text x="298" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">③ ACK, ack=y+1</text>
  <rect x="230" y="270" width="136" height="24" rx="3" fill="#e3f2fd" stroke="#bbdefb" stroke-width="0.8"/>
  <text x="298" y="286" text-anchor="middle" font-size="9" fill="#1565c0">确认你的序列号 y+1</text>

  <!-- ESTABLISHED labels -->
  <rect x="51" y="306" width="153" height="26" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="128" y="323" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">ESTABLISHED</text>

  <rect x="391" y="306" width="153" height="26" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="468" y="323" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">ESTABLISHED</text>
</svg>