<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 408 357" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#555555"/></marker>
  </defs>
  <text x="204" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">MyBatis 可拦截的四个对象</text>

  <!-- Box -->
  <rect x="68" y="42" width="272" height="280" rx="10" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="1.3"/>

  <!-- Executor -->
  <rect x="119" y="68" width="170" height="42" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="204" y="87" text-anchor="middle" fill="#0d47a1" font-weight="bold" font-size="12">Executor</text>
  <text x="204" y="102" text-anchor="middle" fill="#666666" font-size="9">SQL 执行入口</text>
  <line x1="204" y1="110" x2="204" y2="132" stroke="#555555" stroke-width="1.3" marker-end="url(#ar2)"/>

  <!-- ParameterHandler -->
  <rect x="119" y="136" width="170" height="42" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="204" y="155" text-anchor="middle" fill="#1b5e20" font-weight="bold" font-size="12">ParameterHandler</text>
  <text x="204" y="170" text-anchor="middle" fill="#666666" font-size="9">参数设置（? 占位符 → 实际值）</text>
  <line x1="204" y1="178" x2="204" y2="200" stroke="#555555" stroke-width="1.3" marker-end="url(#ar2)"/>

  <!-- StatementHandler -->
  <rect x="119" y="204" width="170" height="42" rx="7" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="204" y="223" text-anchor="middle" fill="#bf360c" font-weight="bold" font-size="12">StatementHandler</text>
  <text x="204" y="238" text-anchor="middle" fill="#666666" font-size="9">Statement 准备（prepare → execute）</text>
  <line x1="204" y1="246" x2="204" y2="268" stroke="#555555" stroke-width="1.3" marker-end="url(#ar2)"/>

  <!-- ResultSetHandler -->
  <rect x="119" y="272" width="170" height="42" rx="7" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.3"/>
  <text x="204" y="291" text-anchor="middle" fill="#4a148c" font-weight="bold" font-size="12">ResultSetHandler</text>
  <text x="204" y="306" text-anchor="middle" fill="#666666" font-size="9">结果集处理（ResultSet → Java 对象）</text>

  <!-- Side note -->
  <text x="357" y="90" fill="#888888" font-size="9">← 每个都可被插件拦截</text>
  <text x="357" y="158" fill="#888888" font-size="9">← 每个都可被插件拦截</text>
  <text x="357" y="226" fill="#888888" font-size="9">← 每个都可被插件拦截</text>
  <text x="357" y="294" fill="#888888" font-size="9">← 每个都可被插件拦截</text>

  <text x="204" y="345" text-anchor="middle" fill="#888888" font-size="10">MyBatis 插件（Plugin）可以拦截这四个对象的方法调用</text>
</svg>