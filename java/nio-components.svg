<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 476 272" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12">
  <text x="238" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">NIO 三大核心组件</text>
  <!-- Channel -->
  <rect x="34" y="68" width="119" height="85" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7"/>
  <text x="94" y="102" text-anchor="middle" fill="#0d47a1" font-weight="bold" font-size="12">Channel</text>
  <text x="94" y="123" text-anchor="middle" fill="#555555" font-size="11">双向数据通道</text>
  <text x="94" y="140" text-anchor="middle" fill="#888888" font-size="9">替代 Stream</text>
  <!-- Buffer -->
  <rect x="178" y="68" width="119" height="85" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7"/>
  <text x="238" y="102" text-anchor="middle" fill="#1b5e20" font-weight="bold" font-size="12">Buffer</text>
  <text x="238" y="123" text-anchor="middle" fill="#555555" font-size="11">数据读写容器</text>
  <text x="238" y="140" text-anchor="middle" fill="#888888" font-size="9">所有 I/O 经过 Buffer</text>
  <!-- Selector -->
  <rect x="323" y="68" width="119" height="85" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.7"/>
  <text x="382" y="102" text-anchor="middle" fill="#4a148c" font-weight="bold" font-size="12">Selector</text>
  <text x="382" y="123" text-anchor="middle" fill="#555555" font-size="11">事件多路复用器</text>
  <text x="382" y="140" text-anchor="middle" fill="#888888" font-size="9">一个线程管理 N 连接</text>
  <!-- Arrows: Channel ↔ Buffer -->
  <line x1="153" y1="102" x2="177" y2="102" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="180" y1="115" x2="156" y2="115" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <!-- Arrow: Channel → Selector (register) -->
  <path d="M110,180 L110,230 L450,230 L450,182" fill="none" stroke="#7b1fa2" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#ar)"/>
  <text x="238" y="211" text-anchor="middle" fill="#7b1fa2" font-size="10">注册 + 关注事件</text>
  <!-- Footer -->
  <text x="238" y="246" text-anchor="middle" fill="#888888" font-size="10">Channel 通过 Buffer 读写数据，通过 Selector 监听事件</text>
  <text x="238" y="262" text-anchor="middle" fill="#888888" font-size="10">三者协作，实现"一个线程管理万千连接"</text>
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#555555"/></marker></defs>
</svg>