<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 442" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="221" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">HotSpot 对象内存布局（64 位 JVM）</text>

  <!-- 对象头 -->
  <rect x="85" y="44" width="272" height="102" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7"/>
  <text x="221" y="65" text-anchor="middle" fill="#1565c0" font-weight="bold" font-size="11">对象头（Object Header）</text>

  <!-- Mark Word -->
  <rect x="102" y="75" width="116" height="61" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.3"/>
  <text x="160" y="92" text-anchor="middle" fill="#0d47a1" font-weight="bold" font-size="10">Mark Word</text>
  <text x="160" y="105" text-anchor="middle" fill="#555555" font-size="9">8 字节（64 bit）</text>
  <text x="160" y="119" text-anchor="middle" fill="#555555" font-size="8">hashCode / GC 年龄</text>
  <text x="160" y="129" text-anchor="middle" fill="#555555" font-size="8">锁状态标志</text>

  <!-- Klass Pointer -->
  <rect x="224" y="75" width="116" height="61" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.3"/>
  <text x="282" y="92" text-anchor="middle" fill="#0d47a1" font-weight="bold" font-size="10">Klass Pointer</text>
  <text x="282" y="105" text-anchor="middle" fill="#555555" font-size="9">4 或 8 字节</text>
  <text x="282" y="119" text-anchor="middle" fill="#555555" font-size="8">指向方法区中</text>
  <text x="282" y="129" text-anchor="middle" fill="#555555" font-size="8">该类的元数据</text>

  <!-- 实例数据 -->
  <rect x="85" y="156" width="272" height="102" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7"/>
  <text x="221" y="178" text-anchor="middle" fill="#1b5e20" font-weight="bold" font-size="11">实例数据（Instance Data）</text>

  <!-- 父类字段 -->
  <rect x="102" y="189" width="116" height="31" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8"/>
  <text x="160" y="208" text-anchor="middle" fill="#1b5e20" font-size="9">父类字段在前</text>

  <!-- 子类字段 -->
  <rect x="224" y="189" width="116" height="31" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8"/>
  <text x="282" y="208" text-anchor="middle" fill="#1b5e20" font-size="9">子类字段在后</text>

  <!-- 字段示例 -->
  <rect x="102" y="226" width="238" height="24" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="0.8"/>
  <text x="221" y="242" text-anchor="middle" fill="#555555" font-size="9">int id / String name / boolean active ...</text>

  <!-- 对齐填充 -->
  <rect x="85" y="269" width="272" height="44" rx="7" fill="#fff3e0" stroke="#e65100" stroke-width="1.7"/>
  <text x="221" y="289" text-anchor="middle" fill="#bf360c" font-weight="bold" font-size="11">对齐填充（Padding）</text>
  <text x="221" y="304" text-anchor="middle" fill="#555555" font-size="10">保证对象总大小是 8 字节的整数倍</text>

  <!-- 尺寸标注 - 左侧 -->
  <line x1="68" y1="44" x2="68" y2="146" stroke="#1565c0" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="65" y1="44" x2="71" y2="44" stroke="#1565c0" stroke-width="0.8"/>
  <line x1="65" y1="146" x2="71" y2="146" stroke="#1565c0" stroke-width="0.8"/>
  <text x="60" y="99" text-anchor="middle" fill="#1565c0" font-size="8" transform="rotate(-90,70,116)">12~16 字节</text>

  <line x1="68" y1="156" x2="68" y2="258" stroke="#2e7d32" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="65" y1="156" x2="71" y2="156" stroke="#2e7d32" stroke-width="0.8"/>
  <line x1="65" y1="258" x2="71" y2="258" stroke="#2e7d32" stroke-width="0.8"/>
  <text x="60" y="211" text-anchor="middle" fill="#2e7d32" font-size="8" transform="rotate(-90,70,248)">大小不固定</text>

  <!-- 底部注释 -->
  <rect x="68" y="333" width="306" height="85" rx="3" fill="none" stroke="#7b1fa2" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="221" y="352" text-anchor="middle" fill="#7b1fa2" font-size="10" font-weight="bold">压缩指针（-XX:+UseCompressedOops）</text>
  <text x="221" y="367" text-anchor="middle" fill="#555555" font-size="9">64 位 JVM 默认开启 → Klass Pointer 占 4 字节</text>
  <text x="221" y="382" text-anchor="middle" fill="#555555" font-size="9">关闭时 → Klass Pointer 占 8 字节</text>
  <text x="221" y="400" text-anchor="middle" fill="#7b1fa2" font-size="10" font-weight="bold">Mark Word 与锁状态</text>
  <text x="221" y="413" text-anchor="middle" fill="#555555" font-size="9">加锁后 Mark Word 内容被覆盖，存储锁信息而非 hashCode</text>

  <!-- 底部总结 -->
  <text x="221" y="435" text-anchor="middle" fill="#888888" font-size="9">对象头 | 实例数据 | 对齐填充 → 8 字节对齐</text>
</svg>
