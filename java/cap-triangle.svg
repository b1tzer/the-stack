<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10">
<defs>
  <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#666666"/>
  </marker>
</defs>

<text x="330" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">CAP 理论：一致性、可用性、分区容错性</text>

<!-- 一致性 C -->
<g transform="translate(30,46)">
  <rect x="0" y="0" width="186" height="98" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="93" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">一致性 Consistency</text>
  <text x="93" y="46" text-anchor="middle" font-size="9" fill="#1565c0">所有节点同一时刻</text>
  <text x="93" y="61" text-anchor="middle" font-size="9" fill="#1565c0">看到相同的数据</text>
  <line x1="16" y1="70" x2="170" y2="70" stroke="#90caf9" stroke-width="0.6"/>
  <text x="93" y="86" text-anchor="middle" font-size="8" fill="#666666">ATM-A 存钱，ATM-B 立刻可查</text>
</g>

<!-- 可用性 A -->
<g transform="translate(237,46)">
  <rect x="0" y="0" width="186" height="98" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="93" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">可用性 Availability</text>
  <text x="93" y="46" text-anchor="middle" font-size="9" fill="#2e7d32">每个请求都能收到响应</text>
  <text x="93" y="61" text-anchor="middle" font-size="9" fill="#2e7d32">但不保证数据最新</text>
  <line x1="16" y1="70" x2="170" y2="70" stroke="#a5d6a7" stroke-width="0.6"/>
  <text x="93" y="86" text-anchor="middle" font-size="8" fill="#666666">不超时、不报错，可能返回旧数据</text>
</g>

<!-- 分区容错性 P -->
<g transform="translate(444,46)">
  <rect x="0" y="0" width="186" height="98" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="93" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#bf360c">分区容错性 Partition</text>
  <text x="93" y="46" text-anchor="middle" font-size="9" fill="#e65100">网络分区时</text>
  <text x="93" y="61" text-anchor="middle" font-size="9" fill="#e65100">系统仍能运行</text>
  <line x1="16" y1="70" x2="170" y2="70" stroke="#ffcc80" stroke-width="0.6"/>
  <text x="93" y="86" text-anchor="middle" font-size="8" fill="#666666">机房断网，系统不停机</text>
</g>

<!-- 约束条 -->
<line x1="123" y1="144" x2="123" y2="172" stroke="#c62828" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="330" y1="144" x2="330" y2="172" stroke="#c62828" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="537" y1="144" x2="537" y2="172" stroke="#c62828" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="80" y="172" width="500" height="42" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
<text x="330" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">三者只能同时满足两个 —— 在 C 和 A 之间取舍（P 是前提）</text>
</svg>
