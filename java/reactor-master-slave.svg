<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 493 272" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="246" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">主从多 Reactor 模式（Netty 采用）</text>
  <!-- Boss Reactor -->
  <rect x="26" y="60" width="153" height="102" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7"/>
  <text x="102" y="85" text-anchor="middle" fill="#0d47a1" font-weight="bold" font-size="11">Boss Reactor</text>
  <text x="102" y="102" text-anchor="middle" fill="#666666" font-size="10">1 个线程</text>
  <rect x="42" y="115" width="119" height="31" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="0.8"/>
  <text x="102" y="135" text-anchor="middle" fill="#0d47a1" font-size="10">Selector（ACCEPT）</text>
  <!-- Arrow -->
  <line x1="178" y1="110" x2="236" y2="110" stroke="#1565c0" stroke-width="1.7" marker-end="url(#ar5)"/>
  <text x="207" y="102" text-anchor="middle" fill="#1565c0" font-size="9">accept</text>
  <!-- Worker Reactor Pool -->
  <rect x="238" y="42" width="230" height="187" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7"/>
  <text x="353" y="68" text-anchor="middle" fill="#1b5e20" font-weight="bold" font-size="11">Worker Reactor Pool</text>
  <text x="353" y="85" text-anchor="middle" fill="#666666" font-size="10">N 个线程（CPU 核心数 × 2）</text>
  <!-- Workers -->
  <rect x="255" y="98" width="89" height="51" rx="5" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8"/>
  <text x="299" y="119" text-anchor="middle" fill="#1b5e20" font-weight="bold">Worker-1</text>
  <text x="299" y="134" text-anchor="middle" fill="#555555" font-size="9">READ/WRITE</text>
  <rect x="353" y="98" width="89" height="51" rx="5" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8"/>
  <text x="397" y="119" text-anchor="middle" fill="#1b5e20" font-weight="bold">Worker-2</text>
  <text x="397" y="134" text-anchor="middle" fill="#555555" font-size="9">READ/WRITE</text>
  <rect x="255" y="162" width="89" height="42" rx="5" fill="#eceff1" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="299" y="187" text-anchor="middle" fill="#999999">Worker-N ...</text>
  <!-- Footer -->
  <text x="246" y="253" text-anchor="middle" fill="#888888" font-size="10">Boss 只负责 accept 新连接，Worker 负责已建立连接的读写事件</text>
  <text x="246" y="269" text-anchor="middle" fill="#888888" font-size="10">职责分离，避免 accept 和 read/write 互相阻塞</text>
  <defs><marker id="ar5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/></marker></defs>
</svg>