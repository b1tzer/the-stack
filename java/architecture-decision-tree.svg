<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10">
<defs>
  <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#666666"/>
  </marker>
</defs>

<text x="450" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">架构选型决策树</text>

<!-- 项目启动 -->
<g transform="translate(370,36)">
  <rect x="0" y="0" width="160" height="40" rx="5" fill="#263238" stroke="none"/>
  <text x="80" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">项目启动</text>
</g>
<line x1="450" y1="76" x2="450" y2="100" stroke="#666666" stroke-width="1.3" marker-end="url(#ar)"/>

<!-- 判断1 团队规模 -->
<g transform="translate(320,100)">
  <rect x="0" y="0" width="260" height="48" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.3"/>
  <text x="130" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">团队规模？</text>
</g>

<!-- 判断1 三分支 -->
<path d="M360,148 L360,172 L140,172 L140,188" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="250" y="164" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">&lt; 5 人</text>

<path d="M450,148 L450,172 L420,172 L420,188" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="435" y="164" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e7d32">5-15 人</text>

<path d="M540,148 L540,172 L690,172 L690,188" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="615" y="164" text-anchor="middle" font-size="10" font-weight="bold" fill="#7b1fa2">&gt; 15 人</text>

<!-- 单体架构（<5人） -->
<g transform="translate(40,190)">
  <rect x="0" y="0" width="200" height="64" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="100" y="26" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">单体架构</text>
  <text x="100" y="46" text-anchor="middle" font-size="9" fill="#1565c0">快速验证业务</text>
</g>

<!-- 判断2 业务线独立 -->
<g transform="translate(300,190)">
  <rect x="0" y="0" width="240" height="48" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.3"/>
  <text x="120" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">业务线是否独立？</text>
</g>

<!-- 判断3 DevOps -->
<g transform="translate(560,190)">
  <rect x="0" y="0" width="260" height="48" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.3"/>
  <text x="130" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">是否有 DevOps 能力？</text>
</g>

<!-- 判断2 分支 -->
<line x1="360" y1="238" x2="240" y2="298" stroke="#666666" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="285" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e7d32">是</text>
<line x1="480" y1="238" x2="480" y2="298" stroke="#666666" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="492" y="272" font-size="10" fill="#666666">否</text>

<!-- 判断3 分支 -->
<line x1="650" y1="238" x2="650" y2="298" stroke="#666666" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="662" y="272" font-size="10" fill="#7b1fa2">是</text>
<line x1="740" y1="238" x2="820" y2="298" stroke="#666666" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="795" y="258" text-anchor="middle" font-size="10" fill="#666666">否</text>

<!-- 垂直拆分 -->
<g transform="translate(160,300)">
  <rect x="0" y="0" width="160" height="56" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="80" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">垂直拆分</text>
  <text x="80" y="43" text-anchor="middle" font-size="9" fill="#2e7d32">按业务线拆分</text>
</g>

<!-- 单体架构（5-15人 否） -->
<g transform="translate(400,300)">
  <rect x="0" y="0" width="160" height="56" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="80" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">单体架构</text>
  <text x="80" y="43" text-anchor="middle" font-size="9" fill="#1565c0">业务线不独立</text>
</g>

<!-- 微服务 -->
<g transform="translate(560,300)">
  <rect x="0" y="0" width="180" height="56" rx="5" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.3"/>
  <text x="90" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">微服务架构</text>
  <text x="90" y="43" text-anchor="middle" font-size="9" fill="#7b1fa2">独立扩展、快速迭代</text>
</g>

<!-- 建设基础设施 -->
<g transform="translate(740,300)">
  <rect x="0" y="0" width="160" height="56" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="80" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">先建设基础设施</text>
  <text x="80" y="43" text-anchor="middle" font-size="9" fill="#e65100">再逐步拆分</text>
</g>
</svg>
