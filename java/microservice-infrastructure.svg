<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10">
<defs>
  <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#666666"/>
  </marker>
  <marker id="arDash" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#90a4ae"/>
  </marker>
</defs>

<text x="380" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">微服务架构全景</text>

<!-- 客户端 -->
<g transform="translate(280,34)">
  <rect x="0" y="0" width="200" height="44" rx="5" fill="#eceff1" stroke="#546e7a" stroke-width="1.3"/>
  <text x="100" y="27" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474f">客户端</text>
</g>
<line x1="380" y1="78" x2="380" y2="96" stroke="#666666" stroke-width="1.3" marker-end="url(#ar)"/>

<!-- API Gateway -->
<g transform="translate(280,96)">
  <rect x="0" y="0" width="200" height="56" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="100" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">API Gateway</text>
  <text x="100" y="43" text-anchor="middle" font-size="9" fill="#1565c0">统一入口 / 鉴权 / 限流</text>
</g>

<!-- Gateway → 三个服务 -->
<line x1="380" y1="152" x2="130" y2="188" stroke="#666666" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="380" y1="152" x2="380" y2="188" stroke="#666666" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="380" y1="152" x2="630" y2="188" stroke="#666666" stroke-width="1.2" marker-end="url(#ar)"/>

<!-- 用户服务 -->
<g transform="translate(40,190)">
  <rect x="0" y="0" width="180" height="54" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="90" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">用户服务</text>
  <text x="90" y="43" text-anchor="middle" font-size="9" fill="#2e7d32">独立开发 / 部署 / 扩展</text>
</g>

<!-- 订单服务 -->
<g transform="translate(290,190)">
  <rect x="0" y="0" width="180" height="54" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="90" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">订单服务</text>
  <text x="90" y="43" text-anchor="middle" font-size="9" fill="#2e7d32">独立开发 / 部署 / 扩展</text>
</g>

<!-- 商品服务 -->
<g transform="translate(540,190)">
  <rect x="0" y="0" width="180" height="54" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="90" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">商品服务</text>
  <text x="90" y="43" text-anchor="middle" font-size="9" fill="#2e7d32">独立开发 / 部署 / 扩展</text>
</g>

<!-- 服务 → 基础设施（虚线） -->
<line x1="130" y1="244" x2="130" y2="298" stroke="#90a4ae" stroke-width="1.1" stroke-dasharray="5,3" marker-end="url(#arDash)"/>
<line x1="380" y1="244" x2="380" y2="298" stroke="#90a4ae" stroke-width="1.1" stroke-dasharray="5,3" marker-end="url(#arDash)"/>
<line x1="630" y1="244" x2="630" y2="298" stroke="#90a4ae" stroke-width="1.1" stroke-dasharray="5,3" marker-end="url(#arDash)"/>

<!-- Service Discovery -->
<g transform="translate(40,300)">
  <rect x="0" y="0" width="200" height="56" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="100" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">Service Discovery</text>
  <text x="100" y="43" text-anchor="middle" font-size="9" fill="#e65100">Nacos / Eureka</text>
</g>

<!-- Circuit Breaker -->
<g transform="translate(280,300)">
  <rect x="0" y="0" width="200" height="56" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="100" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">Circuit Breaker</text>
  <text x="100" y="43" text-anchor="middle" font-size="9" fill="#e65100">Sentinel / Hystrix 熔断降级</text>
</g>

<!-- Message Queue -->
<g transform="translate(520,300)">
  <rect x="0" y="0" width="200" height="56" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="100" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">Message Queue</text>
  <text x="100" y="43" text-anchor="middle" font-size="9" fill="#e65100">Kafka / RocketMQ 异步解耦</text>
</g>

<!-- 可观测性横带 -->
<g transform="translate(40,388)">
  <rect x="0" y="0" width="680" height="38" rx="5" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.2"/>
  <text x="340" y="24" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a148c">可观测性：链路追踪 SkyWalking/Zipkin · 日志聚合 ELK · 指标监控 Prometheus+Grafana</text>
</g>
</svg>
