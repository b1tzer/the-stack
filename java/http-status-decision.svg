<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 493" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10">
  <defs>
    <marker id="arD3" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555555"/>
    </marker>
    <marker id="arR3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c62828"/>
    </marker>
  </defs>

  <text x="255" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">HTTP 状态码选择决策树</text>

  <!-- Root node -->
  <rect x="170" y="36" width="170" height="31" rx="15" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="255" y="54" text-anchor="middle" font-size="11" fill="#0d47a1" font-weight="bold">请求到达</text>
  <line x1="255" y1="66" x2="255" y2="82" stroke="#555555" stroke-width="1.3" marker-end="url(#arD3)"/>

  <!-- Decision nodes and results -->
  <!-- 400 -->
  <line x1="255" y1="82" x2="119" y2="82" stroke="#c62828" stroke-width="0.8"/>
  <line x1="119" y1="82" x2="119" y2="94" stroke="#c62828" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="42" y="95" width="153" height="26" rx="5" fill="#ffcdd2" stroke="#c62828" stroke-width="0.8"/>
  <text x="119" y="111" text-anchor="middle" font-size="9" fill="#b71c1c">语法/格式错误？</text>
  <line x1="119" y1="121" x2="119" y2="133" stroke="#c62828" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="42" y="134" width="153" height="24" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="0.8"/>
  <text x="119" y="150" text-anchor="middle" font-size="10" fill="#b71c1c" font-weight="bold">400 Bad Request</text>

  <!-- 401 -->
  <line x1="255" y1="82" x2="255" y2="94" stroke="#e65100" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="178" y="95" width="153" height="26" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
  <text x="255" y="111" text-anchor="middle" font-size="9" fill="#bf360c">需要认证？</text>
  <line x1="255" y1="121" x2="255" y2="133" stroke="#e65100" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="178" y="134" width="153" height="24" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
  <text x="255" y="150" text-anchor="middle" font-size="10" fill="#bf360c" font-weight="bold">401 Unauthorized</text>

  <!-- 403 -->
  <line x1="255" y1="162" x2="255" y2="178" stroke="#555555" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="178" y="180" width="153" height="26" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
  <text x="255" y="196" text-anchor="middle" font-size="9" fill="#bf360c">已认证但无权限？</text>
  <line x1="255" y1="206" x2="255" y2="218" stroke="#e65100" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="178" y="219" width="153" height="24" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
  <text x="255" y="235" text-anchor="middle" font-size="10" fill="#bf360c" font-weight="bold">403 Forbidden</text>

  <!-- 404 -->
  <line x1="255" y1="246" x2="255" y2="264" stroke="#555555" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="178" y="265" width="153" height="26" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
  <text x="255" y="281" text-anchor="middle" font-size="9" fill="#bf360c">资源不存在？</text>
  <line x1="255" y1="291" x2="255" y2="303" stroke="#e65100" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="178" y="304" width="153" height="24" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
  <text x="255" y="320" text-anchor="middle" font-size="10" fill="#bf360c" font-weight="bold">404 Not Found</text>

  <!-- 405 -->
  <line x1="255" y1="332" x2="255" y2="348" stroke="#555555" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="178" y="350" width="153" height="26" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
  <text x="255" y="366" text-anchor="middle" font-size="9" fill="#bf360c">方法不支持？</text>
  <line x1="255" y1="376" x2="255" y2="388" stroke="#e65100" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="178" y="389" width="153" height="24" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
  <text x="255" y="405" text-anchor="middle" font-size="10" fill="#bf360c" font-weight="bold">405 Method Not Allowed</text>

  <!-- Success branch (right side) -->
  <line x1="255" y1="82" x2="391" y2="82" stroke="#2e7d32" stroke-width="0.8"/>
  <line x1="391" y1="82" x2="391" y2="94" stroke="#2e7d32" stroke-width="0.8" marker-end="url(#arD3)"/>

  <!-- 201 -->
  <rect x="314" y="95" width="153" height="26" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="0.8"/>
  <text x="391" y="111" text-anchor="middle" font-size="9" fill="#1b5e20">创建成功？</text>
  <line x1="391" y1="121" x2="391" y2="133" stroke="#2e7d32" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="314" y="134" width="153" height="24" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8"/>
  <text x="391" y="150" text-anchor="middle" font-size="10" fill="#1b5e20" font-weight="bold">201 Created</text>

  <!-- 204 -->
  <line x1="391" y1="162" x2="391" y2="178" stroke="#555555" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="314" y="180" width="153" height="26" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="0.8"/>
  <text x="391" y="196" text-anchor="middle" font-size="9" fill="#1b5e20">删除成功（无返回）？</text>
  <line x1="391" y1="206" x2="391" y2="218" stroke="#2e7d32" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="314" y="219" width="153" height="24" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8"/>
  <text x="391" y="235" text-anchor="middle" font-size="10" fill="#1b5e20" font-weight="bold">204 No Content</text>

  <!-- 200 -->
  <line x1="391" y1="246" x2="391" y2="264" stroke="#555555" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="314" y="265" width="153" height="26" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="0.8"/>
  <text x="391" y="281" text-anchor="middle" font-size="9" fill="#1b5e20">普通成功？</text>
  <line x1="391" y1="291" x2="391" y2="303" stroke="#2e7d32" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="314" y="304" width="153" height="24" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8"/>
  <text x="391" y="320" text-anchor="middle" font-size="10" fill="#1b5e20" font-weight="bold">200 OK</text>

  <!-- 500 -->
  <line x1="391" y1="332" x2="391" y2="348" stroke="#555555" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="314" y="350" width="153" height="26" rx="5" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="0.8"/>
  <text x="391" y="366" text-anchor="middle" font-size="9" fill="#4a148c">服务器异常？</text>
  <line x1="391" y1="376" x2="391" y2="388" stroke="#7b1fa2" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="314" y="389" width="153" height="24" rx="3" fill="#e1bee7" stroke="#7b1fa2" stroke-width="0.8"/>
  <text x="391" y="405" text-anchor="middle" font-size="10" fill="#4a148c" font-weight="bold">500 Internal Server Error</text>
</svg>
