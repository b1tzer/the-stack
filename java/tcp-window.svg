<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 272" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <!-- Title -->
  <text x="306" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">TCP 滑动窗口示意图</text>
  <text x="306" y="42" text-anchor="middle" font-size="11" fill="#666666">发送窗口大小 = 4000 字节</text>

  <!-- Window before slide -->
  <text x="306" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555">当前窗口状态</text>

  <!-- Full bar -->
  <rect x="51" y="81" width="510" height="42" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="1.3"/>

  <!-- 已确认 (green) -->
  <rect x="51" y="81" width="128" height="42" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="115" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">已确认</text>
  <text x="115" y="113" text-anchor="middle" font-size="9" fill="#1b5e20">已收到 ACK</text>

  <!-- 可发送(未确认) (blue) -->
  <rect x="178" y="81" width="212" height="42" rx="0" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="285" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">可发送 (未确认)</text>
  <text x="285" y="113" text-anchor="middle" font-size="9" fill="#0d47a1">已发送等待 ACK</text>

  <!-- 不可发送 (gray) -->
  <rect x="391" y="81" width="170" height="42" rx="0" fill="#eceff1" stroke="#999999" stroke-width="1.3"/>
  <text x="476" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555">不可发送</text>
  <text x="476" y="113" text-anchor="middle" font-size="9" fill="#999999">窗口之外</text>

  <!-- Window size bracket -->
  <line x1="178" y1="136" x2="391" y2="136" stroke="#e65100" stroke-width="1.3"/>
  <line x1="178" y1="132" x2="178" y2="140" stroke="#e65100" stroke-width="1.3"/>
  <line x1="391" y1="132" x2="391" y2="140" stroke="#e65100" stroke-width="1.3"/>
  <text x="285" y="151" text-anchor="middle" font-size="10" fill="#e65100" font-weight="bold">◀───── 窗口大小 ─────▶</text>

  <!-- Arrow down -->
  <text x="306" y="178" text-anchor="middle" font-size="11" fill="#4a148c">每收到一个 ACK，窗口向右滑动 →</text>

  <!-- Window after slide -->
  <text x="306" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555">滑动后</text>

  <rect x="51" y="212" width="510" height="42" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="1.3"/>

  <!-- 已确认 (larger green) -->
  <rect x="51" y="212" width="212" height="42" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="157" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">已确认</text>
  <text x="157" y="245" text-anchor="middle" font-size="9" fill="#1b5e20">更多数据已确认</text>

  <!-- 可发送 (blue) -->
  <rect x="264" y="212" width="212" height="42" rx="0" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="370" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">可发送 (未确认)</text>
  <text x="370" y="245" text-anchor="middle" font-size="9" fill="#0d47a1">窗口右移</text>

  <!-- 不可发送 (smaller gray) -->
  <rect x="476" y="212" width="85" height="42" rx="0" fill="#eceff1" stroke="#999999" stroke-width="1.3"/>
  <text x="518" y="238" text-anchor="middle" font-size="9" fill="#999999">不可发送</text>
</svg>