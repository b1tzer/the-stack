<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 663 527" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555555"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:#333333}
    .title{font-size:16px;font-weight:bold;fill:#333333}
    .dec{font-size:13px;fill:#bf360c}
    .yes{fill:#2e7d32;font-size:13px;font-weight:bold}
    .no{fill:#c62828;font-size:13px;font-weight:bold}
    .hint{fill:#666666;font-size:12px}
  </style>

  <text x="332" y="26" text-anchor="middle" class="title">虚拟线程选型决策树</text>

  <!-- Root decision -->
  <polygon points="390,45 570,85 390,125 210,85" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="332" y="70" text-anchor="middle" class="dec">任务是 CPU 密集吗？</text>

  <!-- Yes branch (left) -->
  <line x1="178" y1="72" x2="85" y2="72" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="136" y="65" class="yes">是</text>
  <rect x="8" y="55" rx="5" width="110" height="37" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="64" y="71" text-anchor="middle" fill="#1b5e20" font-weight="bold">平台线程池</text>
  <text x="64" y="85" text-anchor="middle" class="hint">(N_CPU + 1)</text>

  <!-- No branch (down) -->
  <line x1="332" y1="106" x2="332" y2="136" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="340" y="126" class="no">否</text>

  <!-- Decision 2 -->
  <polygon points="390,160 590,200 390,240 190,200" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="332" y="167" text-anchor="middle" class="dec">用了 synchronized + 阻塞 IO？</text>

  <!-- Yes branch -->
  <line x1="162" y1="170" x2="85" y2="170" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="128" y="163" class="yes">是</text>

  <!-- Decision 3: JDK version -->
  <polygon points="100,200 100,175 100,225 0,200" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
  <rect x="8" y="149" rx="5" width="110" height="42" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="64" y="167" text-anchor="middle" class="dec">JDK &lt; 24？</text>

  <!-- JDK < 24: yes (left-down) -->
  <line x1="26" y1="191" x2="26" y2="230" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="32" y="214" class="yes">是</text>
  <rect x="0" y="230" rx="5" width="136" height="48" fill="#ffcdd2" stroke="#c62828" stroke-width="1.3"/>
  <text x="68" y="246" text-anchor="middle" fill="#b71c1c" font-weight="bold">改 ReentrantLock</text>
  <text x="68" y="260" text-anchor="middle" class="hint">或使用平台线程</text>

  <!-- JDK >= 24: no (right) -->
  <line x1="119" y1="170" x2="178" y2="170" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="144" y="163" class="no">否</text>
  <rect x="178" y="155" rx="5" width="85" height="31" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="221" y="174" text-anchor="middle" fill="#1b5e20">虚拟线程</text>

  <!-- No branch from decision 2 (right) -->
  <line x1="502" y1="170" x2="570" y2="170" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="536" y="163" class="no">否</text>

  <!-- Virtual thread area -->
  <rect x="570" y="155" rx="5" width="76" height="31" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="608" y="174" text-anchor="middle" fill="#1b5e20">虚拟线程</text>

  <!-- Arrow down from virtual thread -->
  <line x1="608" y1="185" x2="608" y2="221" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- Decision 4: 背压 -->
  <polygon points="715,260 820,295 715,330 610,295" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="608" y="248" text-anchor="middle" class="dec" font-size="12px">还需要背压吗？</text>

  <!-- Yes: VT + Semaphore -->
  <line x1="518" y1="251" x2="450" y2="251" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="484" y="244" class="yes">是</text>
  <rect x="323" y="234" rx="5" width="128" height="34" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="387" y="248" text-anchor="middle" fill="#0d47a1" font-weight="bold">VT + Semaphore</text>
  <text x="387" y="262" text-anchor="middle" class="hint">显式限流</text>

  <!-- No: 直接用 VT -->
  <line x1="608" y1="280" x2="608" y2="302" stroke="#555555" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="616" y="296" class="no">否</text>
  <rect x="557" y="302" rx="5" width="102" height="31" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="608" y="321" text-anchor="middle" fill="#1b5e20" font-weight="bold">直接用 VT</text>

  <!-- Legend / summary box -->
  <rect x="68" y="332" rx="7" width="527" height="170" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="85" y="355" class="title" font-size="14px">速查表</text>
  <text x="85" y="378" fill="#1b5e20" font-size="13px">✅  IO 密集（DB / RPC / HTTP）→ 虚拟线程，无需调参</text>
  <text x="85" y="400" fill="#1b5e20" font-size="13px">✅  IO 密集 + 需要限流 → 虚拟线程 + Semaphore</text>
  <text x="85" y="421" fill="#1b5e20" font-size="13px">✅  CPU 密集 → 平台线程池（N_CPU + 1），虚拟线程无收益</text>
  <text x="85" y="442" fill="#c62828" font-size="13px">⚠️  synchronized + 阻塞 IO（JDK &lt; 24）→ 改 ReentrantLock 或用平台线程</text>
  <text x="85" y="463" fill="#666666" font-size="13px">💡  定时任务、需要线程亲和性的库 → 仍用平台线程池</text>
  <text x="85" y="484" fill="#666666" font-size="13px">💡  ThreadLocal 密集 → 注意百万 VT 的内存开销，考虑 ScopedValue</text>
</svg>
