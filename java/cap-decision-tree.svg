<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10">
<defs>
  <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#666666"/>
  </marker>
</defs>

<text x="360" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">CAP 选型决策树</text>

<!-- 业务场景 -->
<g transform="translate(280,34)">
  <rect x="0" y="0" width="160" height="40" rx="5" fill="#263238" stroke="none"/>
  <text x="80" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">业务场景</text>
</g>
<line x1="360" y1="74" x2="360" y2="100" stroke="#666666" stroke-width="1.3" marker-end="url(#ar)"/>

<!-- 判断1 -->
<g transform="translate(230,100)">
  <rect x="0" y="0" width="260" height="48" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.3"/>
  <text x="130" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">数据不一致是否造成资金损失？</text>
</g>
<!-- 判断1 分支 -->
<line x1="490" y1="124" x2="558" y2="124" stroke="#1565c0" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="524" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">是</text>
<line x1="360" y1="148" x2="360" y2="200" stroke="#666666" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="372" y="178" font-size="10" fill="#666666">否</text>

<!-- CP1 结果 -->
<g transform="translate(560,100)">
  <rect x="0" y="0" width="150" height="48" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="75" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">CP</text>
  <text x="75" y="37" text-anchor="middle" font-size="9" fill="#1565c0">ZooKeeper / etcd</text>
</g>

<!-- 判断2 -->
<g transform="translate(230,200)">
  <rect x="0" y="0" width="260" height="48" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.3"/>
  <text x="130" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">用户能否接受短暂的旧数据？</text>
</g>
<line x1="490" y1="224" x2="558" y2="224" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="524" y="216" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e7d32">能</text>
<line x1="360" y1="248" x2="360" y2="300" stroke="#666666" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="372" y="278" font-size="10" fill="#666666">不能</text>

<!-- AP 结果 -->
<g transform="translate(560,200)">
  <rect x="0" y="0" width="150" height="48" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="75" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">AP</text>
  <text x="75" y="37" text-anchor="middle" font-size="9" fill="#2e7d32">Eureka / Redis</text>
</g>

<!-- 判断3 -->
<g transform="translate(230,300)">
  <rect x="0" y="0" width="260" height="48" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.3"/>
  <text x="130" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">可以接受短暂不可用吗？</text>
</g>
<line x1="490" y1="324" x2="558" y2="324" stroke="#1565c0" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="524" y="316" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">能</text>
<line x1="360" y1="348" x2="360" y2="380" stroke="#666666" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="372" y="368" font-size="10" fill="#666666">不能</text>

<!-- CP2 结果 -->
<g transform="translate(560,300)">
  <rect x="0" y="0" width="150" height="48" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="75" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">CP</text>
  <text x="75" y="37" text-anchor="middle" font-size="9" fill="#1565c0">强一致性</text>
</g>

<!-- AP+补偿 结果 -->
<g transform="translate(230,380)">
  <rect x="0" y="0" width="260" height="48" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="130" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">AP + 补偿机制</text>
  <text x="130" y="37" text-anchor="middle" font-size="9" fill="#e65100">最终一致性</text>
</g>
</svg>
