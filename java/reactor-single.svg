<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 255" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="221" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">单线程 Reactor 模式</text>
  <rect x="34" y="42" width="374" height="170" rx="10" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.7"/>
  <text x="221" y="65" text-anchor="middle" fill="#4a148c" font-weight="bold" font-size="11">Reactor Thread（单线程）</text>
  <!-- Selector -->
  <rect x="60" y="85" width="94" height="42" rx="5" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1.3"/>
  <text x="106" y="104" text-anchor="middle" fill="#4a148c" font-weight="bold">Selector</text>
  <text x="106" y="117" text-anchor="middle" fill="#666666" font-size="9">select()</text>
  <!-- Dispatcher -->
  <rect x="187" y="85" width="94" height="42" rx="5" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1.3"/>
  <text x="234" y="104" text-anchor="middle" fill="#333333" font-weight="bold">Dispatcher</text>
  <text x="234" y="117" text-anchor="middle" fill="#333333" font-size="9">分发事件</text>
  <!-- Handler -->
  <rect x="314" y="72" width="76" height="119" rx="5" fill="#7b1fa2" stroke="#7b1fa2" stroke-width="1.3"/>
  <text x="353" y="92" text-anchor="middle" fill="#333333" font-weight="bold">Handler</text>
  <text x="353" y="110" text-anchor="middle" fill="#e1bee7" font-size="9">read</text>
  <text x="353" y="126" text-anchor="middle" fill="#e1bee7" font-size="9">decode</text>
  <text x="353" y="141" text-anchor="middle" fill="#e1bee7" font-size="9">process</text>
  <text x="353" y="156" text-anchor="middle" fill="#e1bee7" font-size="9">encode</text>
  <text x="353" y="172" text-anchor="middle" fill="#e1bee7" font-size="9">write</text>
  <!-- Arrows -->
  <line x1="153" y1="106" x2="185" y2="106" stroke="#7b1fa2" stroke-width="1.3" marker-end="url(#ar3)"/>
  <line x1="280" y1="106" x2="313" y2="106" stroke="#7b1fa2" stroke-width="1.3" marker-end="url(#ar3)"/>
  <!-- Note -->
  <text x="221" y="235" text-anchor="middle" fill="#888888" font-size="10">所有 I/O 事件的检测和处理都在同一个线程中完成</text>
  <text x="221" y="250" text-anchor="middle" fill="#b71c1c" font-size="9">⚠ 业务逻辑处理会阻塞 Selector，导致其他连接事件无法及时处理</text>
  <defs><marker id="ar3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7b1fa2"/></marker></defs>
</svg>