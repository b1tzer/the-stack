<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 578 442" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555555"/>
    </marker>
    <marker id="arr-back" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#7b1fa2"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:#333333}
    .title{font-size:16px;font-weight:bold;fill:#333333}
    .node-label{font-size:13px;fill:#0d47a1}
    .loop-label{fill:#7b1fa2;font-size:12px;font-weight:bold}
    .hint{fill:#888888;font-size:12px}
  </style>

  <!-- Title -->
  <text x="289" y="26" text-anchor="middle" class="title">新建 Worker —— 生命周期流程</text>

  <!-- Step 1: 新建 Worker -->
  <rect x="204" y="41" rx="7" width="170" height="34" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="289" y="62" text-anchor="middle" class="node-label">新建 Worker</text>

  <line x1="289" y1="75" x2="289" y2="100" stroke="#555555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Step 2: 执行 firstTask -->
  <rect x="187" y="100" rx="7" width="204" height="34" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="289" y="122" text-anchor="middle" fill="#1b5e20">执行 firstTask（构造时传入的任务）</text>

  <line x1="289" y1="134" x2="289" y2="162" stroke="#555555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Step 3: 从 workQueue 取任务 -->
  <rect x="162" y="162" rx="7" width="255" height="34" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="289" y="183" text-anchor="middle" fill="#bf360c">从 workQueue 取下一个任务</text>

  <!-- Loop-back arrow (right side, going up) -->
  <path d="M490,210 C540,210 540,138 440,138" fill="none" stroke="#7b1fa2" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <text x="463" y="149" class="loop-label">循环</text>

  <line x1="289" y1="196" x2="289" y2="221" stroke="#555555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Decision: 取到任务？ -->
  <polygon points="340,260 470,300 340,340 210,300" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="289" y="259" text-anchor="middle" fill="#bf360c" font-size="13px">取到任务？</text>

  <!-- Yes → 执行任务 → 回到取任务 -->
  <line x1="178" y1="255" x2="94" y2="255" stroke="#555555" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="140" y="248" fill="#2e7d32" font-size="13px" font-weight="bold">是</text>
  <rect x="17" y="238" rx="5" width="110" height="34" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="72" y="259" text-anchor="middle" fill="#1b5e20">执行任务</text>

  <!-- Arrow from 执行任务 back up to 取任务 -->
  <path d="M85,280 L85,210 L190,210" fill="none" stroke="#7b1fa2" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#arr)"/>

  <!-- No → 是否核心线程？ -->
  <line x1="289" y1="289" x2="289" y2="319" stroke="#555555" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="298" y="309" fill="#c62828" font-size="13px" font-weight="bold">否</text>

  <!-- Decision: 核心线程？ -->
  <polygon points="340,375 460,415 340,455 220,415" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="289" y="357" text-anchor="middle" fill="#bf360c" font-size="13px">是否核心线程？</text>

  <!-- Yes → 继续 poll -->
  <line x1="187" y1="353" x2="94" y2="353" stroke="#555555" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="144" y="346" fill="#2e7d32" font-size="13px" font-weight="bold">是</text>
  <rect x="8" y="336" rx="5" width="119" height="34" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="68" y="351" text-anchor="middle" fill="#1b5e20">继续 poll</text>
  <text x="68" y="365" text-anchor="middle" class="hint">（默认不超时）</text>

  <!-- No → poll 超时退出 -->
  <line x1="391" y1="353" x2="459" y2="353" stroke="#555555" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="425" y="346" fill="#c62828" font-size="13px" font-weight="bold">否</text>
  <rect x="459" y="336" rx="5" width="102" height="34" fill="#ffcdd2" stroke="#c62828" stroke-width="1.3"/>
  <text x="510" y="351" text-anchor="middle" fill="#b71c1c">poll(keepAliveTime)</text>
  <text x="510" y="365" text-anchor="middle" class="hint">超时后退出</text>

  <!-- Note -->
  <text x="289" y="425" text-anchor="middle" fill="#1565c0" font-size="12px" font-style="italic">allowCoreThreadTimeOut(true) 会让核心线程也走带超时的 poll</text>
</svg>
