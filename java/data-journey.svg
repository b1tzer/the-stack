<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 408" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12">
  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="221" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">从网卡到进程：数据的旅程</text>

  <!-- 网卡 -->
  <rect x="136" y="42" width="170" height="37" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="221" y="65" text-anchor="middle" fill="#0d47a1" font-weight="bold">网卡（硬件）</text>
  <!-- arrow -->
  <line x1="221" y1="80" x2="221" y2="105" stroke="#555555" stroke-width="1.3" marker-end="url(#arrowDown)"/>
  <text x="235" y="97" fill="#888888" font-size="9">DMA 到内核内存</text>

  <!-- 链路层 -->
  <rect x="136" y="109" width="170" height="37" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="221" y="126" text-anchor="middle" fill="#bf360c" font-weight="bold">链路层</text>
  <text x="221" y="139" text-anchor="middle" fill="#666666" font-size="10">校验 MAC 地址，剥离帧头</text>
  <line x1="221" y1="146" x2="221" y2="172" stroke="#555555" stroke-width="1.3" marker-end="url(#arrowDown)"/>

  <!-- 网络层 -->
  <rect x="136" y="175" width="170" height="37" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="221" y="192" text-anchor="middle" fill="#1b5e20" font-weight="bold">网络层</text>
  <text x="221" y="206" text-anchor="middle" fill="#666666" font-size="10">校验 IP 地址，路由判断</text>
  <line x1="221" y1="212" x2="221" y2="238" stroke="#555555" stroke-width="1.3" marker-end="url(#arrowDown)"/>

  <!-- 传输层 -->
  <rect x="136" y="241" width="170" height="48" rx="5" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.3"/>
  <text x="221" y="258" text-anchor="middle" fill="#4a148c" font-weight="bold">传输层</text>
  <text x="221" y="272" text-anchor="middle" fill="#666666" font-size="10">根据端口号找到对应的 Socket</text>
  <text x="221" y="284" text-anchor="middle" fill="#666666" font-size="10">数据写入 Socket 的接收缓冲区</text>
  <line x1="221" y1="289" x2="221" y2="314" stroke="#555555" stroke-width="1.3" marker-end="url(#arrowDown)"/>

  <!-- 应用程序 -->
  <rect x="136" y="318" width="170" height="37" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="221" y="335" text-anchor="middle" fill="#e65100" font-weight="bold">应用程序</text>
  <text x="221" y="348" text-anchor="middle" fill="#666666" font-size="10">read() 从缓冲区取出数据</text>

  <!-- 侧边注释 -->
  <rect x="26" y="238" width="94" height="60" rx="3" fill="none" stroke="#7b1fa2" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="72" y="257" text-anchor="middle" fill="#7b1fa2" font-size="10" font-weight="bold">关键一步</text>
  <text x="72" y="272" text-anchor="middle" fill="#555555" font-size="9">根据五元组</text>
  <text x="72" y="286" text-anchor="middle" fill="#555555" font-size="9">找到 Socket</text>
  <line x1="119" y1="265" x2="134" y2="265" stroke="#7b1fa2" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- 底部注释 -->
  <text x="221" y="384" text-anchor="middle" fill="#888888" font-size="10">Socket 的价值：把复杂的协议栈封装成"读写缓冲区"</text>
  <text x="221" y="400" text-anchor="middle" fill="#888888" font-size="10">对应用而言，网络通信和读写文件几乎没有区别</text>
</svg>