<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 297" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <!-- Title -->
  <text x="306" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">TCP 粘包与拆包</text>

  <!-- Section 1: Sticky packet -->
  <text x="153" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">粘包</text>

  <!-- Sender side -->
  <text x="85" y="76" text-anchor="middle" font-size="10" fill="#666666">发送方发送两次</text>
  <rect x="26" y="85" width="68" height="42" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="60" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">"Hello"</text>
  <text x="60" y="117" text-anchor="middle" font-size="9" fill="#0d47a1">5 bytes</text>

  <rect x="102" y="85" width="68" height="42" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="136" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">"World"</text>
  <text x="136" y="117" text-anchor="middle" font-size="9" fill="#0d47a1">5 bytes</text>

  <!-- Arrow -->
  <text x="204" y="110" text-anchor="middle" font-size="12" fill="#4a148c">→</text>

  <!-- Receiver side -->
  <text x="289" y="76" text-anchor="middle" font-size="10" fill="#666666">接收方可能收到</text>
  <rect x="221" y="85" width="136" height="42" rx="5" fill="#ffcdd2" stroke="#c62828" stroke-width="1.7"/>
  <text x="289" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#b71c1c">"HelloWorld"</text>
  <text x="289" y="117" text-anchor="middle" font-size="9" fill="#b71c1c">10 bytes</text>

  <!-- Sticky label -->
  <rect x="255" y="134" width="68" height="20" rx="10" fill="#ffcdd2" stroke="#c62828" stroke-width="1.3"/>
  <text x="289" y="149" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">粘包！</text>

  <!-- Divider -->
  <line x1="357" y1="51" x2="357" y2="264" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Section 2: Packet splitting -->
  <text x="476" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">拆包</text>

  <!-- Sender side -->
  <text x="425" y="76" text-anchor="middle" font-size="10" fill="#666666">发送方发送一次</text>
  <rect x="374" y="85" width="136" height="42" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="442" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">"HelloWorld..."</text>
  <text x="442" y="117" text-anchor="middle" font-size="9" fill="#0d47a1">1000 bytes</text>

  <!-- Arrow -->
  <text x="536" y="110" text-anchor="middle" font-size="12" fill="#4a148c">→</text>

  <!-- Receiver side -->
  <text x="578" y="76" text-anchor="middle" font-size="10" fill="#666666">接收方可能收到</text>
  <rect x="544" y="85" width="55" height="42" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="571" y="102" text-anchor="middle" font-size="9" font-weight="bold" fill="#bf360c">"Hello"</text>
  <text x="571" y="117" text-anchor="middle" font-size="8" fill="#bf360c">500 B</text>

  <!-- Gap + second part -->
  <rect x="604" y="85" width="47" height="42" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="626" y="102" text-anchor="middle" font-size="9" font-weight="bold" fill="#bf360c">"World"</text>
  <text x="626" y="117" text-anchor="middle" font-size="8" fill="#bf360c">500 B</text>

  <!-- Split label -->
  <rect x="578" y="134" width="68" height="20" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="612" y="149" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">拆包！</text>

  <!-- Explanation box -->
  <rect x="68" y="170" width="476" height="110" rx="7" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1.3"/>
  <text x="306" y="191" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">为什么 UDP 没有这个问题？</text>
  <text x="306" y="212" text-anchor="middle" font-size="11" fill="#555555">TCP 是字节流协议，不保证消息边界</text>
  <text x="306" y="234" text-anchor="middle" font-size="11" fill="#555555">UDP 是数据报协议——每次 sendto() 对应一次 recvfrom()</text>
  <text x="306" y="255" text-anchor="middle" font-size="11" fill="#2e7d32" font-weight="bold">操作系统为 UDP 保留消息边界</text>
</svg>