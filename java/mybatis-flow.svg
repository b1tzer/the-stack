<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 493 527" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="headerG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color: #1565c0"/>
      <stop offset="100%" style="stop-color: #1565c0"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="34" y="13" width="425" height="37" rx="5" fill="url(#headerG)"/>
  <text x="246" y="37" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">MyBatis 核心架构</text>

  <!-- Step 1: Mapper Interface -->
  <rect x="68" y="68" width="357" height="42" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="246" y="94" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="bold">Mapper Interface → MapperProxy（JDK 动态代理）</text>

  <line x1="246" y1="110" x2="246" y2="132" stroke="#1565c0" stroke-width="1.7" marker-end="url(#arr)"/>

  <!-- Step 2: SqlSession -->
  <rect x="68" y="133" width="357" height="42" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="246" y="159" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="bold">SqlSession（会话：获取连接、提交/回滚、执行 SQL）</text>

  <line x1="246" y1="176" x2="246" y2="197" stroke="#1565c0" stroke-width="1.7" marker-end="url(#arr)"/>

  <!-- Step 3: Executor -->
  <rect x="68" y="199" width="357" height="42" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="246" y="224" text-anchor="middle" fill="#e65100" font-size="12" font-weight="bold">Executor（执行器：缓存、批处理、事务管理）</text>

  <line x1="246" y1="241" x2="246" y2="263" stroke="#1565c0" stroke-width="1.7" marker-end="url(#arr)"/>

  <!-- Step 4: StatementHandler -->
  <rect x="68" y="264" width="357" height="42" rx="5" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.3"/>
  <text x="246" y="290" text-anchor="middle" fill="#4a148c" font-size="12" font-weight="bold">StatementHandler（语句处理器：PrepareStatement 管理）</text>

  <line x1="246" y1="307" x2="246" y2="328" stroke="#1565c0" stroke-width="1.7" marker-end="url(#arr)"/>

  <!-- Step 5: ParameterHandler -->
  <rect x="68" y="330" width="170" height="42" rx="5" fill="#eceff1" stroke="#bdbdbd" stroke-width="1.3"/>
  <text x="153" y="355" text-anchor="middle" fill="#333333" font-size="11" font-weight="bold">ParameterHandler</text>
  <text x="153" y="368" text-anchor="middle" fill="#666666" font-size="9">设置 SQL 参数</text>

  <!-- Step 6: ResultSetHandler -->
  <rect x="255" y="330" width="170" height="42" rx="5" fill="#eceff1" stroke="#bdbdbd" stroke-width="1.3"/>
  <text x="340" y="355" text-anchor="middle" fill="#333333" font-size="11" font-weight="bold">ResultSetHandler</text>
  <text x="340" y="368" text-anchor="middle" fill="#666666" font-size="9">ResultSet → Java 对象</text>

  <!-- Merge arrows down -->
  <line x1="153" y1="372" x2="246" y2="400" stroke="#1565c0" stroke-width="1.3"/>
  <line x1="340" y1="372" x2="246" y2="400" stroke="#1565c0" stroke-width="1.3"/>
  <line x1="246" y1="400" x2="246" y2="416" stroke="#1565c0" stroke-width="1.7" marker-end="url(#arr)"/>

  <!-- Step 7: Database -->
  <rect x="68" y="418" width="357" height="42" rx="5" fill="#ffcdd2" stroke="#c62828" stroke-width="1.3"/>
  <text x="246" y="444" text-anchor="middle" fill="#b71c1c" font-size="12" font-weight="bold">Database（JDBC Driver → 数据库）</text>

  <!-- Side annotations -->
  <rect x="434" y="133" width="51" height="42" rx="3" fill="#eceff1" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="459" y="151" text-anchor="middle" fill="#888888" font-size="8">银行</text>
  <text x="459" y="164" text-anchor="middle" fill="#888888" font-size="8">柜台窗口</text>

  <rect x="434" y="199" width="51" height="42" rx="3" fill="#eceff1" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="459" y="217" text-anchor="middle" fill="#888888" font-size="8">银行后台</text>
  <text x="459" y="230" text-anchor="middle" fill="#888888" font-size="8">审批员</text>
</svg>