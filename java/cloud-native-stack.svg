<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 180" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10">
<defs>
  <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#666666"/>
  </marker>
</defs>

<text x="420" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">云原生技术栈演进</text>

<!-- 1 容器化 -->
<g transform="translate(20,50)">
  <rect x="0" y="0" width="170" height="70" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="85" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">容器化</text>
  <text x="85" y="52" text-anchor="middle" font-size="10" fill="#1565c0">Docker</text>
</g>

<!-- 2 编排调度 -->
<g transform="translate(230,50)">
  <rect x="0" y="0" width="170" height="70" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="85" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">编排调度</text>
  <text x="85" y="52" text-anchor="middle" font-size="10" fill="#2e7d32">Kubernetes</text>
</g>

<!-- 3 服务网格 -->
<g transform="translate(440,50)">
  <rect x="0" y="0" width="170" height="70" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="85" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#bf360c">服务网格</text>
  <text x="85" y="52" text-anchor="middle" font-size="10" fill="#e65100">Istio / Linkerd</text>
</g>

<!-- 4 Serverless -->
<g transform="translate(650,50)">
  <rect x="0" y="0" width="170" height="70" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.3"/>
  <text x="85" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a148c">Serverless</text>
  <text x="85" y="52" text-anchor="middle" font-size="10" fill="#7b1fa2">AWS Lambda / 函数计算</text>
</g>

<!-- 箭头 -->
<line x1="190" y1="85" x2="228" y2="85" stroke="#666666" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="209" y="105" text-anchor="middle" font-size="8" fill="#666666">自动扩缩容</text>

<line x1="400" y1="85" x2="438" y2="85" stroke="#666666" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="419" y="105" text-anchor="middle" font-size="8" fill="#666666">治理下沉</text>

<line x1="610" y1="85" x2="648" y2="85" stroke="#666666" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="629" y="105" text-anchor="middle" font-size="8" fill="#666666">按需计费</text>

<text x="420" y="150" text-anchor="middle" font-size="10" fill="#666666">演进方向：从管理服务器到管理代码，从预留资源到按需弹性</text>
</svg>
