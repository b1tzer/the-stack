<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 697 578" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10">
  <defs>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555555"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <text x="348" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Netty 一次请求的完整处理流程</text>

  <!-- Step boxes -->
  <g transform="translate(60, 46)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="272" height="31" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
    <text x="14" y="19" font-weight="bold" fill="#1565c0">1.</text>
    <text x="29" y="19" fill="#333333">客户端发起 TCP 连接</text>
    <line x1="136" y1="31" x2="136" y2="46" stroke="#555555" stroke-width="1.3" marker-end="url(#arD)"/>

    <!-- Step 2 -->
    <rect x="0" y="48" width="272" height="31" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
    <text x="14" y="66" font-weight="bold" fill="#1565c0">2.</text>
    <text x="29" y="66" fill="#333333">OS 内核完成三次握手，连接进入 accept 队列</text>
    <line x1="136" y1="78" x2="136" y2="94" stroke="#555555" stroke-width="1.3" marker-end="url(#arD)"/>

    <!-- Step 3 -->
    <rect x="0" y="95" width="272" height="31" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
    <text x="14" y="114" font-weight="bold" fill="#2e7d32">3.</text>
    <text x="29" y="114" fill="#333333">Boss NioEventLoop 的 Selector 检测到 ACCEPT 事件</text>
    <line x1="136" y1="126" x2="136" y2="141" stroke="#555555" stroke-width="1.3" marker-end="url(#arD)"/>

    <!-- Step 4 -->
    <rect x="0" y="143" width="272" height="31" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
    <text x="14" y="162" font-weight="bold" fill="#2e7d32">4.</text>
    <text x="29" y="162" fill="#333333">Boss 调用 accept()，获得 SocketChannel</text>
    <line x1="136" y1="173" x2="136" y2="189" stroke="#555555" stroke-width="1.3" marker-end="url(#arD)"/>

    <!-- Step 5 -->
    <rect x="0" y="190" width="272" height="31" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
    <text x="14" y="209" font-weight="bold" fill="#2e7d32">5.</text>
    <text x="29" y="209" fill="#333333">Boss 通过 Round-Robin 选择一个 Worker NioEventLoop</text>
    <line x1="136" y1="221" x2="136" y2="236" stroke="#555555" stroke-width="1.3" marker-end="url(#arD)"/>

    <!-- Step 6 -->
    <rect x="0" y="238" width="272" height="31" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
    <text x="14" y="257" font-weight="bold" fill="#2e7d32">6.</text>
    <text x="29" y="257" fill="#333333">将 SocketChannel 注册到 Worker 的 Selector（关注 READ）</text>
    <line x1="136" y1="269" x2="136" y2="284" stroke="#555555" stroke-width="1.3" marker-end="url(#arD)"/>

    <!-- Step 7 -->
    <rect x="0" y="286" width="272" height="31" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
    <text x="14" y="304" font-weight="bold" fill="#e65100">7.</text>
    <text x="29" y="304" fill="#333333">客户端发送数据，OS 将数据拷贝到 Socket 缓冲区</text>
    <line x1="136" y1="316" x2="136" y2="332" stroke="#555555" stroke-width="1.3" marker-end="url(#arD)"/>

    <!-- Step 8 -->
    <rect x="0" y="333" width="272" height="31" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
    <text x="14" y="352" font-weight="bold" fill="#e65100">8.</text>
    <text x="29" y="352" fill="#333333">Worker NioEventLoop 的 Selector 检测到 READ 事件</text>
    <line x1="136" y1="364" x2="136" y2="379" stroke="#555555" stroke-width="1.3" marker-end="url(#arD)"/>

    <!-- Step 9 -->
    <rect x="0" y="381" width="272" height="31" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
    <text x="14" y="400" font-weight="bold" fill="#e65100">9.</text>
    <text x="29" y="400" fill="#333333">Worker 从 Channel 读取数据到 ByteBuf</text>
    <line x1="136" y1="411" x2="136" y2="427" stroke="#555555" stroke-width="1.3" marker-end="url(#arD)"/>
  </g>

  <!-- Step 10 - Pipeline -->
  <rect x="51" y="471" width="272" height="31" rx="5" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1"/>
  <text x="65" y="490" font-weight="bold" fill="#7b1fa2">10.</text>
  <text x="80" y="490" fill="#333333">数据流经 Pipeline Handler 链：</text>

  <!-- Pipeline diagram -->
  <g transform="translate(420, 546)">
    <rect x="0" y="0" width="102" height="31" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="0.8"/>
    <text x="51" y="19" text-anchor="middle" font-size="9" fill="#0d47a1" font-weight="bold">HttpDecoder</text>
    <text x="51" y="42" text-anchor="middle" font-size="8" fill="#7b1fa2">字节 → HttpRequest</text>
    <line x1="102" y1="15" x2="119" y2="15" stroke="#555555" stroke-width="0.8" marker-end="url(#arR)"/>

    <rect x="122" y="0" width="110" height="31" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="0.8"/>
    <text x="178" y="19" text-anchor="middle" font-size="9" fill="#0d47a1" font-weight="bold">HttpAggregator</text>
    <text x="178" y="42" text-anchor="middle" font-size="8" fill="#7b1fa2">分片 → 完整请求</text>
    <line x1="233" y1="15" x2="250" y2="15" stroke="#555555" stroke-width="0.8" marker-end="url(#arR)"/>

    <rect x="253" y="0" width="110" height="31" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="0.8"/>
    <text x="309" y="19" text-anchor="middle" font-size="9" fill="#0d47a1" font-weight="bold">BusinessHandler</text>
    <text x="309" y="42" text-anchor="middle" font-size="8" fill="#7b1fa2">业务处理</text>
  </g>

  <!-- Step 11 -->
  <rect x="51" y="518" width="272" height="31" rx="5" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1"/>
  <text x="65" y="537" font-weight="bold" fill="#7b1fa2">11.</text>
  <text x="80" y="537" fill="#333333">BusinessHandler 处理业务，构造 Response</text>

  <!-- Step 12 -->
  <rect x="357" y="518" width="238" height="31" rx="5" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="371" y="537" font-weight="bold" fill="#c62828">12.</text>
  <text x="386" y="537" fill="#333333">Response 经 HttpEncoder → 写出 Channel</text>

  <!-- Step 13 -->
  <rect x="357" y="556" width="238" height="19" rx="3" fill="#eceff1" stroke="#888888" stroke-width="0.8"/>
  <text x="476" y="569" text-anchor="middle" font-size="9" fill="#888888">13. OS 将数据从 Socket 缓冲区发送到网络</text>
</svg>
