<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 356" width="560" height="356">
  <defs>
    <style>
      text { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
    </style>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowT" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#2e7d32"/></marker>
    <marker id="arrowF" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#c62828"/></marker>
  </defs>

  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">Animator 状态机：用参数切换动画</text>

  <!-- Idle 状态 -->
  <rect x="70" y="110" width="160" height="72" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="150" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">Idle（待机）</text>
  <text x="150" y="162" text-anchor="middle" font-size="11" fill="#1565c0">默认状态 · Entry 指向</text>

  <!-- Run 状态 -->
  <rect x="330" y="110" width="160" height="72" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="410" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">Run（跑步）</text>
  <text x="410" y="162" text-anchor="middle" font-size="11" fill="#2e7d32">isRunning == true 时</text>

  <!-- 过渡 Idle → Run（上方，绿色） -->
  <line x1="230" y1="118" x2="322" y2="118" stroke="#2e7d32" stroke-width="1.4" marker-end="url(#arrowT)"/>
  <text x="276" y="108" text-anchor="middle" font-size="11" fill="#2e7d32">isRunning == true</text>

  <!-- 过渡 Run → Idle（下方，红色） -->
  <line x1="330" y1="174" x2="238" y2="174" stroke="#c62828" stroke-width="1.4" marker-end="url(#arrowF)"/>
  <text x="284" y="192" text-anchor="middle" font-size="11" fill="#c62828">isRunning == false</text>

  <!-- 参数说明 -->
  <rect x="70" y="230" width="420" height="74" rx="7" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="90" y="252" font-size="12" font-weight="bold" fill="#333333">参数（Parameter）控制切换</text>
  <text x="90" y="272" font-size="11" fill="#666666">脚本 animator.SetBool("isRunning", running) 设置参数</text>
  <text x="90" y="289" font-size="11" fill="#666666">状态机据此决定播 Idle 还是 Run</text>

  <!-- 关键提示 -->
  <rect x="70" y="312" width="420" height="32" rx="7" fill="#fff8e1" stroke="#e65100" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="280" y="333" text-anchor="middle" font-size="11" fill="#bf360c">过渡（Transition）连状态；参数名必须与脚本里 SetBool 的名字完全一致</text>
</svg>
