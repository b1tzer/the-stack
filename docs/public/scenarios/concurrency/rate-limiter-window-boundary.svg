<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="640" height="340" fill="#ffffff"/>

  <!-- ============ 固定窗口 ============ -->
  <text x="40" y="48" font-size="15" font-weight="700" fill="#24292f">固定窗口</text>
  <text x="40" y="70" font-size="12" fill="#57606a">窗口 1 与窗口 2 交界处，两侧各自独立计数</text>

  <!-- 时间轴 -->
  <line x1="180" y1="120" x2="600" y2="120" stroke="#24292f" stroke-width="2"/>
  <polygon points="600,120 592,115 592,125" fill="#24292f"/>

  <!-- 窗口 1 -->
  <rect x="180" y="96" width="210" height="16" fill="#fff1f0" stroke="#DC382D" stroke-width="1"/>
  <text x="285" y="140" text-anchor="middle" font-size="12" fill="#24292f">窗口 1（放行 limit）</text>

  <!-- 窗口 2 -->
  <rect x="390" y="96" width="210" height="16" fill="#fff1f0" stroke="#DC382D" stroke-width="1"/>
  <text x="495" y="140" text-anchor="middle" font-size="12" fill="#24292f">窗口 2（放行 limit）</text>

  <!-- 边界突刺标记 -->
  <rect x="340" y="84" width="80" height="40" fill="none" stroke="#DC382D" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="380" y="162" text-anchor="middle" font-size="12" fill="#DC382D" font-weight="600">边界突刺：瞬间 2×limit</text>
  <line x1="380" y1="124" x2="380" y2="150" stroke="#DC382D" stroke-width="1" marker-end="url(#redarrow)"/>

  <defs>
    <marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC382D"/>
    </marker>
  </defs>

  <!-- ============ 滑动窗口 ============ -->
  <text x="40" y="228" font-size="15" font-weight="700" fill="#24292f">滑动窗口</text>
  <text x="40" y="250" font-size="12" fill="#57606a">任意时刻只统计最近 window 内的请求，窗口随请求平滑移动</text>

  <!-- 时间轴 -->
  <line x1="180" y1="300" x2="600" y2="300" stroke="#24292f" stroke-width="2"/>
  <polygon points="600,300 592,295 592,305" fill="#24292f"/>

  <!-- 滑动窗口框（覆盖最近 window 段） -->
  <rect x="330" y="276" width="170" height="16" fill="#e6f4ea" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="415" y="322" text-anchor="middle" font-size="12" fill="#1a7f37" font-weight="600">最近 window（无突刺）</text>

  <!-- 旧请求（已滑出窗口） -->
  <rect x="180" y="276" width="150" height="16" fill="#f6f8fa" stroke="#c0c8d0" stroke-width="1"/>
  <text x="255" y="270" text-anchor="middle" font-size="11" fill="#57606a">已滑出，不再计数</text>
</svg>
