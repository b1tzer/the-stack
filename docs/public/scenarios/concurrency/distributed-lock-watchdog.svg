<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="640" height="280" fill="#ffffff"/>

  <rect x="150" y="20" width="170" height="44" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="235" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">加锁（默认 30 秒）</text>

  <rect x="150" y="115" width="170" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="235" y="137" text-anchor="middle" font-size="13" fill="#24292f">看门狗定时检查</text>

  <rect x="430" y="115" width="170" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="515" y="137" text-anchor="middle" font-size="13" fill="#24292f">自动续期到 30 秒</text>

  <rect x="155" y="215" width="140" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="225" y="237" text-anchor="middle" font-size="13" fill="#24292f">停止续期</text>

  <line x1="235" y1="64" x2="235" y2="107" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="320" y1="137" x2="422" y2="137" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="371" y="127" text-anchor="middle" font-size="11" fill="#57606a">锁仍持有</text>

  <path d="M 515 115 C 515 62, 235 62, 235 107" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="235" y1="159" x2="225" y2="207" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="262" y="190" font-size="11" fill="#57606a">已释放</text>
</svg>
