<svg xmlns="http://www.w3.org/2000/svg" width="560" height="290" viewBox="0 0 560 290" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#57606a"/></marker>
  </defs>
  <rect width="560" height="290" fill="#ffffff"/>

  <rect x="20" y="30" width="500" height="130" rx="10" fill="#f6f8fa" stroke="#9aa4af" stroke-dasharray="5 4"/>
  <text x="30" y="52" font-size="13" font-weight="700" fill="#57606a">读请求</text>

  <rect x="65" y="78" width="90" height="44" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="110" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">查缓存</text>

  <rect x="275" y="58" width="110" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="330" y="80" text-anchor="middle" font-size="13" fill="#24292f">命中则返回</text>

  <rect x="235" y="108" width="190" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="330" y="130" text-anchor="middle" font-size="13" fill="#24292f">未命中查库，回填缓存</text>

  <line x1="155" y1="100" x2="263.16" y2="81.97" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="155" y1="100" x2="223.76" y2="125.79" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="190" width="340" height="80" rx="10" fill="#f6f8fa" stroke="#9aa4af" stroke-dasharray="5 4"/>
  <text x="30" y="212" font-size="13" font-weight="700" fill="#57606a">写请求</text>

  <rect x="55" y="213" width="110" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="110" y="235" text-anchor="middle" font-size="13" fill="#24292f">更新数据库</text>

  <rect x="235" y="213" width="90" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="280" y="235" text-anchor="middle" font-size="13" fill="#24292f">删除缓存</text>

  <line x1="165" y1="235" x2="223" y2="235" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
