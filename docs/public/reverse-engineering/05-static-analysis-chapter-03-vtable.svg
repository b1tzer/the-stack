<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <defs>
    <style>
      text { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
    </style>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#555555"/></marker>
  </defs>

  <!-- 对象实例框 -->
  <rect x="16" y="70" width="180" height="150" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="106" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">对象实例</text>
  <rect x="32" y="104" width="148" height="28" rx="5" fill="#bbdefb" stroke="#1565c0" stroke-width="0.8"/>
  <text x="106" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">vptr（指向 vtable）</text>
  <text x="106" y="158" text-anchor="middle" font-size="11" fill="#555555">成员 1</text>
  <text x="106" y="190" text-anchor="middle" font-size="11" fill="#555555">成员 2</text>

  <!-- vtable 框 -->
  <rect x="280" y="70" width="160" height="150" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="360" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a148c">vtable</text>
  <rect x="296" y="104" width="128" height="28" rx="5" fill="#e1bee7" stroke="#7b1fa2" stroke-width="0.8"/>
  <text x="360" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">&amp;func1</text>
  <rect x="296" y="138" width="128" height="28" rx="5" fill="#e1bee7" stroke="#7b1fa2" stroke-width="0.8"/>
  <text x="360" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">&amp;func2</text>
  <text x="360" y="190" text-anchor="middle" font-size="11" fill="#7b1fa2">...</text>

  <!-- 实际函数框 -->
  <rect x="520" y="70" width="110" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="575" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">实际函数</text>
  <text x="575" y="122" text-anchor="middle" font-size="11" fill="#2e7d32">func1 实现</text>
  <text x="575" y="156" text-anchor="middle" font-size="11" fill="#2e7d32">func2 实现</text>

  <!-- 箭头：vptr → vtable &func1 -->
  <line x1="196" y1="118" x2="270" y2="118" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <!-- 箭头：vtable &func1 → func1 实现 -->
  <line x1="440" y1="118" x2="510" y2="118" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <!-- 箭头：vtable &func2 → func2 实现 -->
  <line x1="440" y1="152" x2="510" y2="152" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 底部说明 -->
  <text x="320" y="268" text-anchor="middle" font-size="11" fill="#555555">虚函数调用：对象 → vptr → vtable → 函数指针，三级间接跳转</text>
</svg>
