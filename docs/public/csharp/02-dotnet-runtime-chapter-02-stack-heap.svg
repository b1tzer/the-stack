<svg height="220" xmlns="http://www.w3.org/2000/svg" width="560" viewBox="0 0 560 220" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="280" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">栈与堆：引用指向对象</text>

  <!-- Stack -->
  <rect x="30" y="50" width="150" height="110" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="105" y="72" text-anchor="middle" fill="#0d47a1" font-weight="bold">栈（局部变量）</text>
  <rect x="45" y="88" width="120" height="34" rx="5" fill="#ffffff" stroke="#90caf9" stroke-width="1.3"/>
  <text x="105" y="109" text-anchor="middle" fill="#1565c0" font-weight="bold">Holder 引用</text>

  <!-- Arrow -->
  <line x1="180" y1="105" x2="340" y2="105" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="260" y="98" text-anchor="middle" fill="#888888" font-size="11">引用指向</text>

  <!-- Heap object -->
  <rect x="340" y="50" width="200" height="110" rx="7" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.3"/>
  <text x="440" y="72" text-anchor="middle" fill="#4a148c" font-weight="bold">托管堆（对象）</text>
  <rect x="350" y="82" width="180" height="22" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="0.8"/>
  <text x="440" y="97" text-anchor="middle" fill="#546e7a">对象头</text>
  <rect x="350" y="106" width="180" height="22" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="0.8"/>
  <text x="440" y="121" text-anchor="middle" fill="#546e7a">方法表指针</text>
  <rect x="350" y="130" width="180" height="22" rx="3" fill="#fff3e0" stroke="#ffb74d" stroke-width="0.8"/>
  <text x="440" y="145" text-anchor="middle" fill="#bf360c">字段（Point.X / Point.Y）</text>

  <text x="280" y="192" text-anchor="middle" fill="#888888" font-size="11">引用类型变量保存引用，对象在堆上；值类型字段内联在对象里</text>

  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#555555"/></marker></defs>
</svg>
