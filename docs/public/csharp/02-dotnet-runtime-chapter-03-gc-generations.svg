<svg height="220" xmlns="http://www.w3.org/2000/svg" width="560" viewBox="0 0 560 220" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="280" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">分代回收（Generational GC）</text>

  <!-- Gen0 -->
  <rect x="30" y="55" width="140" height="64" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="100" y="80" text-anchor="middle" fill="#1b5e20" font-weight="bold">Gen0（新生代）</text>
  <text x="100" y="100" text-anchor="middle" fill="#388e3c">新分配的对象</text>

  <!-- Gen1 -->
  <rect x="210" y="55" width="140" height="64" rx="7" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="280" y="80" text-anchor="middle" fill="#bf360c" font-weight="bold">Gen1（幸存代）</text>
  <text x="280" y="100" text-anchor="middle" fill="#ef6c00">从 Gen0 幸存</text>

  <!-- Gen2 -->
  <rect x="390" y="55" width="140" height="64" rx="7" fill="#ffcdd2" stroke="#c62828" stroke-width="1.3"/>
  <text x="460" y="80" text-anchor="middle" fill="#b71c1c" font-weight="bold">Gen2（老年代）</text>
  <text x="460" y="100" text-anchor="middle" fill="#d32f2f">长期存活</text>

  <!-- Promotion arrows -->
  <line x1="170" y1="87" x2="210" y2="87" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="190" y="80" text-anchor="middle" fill="#888888">晋升</text>
  <line x1="350" y1="87" x2="390" y2="87" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="370" y="80" text-anchor="middle" fill="#888888">晋升</text>

  <!-- LOH -->
  <rect x="210" y="150" width="140" height="40" rx="7" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.3"/>
  <text x="280" y="175" text-anchor="middle" fill="#4a148c" font-weight="bold">LOH（大对象）</text>

  <text x="280" y="208" text-anchor="middle" fill="#888888" font-size="11">新对象从 Gen0 开始，存活后逐代晋升；大对象直接进入 LOH</text>

  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#555555"/></marker></defs>
</svg>
