<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <title>表空间三级结构：段 → 区 → 页</title>

  <!-- 标题 -->
  <text x="480" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">表空间三级结构：段 → 区 → 页</text>

  <!-- ============ 左侧：嵌套结构图 ============ -->

  <!-- 表空间 -->
  <rect x="24" y="44" width="500" height="468" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
  <text x="36" y="68" fill="#3949ab" font-weight="bold" font-size="13">表空间 Tablespace（.ibd）</text>

  <!-- 数据段 -->
  <rect x="42" y="80" width="464" height="164" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="52" y="100" fill="#1b5e20" font-weight="bold" font-size="12">段 Segment</text>
  <text x="52" y="114" fill="#555555" font-size="9">数据段 · 叶子节点</text>

  <!-- 区1（展开页） -->
  <rect x="58" y="124" width="212" height="108" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="66" y="142" fill="#bf360c" font-weight="bold" font-size="10">区 Extent</text>
  <text x="66" y="156" fill="#6d4c41" font-size="8">1MB = 64 个连续页</text>
  <rect x="66" y="162" width="42" height="60" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="0.8"/>
  <text x="87" y="188" text-anchor="middle" fill="#0d47a1" font-size="8">Page</text>
  <text x="87" y="200" text-anchor="middle" fill="#0d47a1" font-size="8">16KB</text>
  <rect x="116" y="162" width="42" height="60" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="0.8"/>
  <text x="137" y="188" text-anchor="middle" fill="#0d47a1" font-size="8">Page</text>
  <text x="137" y="200" text-anchor="middle" fill="#0d47a1" font-size="8">16KB</text>
  <rect x="166" y="162" width="42" height="60" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="0.8"/>
  <text x="187" y="188" text-anchor="middle" fill="#0d47a1" font-size="8">Page</text>
  <text x="187" y="200" text-anchor="middle" fill="#0d47a1" font-size="8">16KB</text>
  <rect x="216" y="162" width="42" height="60" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="0.8"/>
  <text x="237" y="188" text-anchor="middle" fill="#0d47a1" font-size="8">Page</text>
  <text x="237" y="200" text-anchor="middle" fill="#0d47a1" font-size="8">16KB</text>

  <!-- 区2 -->
  <rect x="282" y="124" width="212" height="108" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="290" y="142" fill="#bf360c" font-weight="bold" font-size="10">区 Extent</text>
  <text x="290" y="156" fill="#6d4c41" font-size="8">1MB = 64 个连续页</text>
  <rect x="290" y="164" width="196" height="56" rx="2" fill="#ffe0b2" stroke="#e65100" stroke-width="0.7" stroke-dasharray="3,2"/>
  <text x="388" y="196" text-anchor="middle" fill="#bf360c" font-size="9">64 个 Page · 16KB</text>

  <!-- 索引段 -->
  <rect x="42" y="258" width="464" height="164" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="52" y="278" fill="#1b5e20" font-weight="bold" font-size="12">段 Segment</text>
  <text x="52" y="292" fill="#555555" font-size="9">索引段 · 非叶子节点</text>

  <!-- 区3 -->
  <rect x="58" y="302" width="212" height="108" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="66" y="320" fill="#bf360c" font-weight="bold" font-size="10">区 Extent</text>
  <text x="66" y="334" fill="#6d4c41" font-size="8">1MB = 64 个连续页</text>
  <rect x="66" y="342" width="196" height="56" rx="2" fill="#ffe0b2" stroke="#e65100" stroke-width="0.7" stroke-dasharray="3,2"/>
  <text x="164" y="374" text-anchor="middle" fill="#bf360c" font-size="9">64 个 Page · 16KB</text>

  <!-- 区4 -->
  <rect x="282" y="302" width="212" height="108" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="290" y="320" fill="#bf360c" font-weight="bold" font-size="10">区 Extent</text>
  <text x="290" y="334" fill="#6d4c41" font-size="8">1MB = 64 个连续页</text>
  <rect x="290" y="342" width="196" height="56" rx="2" fill="#ffe0b2" stroke="#e65100" stroke-width="0.7" stroke-dasharray="3,2"/>
  <text x="388" y="374" text-anchor="middle" fill="#bf360c" font-size="9">64 个 Page · 16KB</text>

  <!-- ============ 右侧：三级说明 ============ -->

  <!-- 段说明 -->
  <rect x="560" y="80" width="380" height="132" rx="6" fill="#f1f8e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="576" y="102" fill="#1b5e20" font-weight="bold" font-size="12">① 段 Segment</text>
  <text x="576" y="120" fill="#555555" font-size="10">含义：按索引划分，一个索引一个段；</text>
  <text x="576" y="136" fill="#555555" font-size="10">聚簇索引的叶子节点与非叶子节点分属两个段</text>
  <text x="576" y="156" fill="#1b5e20" font-size="10" font-weight="bold">作用</text>
  <text x="576" y="172" fill="#555555" font-size="10">各自独立增长，互不干扰</text>
  <text x="576" y="192" fill="#888888" font-size="9">示例：上图两个段分别承载数据与索引</text>

  <!-- 区说明 -->
  <rect x="560" y="232" width="380" height="110" rx="6" fill="#fff8e1" stroke="#e65100" stroke-width="1.4"/>
  <text x="576" y="254" fill="#bf360c" font-weight="bold" font-size="12">② 区 Extent</text>
  <text x="576" y="272" fill="#555555" font-size="10">含义：1MB，由 64 个连续页组成</text>
  <text x="576" y="292" fill="#bf360c" font-size="10" font-weight="bold">作用</text>
  <text x="576" y="308" fill="#555555" font-size="10">连续分配，把随机 IO 变成顺序 IO</text>
  <text x="576" y="326" fill="#888888" font-size="9">B+ 树相邻页尽量落在磁盘相邻位置</text>

  <!-- 页说明 -->
  <rect x="560" y="362" width="380" height="130" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="576" y="384" fill="#0d47a1" font-weight="bold" font-size="12">③ 页 Page</text>
  <text x="576" y="402" fill="#555555" font-size="10">含义：16KB，磁盘 IO 与内存管理的最小单位</text>
  <text x="576" y="422" fill="#0d47a1" font-size="10" font-weight="bold">作用</text>
  <text x="576" y="438" fill="#555555" font-size="10">Buffer Pool 按页缓存、Redo Log 按页记录、</text>
  <text x="576" y="454" fill="#555555" font-size="10">崩溃恢复按页重放</text>
  <text x="576" y="476" fill="#888888" font-size="9">详见「数据页与行格式」一章</text>
</svg>
