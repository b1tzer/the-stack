<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="470" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">表空间三级结构：段 → 区 → 页</text>

  <!-- 表空间容器 -->
  <rect x="40" y="44" width="860" height="410" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
  <text x="56" y="68" fill="#3949ab" font-weight="bold" font-size="13">表空间 Tablespace（.ibd）</text>

  <!-- 数据段 -->
  <rect x="58" y="84" width="824" height="170" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="70" y="106" fill="#1b5e20" font-weight="bold" font-size="12">段 Segment · 数据段（叶子节点）</text>

  <!-- 数据段 · 区1（展开页） -->
  <rect x="74" y="118" width="388" height="112" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="82" y="140" fill="#bf360c" font-weight="bold" font-size="10">区 Extent</text>
  <text x="148" y="140" fill="#8d6e63" font-size="9">1MB = 64 个连续页</text>
  <rect x="86" y="152" width="70" height="64" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="0.9"/>
  <text x="121" y="180" text-anchor="middle" fill="#0d47a1" font-size="9">Page</text>
  <text x="121" y="196" text-anchor="middle" fill="#0d47a1" font-size="9">16KB</text>
  <rect x="168" y="152" width="70" height="64" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="0.9"/>
  <text x="203" y="180" text-anchor="middle" fill="#0d47a1" font-size="9">Page</text>
  <text x="203" y="196" text-anchor="middle" fill="#0d47a1" font-size="9">16KB</text>
  <rect x="250" y="152" width="70" height="64" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="0.9"/>
  <text x="285" y="180" text-anchor="middle" fill="#0d47a1" font-size="9">Page</text>
  <text x="285" y="196" text-anchor="middle" fill="#0d47a1" font-size="9">16KB</text>
  <rect x="332" y="152" width="70" height="64" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="0.9"/>
  <text x="367" y="180" text-anchor="middle" fill="#0d47a1" font-size="9">Page</text>
  <text x="367" y="196" text-anchor="middle" fill="#0d47a1" font-size="9">16KB</text>

  <!-- 数据段 · 区2（整区示意） -->
  <rect x="486" y="118" width="388" height="112" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="494" y="140" fill="#bf360c" font-weight="bold" font-size="10">区 Extent</text>
  <text x="560" y="140" fill="#8d6e63" font-size="9">1MB = 64 个连续页</text>
  <rect x="494" y="152" width="368" height="64" rx="2" fill="#ffe0b2" stroke="#e65100" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="678" y="188" text-anchor="middle" fill="#bf360c" font-size="9">64 个 Page · 连续分配</text>

  <!-- 索引段 -->
  <rect x="58" y="268" width="824" height="170" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="70" y="290" fill="#1b5e20" font-weight="bold" font-size="12">段 Segment · 索引段（非叶子节点）</text>

  <!-- 索引段 · 区3（展开页） -->
  <rect x="74" y="302" width="388" height="112" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="82" y="324" fill="#bf360c" font-weight="bold" font-size="10">区 Extent</text>
  <text x="148" y="324" fill="#8d6e63" font-size="9">1MB = 64 个连续页</text>
  <rect x="86" y="336" width="70" height="64" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="0.9"/>
  <text x="121" y="364" text-anchor="middle" fill="#0d47a1" font-size="9">Page</text>
  <text x="121" y="380" text-anchor="middle" fill="#0d47a1" font-size="9">16KB</text>
  <rect x="168" y="336" width="70" height="64" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="0.9"/>
  <text x="203" y="364" text-anchor="middle" fill="#0d47a1" font-size="9">Page</text>
  <text x="203" y="380" text-anchor="middle" fill="#0d47a1" font-size="9">16KB</text>
  <rect x="250" y="336" width="70" height="64" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="0.9"/>
  <text x="285" y="364" text-anchor="middle" fill="#0d47a1" font-size="9">Page</text>
  <text x="285" y="380" text-anchor="middle" fill="#0d47a1" font-size="9">16KB</text>
  <rect x="332" y="336" width="70" height="64" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="0.9"/>
  <text x="367" y="364" text-anchor="middle" fill="#0d47a1" font-size="9">Page</text>
  <text x="367" y="380" text-anchor="middle" fill="#0d47a1" font-size="9">16KB</text>

  <!-- 索引段 · 区4（整区示意） -->
  <rect x="486" y="302" width="388" height="112" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="494" y="324" fill="#bf360c" font-weight="bold" font-size="10">区 Extent</text>
  <text x="560" y="324" fill="#8d6e63" font-size="9">1MB = 64 个连续页</text>
  <rect x="494" y="336" width="368" height="64" rx="2" fill="#ffe0b2" stroke="#e65100" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="678" y="372" text-anchor="middle" fill="#bf360c" font-size="9">64 个 Page · 连续分配</text>
</svg>
