<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrOrange" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="470" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">next_record 单链表：逻辑有序，物理乱序</text>

  <!-- ① 物理空间 -->
  <text x="60" y="56" font-size="12" font-weight="bold" fill="#3949ab">① 页内物理空间：记录落在任意空闲位置</text>
  <rect x="60" y="68" width="820" height="120" rx="6" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.2"/>

  <rect x="60" y="68" width="90" height="120" fill="#e8eaf6" stroke="#3949ab" stroke-width="1"/>
  <text x="105" y="124" text-anchor="middle" fill="#3949ab" font-size="10" font-weight="bold">File</text>
  <text x="105" y="140" text-anchor="middle" fill="#3949ab" font-size="10" font-weight="bold">Header</text>

  <rect x="640" y="68" width="130" height="120" fill="#ffffff" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="705" y="132" text-anchor="middle" fill="#757575" font-size="10">Free Space</text>

  <rect x="770" y="68" width="110" height="120" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="825" y="124" text-anchor="middle" fill="#bf360c" font-size="10" font-weight="bold">Page</text>
  <text x="825" y="140" text-anchor="middle" fill="#bf360c" font-size="10" font-weight="bold">Directory</text>

  <!-- 物理散落的记录 -->
  <rect x="160" y="92" width="76" height="48" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="198" y="121" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="bold">id=5</text>

  <rect x="280" y="92" width="76" height="48" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="318" y="121" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="bold">id=1</text>

  <rect x="400" y="92" width="76" height="48" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="438" y="121" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="bold">id=12</text>

  <rect x="520" y="92" width="76" height="48" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="558" y="121" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="bold">id=8</text>

  <!-- next_record：直箭头水平入框；长跳走下方走廊，拐上来后水平进入 id=8 左侧 -->
  <line x1="280" y1="116" x2="250" y2="116" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>
  <path d="M198,140 Q198,160 214,160 H468 Q484,160 484,152 V138 Q484,130 492,130 H506" fill="none" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>
  <line x1="520" y1="108" x2="490" y2="108" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>

  <text x="470" y="212" text-anchor="middle" fill="#555555" font-size="11">物理顺序：id=5, id=1, id=12, id=8 —— 与主键无关，取决于哪里有空位</text>

  <!-- ② 逻辑链表 -->
  <text x="60" y="252" font-size="12" font-weight="bold" fill="#3949ab">② 逻辑顺序：next_record 串成的单链表</text>

  <rect x="60" y="266" width="110" height="52" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="1.4"/>
  <text x="115" y="288" text-anchor="middle" fill="#424242" font-size="12" font-weight="bold">Infimum</text>
  <text x="115" y="306" text-anchor="middle" fill="#757575" font-size="9">虚拟最小</text>

  <rect x="210" y="266" width="100" height="52" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="260" y="298" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="bold">id=1</text>

  <rect x="350" y="266" width="100" height="52" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="400" y="298" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="bold">id=5</text>

  <rect x="490" y="266" width="100" height="52" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="540" y="298" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="bold">id=8</text>

  <rect x="630" y="266" width="100" height="52" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="680" y="298" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="bold">id=12</text>

  <rect x="770" y="266" width="110" height="52" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="1.4"/>
  <text x="825" y="288" text-anchor="middle" fill="#424242" font-size="12" font-weight="bold">Supremum</text>
  <text x="825" y="306" text-anchor="middle" fill="#757575" font-size="9">虚拟最大</text>

  <line x1="170" y1="292" x2="194" y2="292" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>
  <line x1="310" y1="292" x2="334" y2="292" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>
  <line x1="450" y1="292" x2="474" y2="292" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>
  <line x1="590" y1="292" x2="614" y2="292" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>
  <line x1="730" y1="292" x2="754" y2="292" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>

  <!-- 底部要点 -->
  <rect x="60" y="346" width="820" height="88" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.2"/>
  <text x="76" y="374" fill="#424242" font-size="11" font-weight="bold">next_record 存的是「下一条记录相对本记录的偏移量」，指向逻辑上的下一条，而非物理相邻的下一条。</text>
  <text x="76" y="400" fill="#555555" font-size="11">插入：新记录落到 Free Space 的空闲位置，靠 next_record 接回正确的主键顺序；</text>
  <text x="76" y="422" fill="#555555" font-size="11">删除：记录占的空间标记为可复用，链表跳过它重新缝合。</text>
</svg>
