<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrOrange" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <text x="470" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Binlog：单向追加的事件序列 + 主从复制数据流</text>

  <!-- ① 事件序列 -->
  <text x="30" y="62" fill="#1b5e20" font-size="13" font-weight="bold">① 一个文件 = 一串事件顺序追加（append-only）</text>

  <rect x="30" y="76" width="110" height="48" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="85" y="104" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="bold">Format</text>

  <line x1="144" y1="100" x2="170" y2="100" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>

  <rect x="184" y="76" width="110" height="48" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="239" y="104" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="bold">Table_map</text>

  <line x1="298" y1="100" x2="324" y2="100" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>

  <rect x="338" y="76" width="110" height="48" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1.2"/>
  <text x="393" y="104" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="bold">Write</text>

  <line x1="452" y1="100" x2="478" y2="100" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>

  <rect x="492" y="76" width="110" height="48" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1.2"/>
  <text x="547" y="104" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="bold">Update</text>

  <line x1="606" y1="100" x2="632" y2="100" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>

  <rect x="646" y="76" width="110" height="48" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1.2"/>
  <text x="701" y="104" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="bold">Delete</text>

  <line x1="760" y1="100" x2="786" y2="100" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>

  <rect x="800" y="76" width="110" height="48" rx="4" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.4"/>
  <text x="855" y="104" text-anchor="middle" fill="#6a1b9a" font-size="12" font-weight="bold">XID</text>

  <text x="30" y="152" fill="#555555" font-size="11">事件从文件头到文件尾单向追加；XID 是事务提交标记（两阶段提交的分水岭）</text>

  <!-- ② 主从复制 -->
  <text x="30" y="204" fill="#0d47a1" font-size="13" font-weight="bold">② 主从复制：主库写，从库拉取重放</text>

  <rect x="40" y="226" width="180" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="130" y="259" text-anchor="middle" fill="#0d47a1" font-size="13" font-weight="bold">主库</text>

  <line x1="224" y1="254" x2="346" y2="254" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="285" y="242" text-anchor="middle" fill="#1565c0" font-size="10" font-weight="bold">写 Binlog</text>

  <rect x="360" y="226" width="180" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="450" y="259" text-anchor="middle" fill="#0d47a1" font-size="13" font-weight="bold">Binlog 文件</text>

  <line x1="544" y1="254" x2="666" y2="254" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="605" y="242" text-anchor="middle" fill="#1565c0" font-size="10" font-weight="bold">拉取重放</text>

  <rect x="680" y="226" width="180" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="770" y="259" text-anchor="middle" fill="#0d47a1" font-size="13" font-weight="bold">从库</text>
</svg>
