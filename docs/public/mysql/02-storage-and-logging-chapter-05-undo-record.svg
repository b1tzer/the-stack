<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 280" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="470" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">一条 Undo 记录：逆向操作，不是数据快照</text>

  <!-- 记录条带 -->
  <rect x="60" y="70" width="140" height="64" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="130" y="96" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="bold">undo_no</text>
  <text x="130" y="118" text-anchor="middle" fill="#555555" font-size="10">事务内序号 3</text>

  <rect x="200" y="70" width="190" height="64" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="295" y="96" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="bold">表 ID / 主键</text>
  <text x="295" y="118" text-anchor="middle" fill="#555555" font-size="10">users / id=1</text>

  <rect x="390" y="70" width="250" height="64" fill="#fff3e0" stroke="#e65100" stroke-width="1.4"/>
  <text x="515" y="96" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="bold">被修改的列及旧值</text>
  <text x="515" y="118" text-anchor="middle" fill="#555555" font-size="10">balance 旧值 = 500</text>

  <rect x="640" y="70" width="240" height="64" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.4"/>
  <text x="760" y="96" text-anchor="middle" fill="#6a1b9a" font-size="12" font-weight="bold">指向前一条 Undo</text>
  <text x="760" y="118" text-anchor="middle" fill="#555555" font-size="10">同事务内串成链</text>

  <!-- 语义对比 -->
  <rect x="60" y="170" width="400" height="72" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.4"/>
  <text x="76" y="198" fill="#b71c1c" font-size="12" font-weight="bold">不是：整行数据快照</text>
  <text x="76" y="222" fill="#555555" font-size="10">不复制整行，不拷贝整页</text>

  <rect x="500" y="170" width="400" height="72" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="516" y="198" fill="#1b5e20" font-size="12" font-weight="bold">而是：逆向操作 + 旧值</text>
  <text x="516" y="222" fill="#555555" font-size="10">「把 balance 加回 100」，旧值供回滚与 MVCC 使用</text>
</svg>
