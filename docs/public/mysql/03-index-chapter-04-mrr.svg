<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#757575"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2e7d32"/>
    </marker>
  </defs>

  <text x="470" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">MRR：把乱序回表改成排序后顺序回表</text>

  <!-- 传统 -->
  <text x="40" y="64" font-size="12" font-weight="bold" fill="#c62828">传统：拿到一个主键，立刻回表一次</text>

  <rect x="40" y="88" width="280" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="180" y="112" text-anchor="middle" fill="#0d47a1" font-size="11" font-weight="bold">① 范围查询取出主键</text>
  <text x="180" y="132" text-anchor="middle" fill="#555555" font-size="10">37, 5, 29, 12（按 age 有序，主键乱序）</text>

  <line x1="324" y1="116" x2="356" y2="116" stroke="#757575" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <rect x="370" y="88" width="230" height="56" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.4"/>
  <text x="485" y="112" text-anchor="middle" fill="#c62828" font-size="11" font-weight="bold">② 按拿到的顺序逐个回表</text>
  <text x="485" y="132" text-anchor="middle" fill="#b71c1c" font-size="10">37 → 5 → 29 → 12，位置来回跳</text>

  <line x1="604" y1="116" x2="636" y2="116" stroke="#757575" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <rect x="650" y="88" width="230" height="56" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.4"/>
  <text x="765" y="112" text-anchor="middle" fill="#c62828" font-size="11" font-weight="bold">③ 大量随机 IO</text>
  <text x="765" y="132" text-anchor="middle" fill="#b71c1c" font-size="10">磁头反复寻道</text>

  <!-- MRR -->
  <text x="40" y="192" font-size="12" font-weight="bold" fill="#1b5e20">MRR：先收集、排序，再回表</text>

  <rect x="40" y="216" width="280" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="180" y="240" text-anchor="middle" fill="#0d47a1" font-size="11" font-weight="bold">① 同样取出主键</text>
  <text x="180" y="260" text-anchor="middle" fill="#555555" font-size="10">37, 5, 29, 12</text>

  <line x1="324" y1="244" x2="356" y2="244" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrGreen)"/>

  <rect x="370" y="216" width="230" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="485" y="240" text-anchor="middle" fill="#0d47a1" font-size="11" font-weight="bold">② 缓冲区里按主键排序</text>
  <text x="485" y="260" text-anchor="middle" fill="#555555" font-size="10">5, 12, 29, 37</text>

  <line x1="604" y1="244" x2="636" y2="244" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrGreen)"/>

  <rect x="650" y="216" width="230" height="56" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="765" y="240" text-anchor="middle" fill="#1b5e20" font-size="11" font-weight="bold">③ 按主键顺序回表</text>
  <text x="765" y="260" text-anchor="middle" fill="#555555" font-size="10">数据按主键存放 → 顺序连续读</text>
</svg>
