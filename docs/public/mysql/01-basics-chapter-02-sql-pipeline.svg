<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 200" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12">
  <defs>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#757575"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="470" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">一条 SQL 的执行流水线</text>

  <!-- Client -->
  <rect x="22" y="64" width="120" height="64" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="1.4"/>
  <text x="82" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#424242">Client</text>
  <text x="82" y="150" text-anchor="middle" font-size="11" fill="#555555">提交 SQL 文本</text>

  <!-- 连接器 -->
  <rect x="177" y="64" width="120" height="64" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="237" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">连接器</text>
  <text x="237" y="150" text-anchor="middle" font-size="11" fill="#555555">认证 · 权限 · 分配线程</text>

  <!-- 解析器 -->
  <rect x="332" y="64" width="120" height="64" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="392" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">解析器</text>
  <text x="392" y="150" text-anchor="middle" font-size="11" fill="#555555">SQL → 语法树</text>
  <text x="392" y="168" text-anchor="middle" font-size="11" fill="#555555">词法 / 语法 / 语义检查</text>

  <!-- 优化器 -->
  <rect x="487" y="64" width="120" height="64" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="547" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">优化器</text>
  <text x="547" y="150" text-anchor="middle" font-size="11" fill="#555555">语法树 → 执行计划</text>
  <text x="547" y="168" text-anchor="middle" font-size="11" fill="#555555">基于成本选择</text>

  <!-- 执行器 -->
  <rect x="642" y="64" width="120" height="64" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="702" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">执行器</text>
  <text x="702" y="150" text-anchor="middle" font-size="11" fill="#555555">校验权限后</text>
  <text x="702" y="168" text-anchor="middle" font-size="11" fill="#555555">调用引擎接口</text>

  <!-- 存储引擎 -->
  <rect x="797" y="64" width="120" height="64" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.4"/>
  <text x="857" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">存储引擎</text>
  <text x="857" y="114" text-anchor="middle" font-size="11" fill="#555555">InnoDB 等</text>
  <text x="857" y="150" text-anchor="middle" font-size="11" fill="#555555">读写数据</text>
  <text x="857" y="168" text-anchor="middle" font-size="11" fill="#555555">返回行数据</text>

  <!-- 箭头 -->
  <line x1="144" y1="96" x2="165" y2="96" stroke="#757575" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <line x1="299" y1="96" x2="320" y2="96" stroke="#757575" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <line x1="454" y1="96" x2="475" y2="96" stroke="#757575" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <line x1="609" y1="96" x2="630" y2="96" stroke="#757575" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <line x1="764" y1="96" x2="785" y2="96" stroke="#e65100" stroke-width="1.6" marker-end="url(#arrOrange)"/>
</svg>
