<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <text x="470" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">聚簇索引：数据就存在叶子节点里</text>

  <!-- 根节点 -->
  <rect x="370" y="64" width="200" height="48" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="470" y="94" text-anchor="middle" fill="#0d47a1" font-size="13" font-weight="bold">[10 | 20 | 30]</text>
  <text x="596" y="96" fill="#555555" font-size="10">非叶子节点：只存主键值 + 页指针，用于导航</text>

  <!-- 根到叶的指针（结构连线，无箭头） -->
  <line x1="470" y1="112" x2="145" y2="204" stroke="#90caf9" stroke-width="1.4"/>
  <line x1="470" y1="112" x2="365" y2="204" stroke="#90caf9" stroke-width="1.4"/>
  <line x1="470" y1="112" x2="585" y2="204" stroke="#90caf9" stroke-width="1.4"/>
  <line x1="470" y1="112" x2="805" y2="204" stroke="#90caf9" stroke-width="1.4"/>

  <!-- 叶子节点 -->
  <rect x="60" y="208" width="170" height="64" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="145" y="234" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="bold">[1 - 9]</text>
  <text x="145" y="256" text-anchor="middle" fill="#555555" font-size="10">完整行数据</text>

  <rect x="280" y="208" width="170" height="64" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="365" y="234" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="bold">[11 - 19]</text>
  <text x="365" y="256" text-anchor="middle" fill="#555555" font-size="10">完整行数据</text>

  <rect x="500" y="208" width="170" height="64" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="585" y="234" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="bold">[21 - 29]</text>
  <text x="585" y="256" text-anchor="middle" fill="#555555" font-size="10">完整行数据</text>

  <rect x="720" y="208" width="170" height="64" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="805" y="234" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="bold">[31 - 40]</text>
  <text x="805" y="256" text-anchor="middle" fill="#555555" font-size="10">完整行数据</text>

  <!-- 叶子间双向链表 -->
  <line x1="244" y1="240" x2="266" y2="240" stroke="#1565c0" stroke-width="1.8" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <line x1="454" y1="240" x2="496" y2="240" stroke="#90caf9" stroke-width="1.4"/>
  <line x1="674" y1="240" x2="716" y2="240" stroke="#90caf9" stroke-width="1.4"/>

  <text x="470" y="312" text-anchor="middle" fill="#555555" font-size="11">叶子节点按主键有序，且相邻叶子用双向链表串起——范围扫描顺着链表读，不必回到上层</text>
</svg>
