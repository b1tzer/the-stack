<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrOrange" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c62828"/>
    </marker>
  </defs>

  <text x="470" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">分区 LRU：1 秒门槛把只访问一次的页挡在热数据之外</text>

  <!-- ① 磁盘读入 → 插入 old 区头部 -->
  <rect x="744" y="44" width="140" height="34" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="1.4"/>
  <text x="814" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">磁盘读入</text>
  <line x1="740" y1="61" x2="584" y2="61" stroke="#e65100" stroke-width="1.8" marker-end="url(#arrOrange)"/>
  <text x="660" y="90" text-anchor="middle" fill="#bf360c" font-size="10" font-weight="bold">① 新页插入 old 区头部</text>

  <!-- ② 晋升：停留超 1 秒再访问 → young 头部 -->
  <text x="310" y="78" text-anchor="middle" fill="#0d47a1" font-size="10" font-weight="bold">② 停留超 1 秒后再次访问 → 晋升 young 区头部</text>
  <line x1="572" y1="90" x2="82" y2="90" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrBlue)"/>

  <!-- 分区链表 -->
  <rect x="60" y="100" width="512" height="140" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="76" y="126" font-size="12" font-weight="bold" fill="#0d47a1">young 区（约 5/8）</text>
  <text x="270" y="126" fill="#1565c0" font-size="10">热数据 · 长期保护</text>

  <rect x="572" y="100" width="308" height="140" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.4"/>
  <text x="588" y="126" font-size="12" font-weight="bold" fill="#bf360c">old 区（约 3/8）</text>
  <text x="712" y="126" fill="#e65100" font-size="10">新页 · 冷数据</text>

  <rect x="80" y="160" width="96" height="44" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="128" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">热页</text>
  <rect x="192" y="160" width="96" height="44" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="240" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">热页</text>
  <rect x="304" y="160" width="96" height="44" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="352" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">热页</text>
  <rect x="416" y="160" width="96" height="44" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="464" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">热页</text>

  <rect x="590" y="160" width="76" height="44" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="628" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">新页</text>
  <rect x="678" y="160" width="76" height="44" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="716" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">新页</text>
  <rect x="766" y="160" width="76" height="44" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="804" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">新页</text>

  <!-- 尾部淘汰 -->
  <text x="886" y="152" fill="#c62828" font-size="10" font-weight="bold">尾部淘汰</text>
  <line x1="880" y1="170" x2="914" y2="170" stroke="#c62828" stroke-width="1.8" marker-end="url(#arrRed)"/>

  <!-- 头尾方向 -->
  <text x="60" y="258" fill="#757575" font-size="10">◀ 链表头（最近访问）在 young 侧</text>
  <text x="880" y="258" text-anchor="end" fill="#757575" font-size="10">链表尾（淘汰点）在 old 侧 ▶</text>

  <!-- 门槛 -->
  <rect x="60" y="274" width="820" height="34" rx="8" fill="#374151"/>
  <text x="470" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">门槛：innodb_old_blocks_time = 1000ms（默认）</text>

  <!-- 热页的命运 -->
  <rect x="60" y="326" width="400" height="150" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="76" y="352" font-size="12" font-weight="bold" fill="#1b5e20">热页的命运</text>
  <text x="76" y="378" fill="#555555" font-size="10">1　磁盘读入 → 落到 old 区头部</text>
  <text x="76" y="402" fill="#555555" font-size="10">2　停留超过 1 秒后再次被访问</text>
  <text x="76" y="426" fill="#555555" font-size="10">3　晋升 young 头部，被长期保护</text>

  <!-- 全表扫描页的命运 -->
  <rect x="480" y="326" width="400" height="150" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.4"/>
  <text x="496" y="352" font-size="12" font-weight="bold" fill="#b71c1c">全表扫描页的命运</text>
  <text x="496" y="378" fill="#555555" font-size="10">1　磁盘读入 → 落到 old 区头部</text>
  <text x="496" y="402" fill="#555555" font-size="10">2　只被访问一次，1 秒内被推到尾部</text>
  <text x="496" y="426" fill="#555555" font-size="10">3　在 old 区淘汰，永远进不了 young</text>

  <!-- 底部总结 -->
  <rect x="60" y="496" width="820" height="40" rx="8" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.2"/>
  <text x="470" y="521" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">old 区 + 1 秒门槛：把「只访问一次」和「反复访问」的页隔开，热数据分毫不动</text>
</svg>
