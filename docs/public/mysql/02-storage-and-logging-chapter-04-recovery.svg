<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#757575"/>
    </marker>
  </defs>

  <text x="470" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">崩溃恢复：从 Checkpoint 开始重放</text>

  <!-- ① -->
  <rect x="40" y="100" width="190" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="135" y="134" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="bold">① 定位 Checkpoint LSN</text>
  <text x="135" y="156" text-anchor="middle" fill="#555555" font-size="10">找最近一次检查点</text>

  <line x1="234" y1="140" x2="256" y2="140" stroke="#757575" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <!-- ② -->
  <rect x="270" y="100" width="200" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="370" y="134" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="bold">② 向后扫描 Redo Log</text>
  <text x="370" y="156" text-anchor="middle" fill="#555555" font-size="10">从该 LSN 逐条读日志</text>

  <line x1="474" y1="140" x2="496" y2="140" stroke="#757575" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <!-- ③ -->
  <rect x="510" y="100" width="270" height="80" rx="6" fill="#fff8e1" stroke="#e65100" stroke-width="1.4"/>
  <text x="645" y="124" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="bold">③ 比较 FIL_PAGE_LSN 与日志 LSN</text>
  <rect x="526" y="140" width="112" height="28" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="582" y="158" text-anchor="middle" fill="#1b5e20" font-size="11" font-weight="bold">页更旧 → 重放</text>
  <rect x="652" y="140" width="112" height="28" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1"/>
  <text x="708" y="158" text-anchor="middle" fill="#555555" font-size="11" font-weight="bold">页已新 → 跳过</text>

  <line x1="784" y1="140" x2="796" y2="140" stroke="#757575" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <!-- ④ -->
  <rect x="810" y="100" width="110" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="865" y="134" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="bold">④ Undo</text>
  <text x="865" y="156" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="bold">回滚未提交</text>

  <!-- 底部：幂等 -->
  <rect x="40" y="230" width="860" height="44" rx="8" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.2"/>
  <text x="470" y="257" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">幂等：页上的 LSN 比日志新或相等就跳过——重复重放同一段日志也不会出错</text>
</svg>
