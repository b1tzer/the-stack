<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#757575"/>
    </marker>
  </defs>

  <text x="470" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">固定顺序都会失败：断电发生在两份日志之间</text>

  <!-- 方案一 -->
  <text x="40" y="70" fill="#c62828" font-size="12" font-weight="bold">方案一：先写 Redo，再写 Binlog</text>

  <rect x="40" y="90" width="200" height="52" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="140" y="121" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="bold">1. 写 Redo Log（提交）</text>

  <line x1="244" y1="116" x2="286" y2="116" stroke="#757575" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <rect x="300" y="90" width="200" height="52" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.4"/>
  <text x="400" y="121" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="bold">2. 写 Binlog</text>

  <line x1="266" y1="82" x2="266" y2="154" stroke="#c62828" stroke-width="1.8" stroke-dasharray="6,5"/>
  <text x="266" y="74" text-anchor="middle" fill="#c62828" font-size="11" font-weight="bold">断电</text>

  <rect x="40" y="174" width="460" height="52" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.4"/>
  <text x="56" y="196" fill="#b71c1c" font-size="11" font-weight="bold">主库有这笔（Redo 恢复生效），Binlog 里没有</text>
  <text x="56" y="214" fill="#555555" font-size="10">从库少一笔 → 主从不一致</text>

  <!-- 方案二 -->
  <text x="40" y="266" fill="#c62828" font-size="12" font-weight="bold">方案二：先写 Binlog，再写 Redo</text>

  <rect x="40" y="286" width="200" height="52" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.4"/>
  <text x="140" y="317" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="bold">1. 写 Binlog</text>

  <line x1="244" y1="312" x2="286" y2="312" stroke="#757575" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <rect x="300" y="286" width="200" height="52" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="400" y="317" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="bold">2. 写 Redo Log（提交）</text>

  <line x1="266" y1="278" x2="266" y2="350" stroke="#c62828" stroke-width="1.8" stroke-dasharray="6,5"/>
  <text x="266" y="270" text-anchor="middle" fill="#c62828" font-size="11" font-weight="bold">断电</text>

  <rect x="40" y="370" width="460" height="52" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.4"/>
  <text x="56" y="392" fill="#b71c1c" font-size="11" font-weight="bold">主库回滚了（Redo 没写完），Binlog 里有</text>
  <text x="56" y="410" fill="#555555" font-size="10">从库多一笔 → 主从不一致</text>

  <!-- 右侧总结 -->
  <rect x="560" y="180" width="340" height="140" rx="8" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.4"/>
  <text x="730" y="216" text-anchor="middle" fill="#424242" font-size="12" font-weight="bold">无论先写哪份，</text>
  <text x="730" y="240" text-anchor="middle" fill="#424242" font-size="12" font-weight="bold">断电都会打破主从一致</text>
  <text x="730" y="274" text-anchor="middle" fill="#555555" font-size="11">两份日志是两次独立磁盘写，</text>
  <text x="730" y="294" text-anchor="middle" fill="#555555" font-size="11">无法保证原子性 → 需要两阶段提交</text>
</svg>
