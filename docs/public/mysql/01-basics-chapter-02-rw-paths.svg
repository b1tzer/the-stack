<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12">
  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="470" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">读路径与写路径</text>

  <!-- 读路径 -->
  <text x="80" y="54" font-size="14" font-weight="bold" fill="#0d47a1">读路径</text>

  <rect x="80" y="66" width="200" height="60" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="1.4"/>
  <text x="180" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#424242">磁盘</text>
  <text x="180" y="148" text-anchor="middle" font-size="11" fill="#555555">数据页 / 索引页</text>

  <rect x="370" y="66" width="200" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="470" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">Buffer Pool</text>
  <text x="470" y="148" text-anchor="middle" font-size="11" fill="#555555">内存缓存，命中直接返回</text>

  <rect x="660" y="66" width="200" height="60" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="1.4"/>
  <text x="760" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#424242">返回客户端</text>
  <text x="760" y="148" text-anchor="middle" font-size="11" fill="#555555">结果集</text>

  <line x1="284" y1="96" x2="364" y2="96" stroke="#1565c0" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <line x1="574" y1="96" x2="654" y2="96" stroke="#1565c0" stroke-width="1.6" marker-end="url(#arrBlue)"/>

  <!-- 写路径 -->
  <text x="47" y="216" font-size="14" font-weight="bold" fill="#bf360c">写路径</text>

  <rect x="47" y="228" width="150" height="60" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="1.4"/>
  <text x="122" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#424242">客户端</text>
  <text x="122" y="310" text-anchor="middle" font-size="11" fill="#555555">发起写入</text>

  <rect x="221" y="228" width="150" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="296" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">Buffer Pool</text>
  <text x="296" y="310" text-anchor="middle" font-size="11" fill="#555555">修改内存页，产生脏页</text>

  <rect x="395" y="228" width="150" height="60" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.4"/>
  <text x="470" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">Redo Log</text>
  <text x="470" y="310" text-anchor="middle" font-size="11" fill="#555555">顺序写，先保证持久</text>

  <rect x="569" y="228" width="150" height="60" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.4"/>
  <text x="644" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">Checkpoint</text>
  <text x="644" y="310" text-anchor="middle" font-size="11" fill="#555555">标记已落盘位置</text>

  <rect x="743" y="228" width="150" height="60" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.4"/>
  <text x="818" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">刷脏页</text>
  <text x="818" y="310" text-anchor="middle" font-size="11" fill="#555555">随机写回磁盘</text>

  <line x1="199" y1="258" x2="215" y2="258" stroke="#e65100" stroke-width="1.6" marker-end="url(#arrOrange)"/>
  <line x1="373" y1="258" x2="389" y2="258" stroke="#e65100" stroke-width="1.6" marker-end="url(#arrOrange)"/>
  <line x1="547" y1="258" x2="563" y2="258" stroke="#e65100" stroke-width="1.6" marker-end="url(#arrOrange)"/>
  <line x1="721" y1="258" x2="737" y2="258" stroke="#e65100" stroke-width="1.6" marker-end="url(#arrOrange)"/>

  <!-- 底部要点 -->
  <text x="470" y="344" text-anchor="middle" font-size="11" fill="#555555">写路径的关键：先顺序写 Redo Log 保证持久，脏页再经 Checkpoint 异步刷盘</text>
</svg>
