<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrOrange" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="470" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">页分裂：Free Space 满了之后</text>

  <!-- 分裂前 -->
  <text x="40" y="58" font-size="12" font-weight="bold" fill="#0d47a1">分裂前</text>

  <rect x="40" y="70" width="360" height="60" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="1.4"/>
  <text x="56" y="94" fill="#424242" font-size="11" font-weight="bold">父节点</text>
  <rect x="56" y="100" width="100" height="24" rx="4" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1"/>
  <text x="106" y="116" text-anchor="middle" fill="#424242" font-size="10">指针 → 原页</text>

  <rect x="40" y="156" width="360" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="56" y="182" fill="#0d47a1" font-size="12" font-weight="bold">原页 [1, 3, 5, 7, 9]</text>
  <rect x="56" y="196" width="328" height="30" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="1"/>
  <text x="220" y="216" text-anchor="middle" fill="#c62828" font-size="11" font-weight="bold">Free Space 已满，装不下 id=6</text>
  <text x="56" y="252" fill="#555555" font-size="10">插入 id=6 触发页分裂</text>

  <!-- 中间过程 -->
  <line x1="418" y1="216" x2="490" y2="216" stroke="#e65100" stroke-width="2.4" marker-end="url(#arrOrange)"/>
  <text x="460" y="152" text-anchor="middle" fill="#bf360c" font-size="11" font-weight="bold">① 申请新页</text>
  <text x="460" y="172" text-anchor="middle" fill="#bf360c" font-size="11" font-weight="bold">② 移约一半记录</text>
  <text x="460" y="192" text-anchor="middle" fill="#bf360c" font-size="11" font-weight="bold">③ 父节点登记指针</text>

  <!-- 分裂后 -->
  <text x="540" y="58" font-size="12" font-weight="bold" fill="#bf360c">分裂后</text>

  <rect x="540" y="70" width="360" height="60" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="1.4"/>
  <text x="556" y="94" fill="#424242" font-size="11" font-weight="bold">父节点</text>
  <rect x="556" y="100" width="100" height="24" rx="4" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1"/>
  <text x="606" y="116" text-anchor="middle" fill="#424242" font-size="10">指针 → 原页</text>
  <rect x="666" y="100" width="100" height="24" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="716" y="116" text-anchor="middle" fill="#bf360c" font-size="10">指针 → 新页</text>

  <rect x="540" y="156" width="170" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="625" y="188" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="bold">原页 [1, 3, 5]</text>
  <text x="625" y="214" text-anchor="middle" fill="#555555" font-size="10">分裂后约半满</text>
  <text x="625" y="234" text-anchor="middle" fill="#555555" font-size="10">id=6 插入此页</text>

  <rect x="730" y="156" width="170" height="120" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.4"/>
  <text x="815" y="188" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="bold">新页 [6, 7, 9]</text>
  <text x="815" y="214" text-anchor="middle" fill="#555555" font-size="10">约一半记录迁入</text>
  <text x="815" y="234" text-anchor="middle" fill="#555555" font-size="10">位置与原页不相邻</text>

  <!-- 三项代价 -->
  <text x="40" y="318" font-size="12" font-weight="bold" fill="#333333">分裂的三处代价</text>

  <rect x="40" y="330" width="280" height="76" rx="6" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.2"/>
  <text x="180" y="358" text-anchor="middle" fill="#c62828" font-size="12" font-weight="bold">随机 IO</text>
  <text x="180" y="382" text-anchor="middle" fill="#555555" font-size="10">新页在表空间里的位置与旧页不相邻，</text>
  <text x="180" y="398" text-anchor="middle" fill="#555555" font-size="10">磁头要跳到新位置</text>

  <rect x="330" y="330" width="280" height="76" rx="6" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.2"/>
  <text x="470" y="358" text-anchor="middle" fill="#c62828" font-size="12" font-weight="bold">空间利用率下降</text>
  <text x="470" y="382" text-anchor="middle" fill="#555555" font-size="10">分裂后两个页各只满一半，</text>
  <text x="470" y="398" text-anchor="middle" fill="#555555" font-size="10">约 50% 空间被浪费</text>

  <rect x="620" y="330" width="280" height="76" rx="6" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.2"/>
  <text x="760" y="358" text-anchor="middle" fill="#c62828" font-size="12" font-weight="bold">树增高</text>
  <text x="760" y="382" text-anchor="middle" fill="#555555" font-size="10">父节点也满则分裂向上传导，</text>
  <text x="760" y="398" text-anchor="middle" fill="#555555" font-size="10">最坏让 B+ 树多一层</text>

  <!-- 底部提示 -->
  <text x="470" y="448" text-anchor="middle" fill="#757575" font-size="11">顺序主键（AUTO_INCREMENT）只在末页追加，几乎不分裂；随机主键（UUID）频繁触发分裂</text>
</svg>
