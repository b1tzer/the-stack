<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="470" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">表空间碎片：空闲页散布与行空洞</text>

  <!-- 分配不对称横幅 -->
  <rect x="40" y="44" width="860" height="36" rx="8" fill="#fff8e1" stroke="#e65100" stroke-width="1.2"/>
  <text x="470" y="67" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">申请空间按「区」（1MB），释放空间只到「页」（16KB），且从不把空间还给文件系统</text>

  <!-- ① 区级碎片 -->
  <rect x="40" y="100" width="860" height="176" rx="8" fill="#fff8e1" stroke="#e65100" stroke-width="1.4"/>
  <text x="56" y="126" fill="#bf360c" font-weight="bold" font-size="12">① 区级碎片：空闲页散布在已用页之间</text>
  <text x="56" y="144" fill="#8d6e63" font-size="10">删完整页后页被标记为可复用，但不归还文件，空闲页与已用页交错</text>

  <!-- 页网格 第1行 -->
  <rect x="56" y="160" width="92" height="44" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="102" y="186" text-anchor="middle" fill="#1b5e20" font-size="9">已用页</text>
  <rect x="162" y="160" width="92" height="44" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="208" y="186" text-anchor="middle" fill="#1b5e20" font-size="9">已用页</text>
  <rect x="268" y="160" width="92" height="44" rx="3" fill="#ffffff" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="314" y="186" text-anchor="middle" fill="#757575" font-size="9">空闲页</text>
  <rect x="374" y="160" width="92" height="44" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="420" y="186" text-anchor="middle" fill="#1b5e20" font-size="9">已用页</text>
  <rect x="480" y="160" width="92" height="44" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="526" y="186" text-anchor="middle" fill="#1b5e20" font-size="9">已用页</text>
  <rect x="586" y="160" width="92" height="44" rx="3" fill="#ffffff" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="632" y="186" text-anchor="middle" fill="#757575" font-size="9">空闲页</text>
  <rect x="692" y="160" width="92" height="44" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="738" y="186" text-anchor="middle" fill="#1b5e20" font-size="9">已用页</text>
  <rect x="798" y="160" width="92" height="44" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="844" y="186" text-anchor="middle" fill="#1b5e20" font-size="9">已用页</text>

  <!-- 页网格 第2行 -->
  <rect x="56" y="212" width="92" height="44" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="102" y="238" text-anchor="middle" fill="#1b5e20" font-size="9">已用页</text>
  <rect x="162" y="212" width="92" height="44" rx="3" fill="#ffffff" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="208" y="238" text-anchor="middle" fill="#757575" font-size="9">空闲页</text>
  <rect x="268" y="212" width="92" height="44" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="314" y="238" text-anchor="middle" fill="#1b5e20" font-size="9">已用页</text>
  <rect x="374" y="212" width="92" height="44" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="420" y="238" text-anchor="middle" fill="#1b5e20" font-size="9">已用页</text>
  <rect x="480" y="212" width="92" height="44" rx="3" fill="#ffffff" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="526" y="238" text-anchor="middle" fill="#757575" font-size="9">空闲页</text>
  <rect x="586" y="212" width="92" height="44" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="632" y="238" text-anchor="middle" fill="#1b5e20" font-size="9">已用页</text>
  <rect x="692" y="212" width="92" height="44" rx="3" fill="#ffffff" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="738" y="238" text-anchor="middle" fill="#757575" font-size="9">空闲页</text>
  <rect x="798" y="212" width="92" height="44" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="844" y="238" text-anchor="middle" fill="#1b5e20" font-size="9">已用页</text>

  <text x="56" y="268" fill="#a1887f" font-size="9">示意 16 页，实际一个区 64 页；空闲页散布即「区级碎片」</text>

  <!-- ② 页级碎片 -->
  <rect x="40" y="296" width="860" height="230" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="56" y="322" fill="#1b5e20" font-weight="bold" font-size="12">② 页级碎片：删除行后页内留下空洞</text>

  <rect x="56" y="340" width="520" height="164" rx="4" fill="#f1f8e9" stroke="#1565c0" stroke-width="1.2"/>
  <text x="68" y="358" fill="#0d47a1" font-weight="bold" font-size="9">Page（16KB）</text>

  <rect x="68" y="366" width="496" height="18" rx="2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.7"/>
  <text x="76" y="379" fill="#1b5e20" font-size="8">记录 A（有效数据）</text>
  <rect x="68" y="388" width="496" height="18" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.7" stroke-dasharray="3,2"/>
  <text x="76" y="401" fill="#9e9e9e" font-size="8">空洞（已删除，可复用）</text>
  <rect x="68" y="410" width="496" height="18" rx="2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.7"/>
  <text x="76" y="423" fill="#1b5e20" font-size="8">记录 B（有效数据）</text>
  <rect x="68" y="432" width="496" height="18" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.7" stroke-dasharray="3,2"/>
  <text x="76" y="445" fill="#9e9e9e" font-size="8">空洞（已删除，可复用）</text>
  <rect x="68" y="454" width="496" height="18" rx="2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.7"/>
  <text x="76" y="467" fill="#1b5e20" font-size="8">记录 C（有效数据）</text>
  <rect x="68" y="476" width="496" height="18" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.7" stroke-dasharray="3,2"/>
  <text x="76" y="489" fill="#9e9e9e" font-size="8">空洞（已删除，可复用）</text>

  <!-- data_free 构成 -->
  <text x="610" y="366" fill="#1b5e20" font-weight="bold" font-size="10">data_free 统计的正是这些</text>
  <text x="610" y="390" fill="#555555" font-size="10">· 页内的行空洞</text>
  <text x="610" y="412" fill="#555555" font-size="10">· 标记可复用的空闲页</text>
  <text x="610" y="434" fill="#555555" font-size="10">· 页分裂后半满浪费的空间</text>
  <text x="610" y="464" fill="#888888" font-size="9">它们都躺在已分配空间里，</text>
  <text x="610" y="480" fill="#888888" font-size="9">所以 .ibd 文件不会缩小</text>

  <!-- 图例 -->
  <rect x="260" y="542" width="16" height="16" rx="2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="284" y="555" fill="#555555" font-size="10">已使用</text>
  <rect x="440" y="542" width="16" height="16" rx="2" fill="#ffffff" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="464" y="555" fill="#555555" font-size="10">空闲 / 空洞（已分配未回收）</text>

  <!-- 总结 -->
  <text x="470" y="584" text-anchor="middle" fill="#757575" font-size="11">碎片 = 已分配空间中的空闲块散布在占用块之间，文件大小不变</text>
</svg>
