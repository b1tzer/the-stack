<svg width="660" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#57606a"/></marker>
    <marker id="arr-loop" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#7b1fa2"/></marker>
  </defs>

  <!-- 标题 -->
  <text x="330" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#24292f">新建 Worker —— 生命周期流程</text>

  <!-- 1 新建 Worker -->
  <rect x="295" y="42" rx="7" width="170" height="38" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="380" y="66" text-anchor="middle" font-size="13" fill="#0d47a1">新建 Worker</text>
  <line x1="380" y1="80" x2="380" y2="100" stroke="#57606a" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- 2 执行 firstTask -->
  <rect x="275" y="100" rx="7" width="210" height="42" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="380" y="118" text-anchor="middle" font-size="13" fill="#1b5e20">执行 firstTask</text>
  <text x="380" y="134" text-anchor="middle" font-size="11" fill="#57606a">构造时传入，只执行一次</text>
  <line x1="380" y1="142" x2="380" y2="162" stroke="#57606a" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- 3 从 workQueue 取任务 -->
  <rect x="260" y="162" rx="7" width="240" height="38" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="380" y="186" text-anchor="middle" font-size="13" fill="#bf360c">从 workQueue 取任务</text>
  <line x1="380" y1="200" x2="380" y2="224" stroke="#57606a" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- 菱形1 取到任务？ -->
  <polygon points="380,224 495,268 380,312 265,268" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="380" y="272" text-anchor="middle" font-size="13" fill="#24292f">取到任务？</text>

  <!-- 是 → 执行任务 -->
  <line x1="265" y1="268" x2="170" y2="268" stroke="#57606a" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="217" y="261" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">是</text>
  <rect x="20" y="249" rx="6" width="150" height="38" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="95" y="273" text-anchor="middle" font-size="13" fill="#1b5e20">执行任务</text>

  <!-- 执行任务循环回取任务 -->
  <path d="M95,249 L95,181 L260,181" fill="none" stroke="#7b1fa2" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#arr-loop)"/>
  <text x="150" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b1fa2">循环</text>

  <!-- 否 → 菱形2 -->
  <line x1="380" y1="312" x2="380" y2="338" stroke="#57606a" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="392" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">否</text>

  <!-- 菱形2 是否核心线程？ -->
  <polygon points="380,338 485,382 380,426 275,382" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="380" y="386" text-anchor="middle" font-size="13" fill="#24292f">是否核心线程？</text>

  <!-- 是 → 继续 poll -->
  <line x1="275" y1="382" x2="245" y2="382" stroke="#57606a" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="260" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">是</text>
  <rect x="115" y="361" rx="6" width="130" height="42" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="180" y="378" text-anchor="middle" font-size="13" fill="#1b5e20">继续 poll</text>
  <text x="180" y="394" text-anchor="middle" font-size="11" fill="#57606a">阻塞等待，不超时</text>

  <!-- 继续 poll 循环回取任务 -->
  <path d="M180,361 L180,176 L260,176" fill="none" stroke="#7b1fa2" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#arr-loop)"/>

  <!-- 否 → poll 超时退出 -->
  <line x1="485" y1="382" x2="520" y2="382" stroke="#57606a" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="502" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">否</text>
  <rect x="520" y="361" rx="6" width="130" height="42" fill="#ffebee" stroke="#c62828" stroke-width="1.3"/>
  <text x="585" y="378" text-anchor="middle" font-size="13" fill="#b71c1c">poll(keepAliveTime)</text>
  <text x="585" y="394" text-anchor="middle" font-size="11" fill="#57606a">超时后线程退出</text>

  <!-- 注释 -->
  <text x="330" y="455" text-anchor="middle" font-size="12" font-style="italic" fill="#1565c0">allowCoreThreadTimeOut(true) 会让核心线程也走带超时的 poll</text>
</svg>
