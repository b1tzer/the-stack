<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" width="660" height="350">
  <defs>
    <style>
      text { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
    </style>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowB" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1565c0"/></marker>
  </defs>

  <text x="330" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">游戏帧循环：一帧做三件事</text>

  <!-- 读取输入 -->
  <rect x="40" y="80" width="160" height="84" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="120" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">① 读取输入</text>
  <text x="120" y="124" text-anchor="middle" font-size="11" fill="#1565c0">键盘 / 鼠标 / 手柄</text>
  <text x="120" y="142" text-anchor="middle" font-size="11" fill="#1565c0">Input.GetAxis 等</text>

  <line x1="200" y1="122" x2="238" y2="122" stroke="#1565c0" stroke-width="1.3" marker-end="url(#arrowB)"/>

  <!-- 更新状态 -->
  <rect x="250" y="80" width="160" height="84" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="330" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">② 更新状态</text>
  <text x="330" y="124" text-anchor="middle" font-size="11" fill="#2e7d32">移动 · 碰撞 · 逻辑</text>
  <text x="330" y="142" text-anchor="middle" font-size="11" fill="#2e7d32">Update / FixedUpdate</text>

  <line x1="410" y1="122" x2="448" y2="122" stroke="#1565c0" stroke-width="1.3" marker-end="url(#arrowB)"/>

  <!-- 渲染画面 -->
  <rect x="460" y="80" width="160" height="84" rx="7" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="540" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a148c">③ 渲染画面</text>
  <text x="540" y="124" text-anchor="middle" font-size="11" fill="#7b1fa2">把状态画到屏幕</text>
  <text x="540" y="142" text-anchor="middle" font-size="11" fill="#7b1fa2">（GPU）</text>

  <!-- 回环箭头：渲染画面底部回到读取输入底部 -->
  <path d="M540,164 L540,220 Q540,228 532,228 L128,228 Q120,228 120,220 L120,164" fill="none" stroke="#1565c0" stroke-width="1.3" marker-end="url(#arrowB)"/>
  <text x="330" y="248" text-anchor="middle" font-size="11" fill="#1565c0">循环，直到退出</text>

  <!-- 关键提示 -->
  <rect x="40" y="272" width="580" height="62" rx="7" fill="#fff8e1" stroke="#e65100" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="330" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">一帧 = 读取输入 → 更新状态 → 渲染画面 跑完一遍</text>
  <text x="330" y="314" text-anchor="middle" font-size="11" fill="#bf360c">60 FPS 意味着每秒循环 60 次，每帧约 16.7 毫秒；任何一帧超时都会表现为掉帧</text>
</svg>
