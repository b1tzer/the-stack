<svg xmlns="http://www.w3.org/2000/svg" width="620" height="398" viewBox="0 0 620 398" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC382D"/>
    </marker>
  </defs>
  <rect width="620" height="398" fill="#ffffff"/>

  <!-- 上半区：逐条发送 -->
  <rect x="20" y="20" width="580" height="190" rx="10" fill="#f6f8fa" stroke="#9aa4af" stroke-dasharray="5 4"/>
  <text x="32" y="44" font-size="13" font-weight="700" fill="#57606a">逐条发送（多次 RTT）</text>

  <rect x="50" y="56" width="120" height="36" rx="18" fill="#fff1f0" stroke="#DC382D"/>
  <text x="110" y="79" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">客户端</text>

  <rect x="450" y="56" width="120" height="36" rx="18" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="510" y="79" text-anchor="middle" font-size="13" fill="#24292f">Redis</text>

  <line x1="110" y1="92" x2="110" y2="198" stroke="#c0c8d0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="510" y1="92" x2="510" y2="198" stroke="#c0c8d0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <line x1="110" y1="106" x2="504" y2="106" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="99" text-anchor="middle" font-size="11" fill="#57606a">命令 1</text>

  <line x1="510" y1="118" x2="116" y2="118" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="132" text-anchor="middle" font-size="11" fill="#57606a">结果 1</text>

  <text x="310" y="148" text-anchor="middle" font-size="13" fill="#57606a">…</text>

  <line x1="110" y1="166" x2="504" y2="166" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="159" text-anchor="middle" font-size="11" fill="#57606a">命令 N</text>

  <line x1="510" y1="178" x2="116" y2="178" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="192" text-anchor="middle" font-size="11" fill="#57606a">结果 N</text>

  <!-- 下半区：管道发送 -->
  <rect x="20" y="228" width="580" height="150" rx="10" fill="#f6f8fa" stroke="#9aa4af" stroke-dasharray="5 4"/>
  <text x="32" y="252" font-size="13" font-weight="700" fill="#57606a">管道发送（1 次 RTT）</text>

  <rect x="50" y="264" width="120" height="36" rx="18" fill="#fff1f0" stroke="#DC382D"/>
  <text x="110" y="287" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">客户端</text>

  <rect x="450" y="264" width="120" height="36" rx="18" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="510" y="287" text-anchor="middle" font-size="13" fill="#24292f">Redis</text>

  <line x1="110" y1="300" x2="110" y2="360" stroke="#c0c8d0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="510" y1="300" x2="510" y2="360" stroke="#c0c8d0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <line x1="110" y1="314" x2="504" y2="314" stroke="#DC382D" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="310" y="306" text-anchor="middle" font-size="11" fill="#DC382D">一次发送 N 条命令</text>

  <line x1="510" y1="330" x2="116" y2="330" stroke="#DC382D" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="310" y="348" text-anchor="middle" font-size="11" fill="#DC382D">一次返回 N 个结果</text>
</svg>
