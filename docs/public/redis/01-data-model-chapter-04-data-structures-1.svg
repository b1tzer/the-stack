<svg xmlns="http://www.w3.org/2000/svg" width="920" height="180" viewBox="0 0 920 180" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="920" height="180" fill="#ffffff"/>

  <rect x="10" y="28" width="505" height="108" rx="10" fill="#f6f8fa" stroke="#9aa4af" stroke-dasharray="5 4"/>
  <text x="20" y="50" font-size="13" font-weight="700" fill="#57606a">rehash 过程</text>

  <rect x="30" y="78" width="170" height="40" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="115" y="98" text-anchor="middle" font-size="13" fill="#24292f">ht[0]（旧表，含数据）</text>

  <rect x="300" y="78" width="180" height="40" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="390" y="98" text-anchor="middle" font-size="13" fill="#24292f">ht[1]（新表，容量翻倍）</text>

  <rect x="700" y="78" width="180" height="40" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="790" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">rehash 完成</text>

  <line x1="200" y1="98" x2="290" y2="98" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="246" y="88" text-anchor="middle" font-size="11" fill="#57606a">每次操作迁移一部分</text>

  <line x1="480" y1="98" x2="690" y2="98" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="586" y="88" text-anchor="middle" font-size="11" fill="#57606a">迁移完成，ht[1] 成为新 ht[0]</text>
</svg>
