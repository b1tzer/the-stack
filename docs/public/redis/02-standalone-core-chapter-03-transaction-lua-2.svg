<svg xmlns="http://www.w3.org/2000/svg" width="680" height="170" viewBox="0 0 680 170" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#57606a"/></marker>
  </defs>
  <rect width="680" height="170" fill="#ffffff"/>

  <rect x="20" y="63" width="120" height="44" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="80" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">WATCH key</text>

  <rect x="185" y="63" width="90" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="230" y="85" text-anchor="middle" font-size="13" fill="#24292f">MULTI</text>

  <rect x="320" y="63" width="90" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="365" y="85" text-anchor="middle" font-size="13" fill="#24292f">EXEC</text>

  <rect x="480" y="18" width="130" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="545" y="40" text-anchor="middle" font-size="13" fill="#24292f">执行成功</text>

  <rect x="480" y="108" width="180" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="570" y="130" text-anchor="middle" font-size="13" fill="#24292f">返回 nil，放弃执行</text>

  <line x1="140" y1="85" x2="175" y2="85" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="275" y1="85" x2="310" y2="85" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="410" y1="85" x2="469.91" y2="46.49" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="48" font-size="11" fill="#57606a">key 未被改</text>

  <line x1="410" y1="85" x2="469.91" y2="123.51" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="122" font-size="11" fill="#57606a">key 被改</text>
</svg>
