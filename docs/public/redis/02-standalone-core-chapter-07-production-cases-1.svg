<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="920" height="540" fill="#ffffff"/>

  <!-- 列标题 -->
  <text x="210" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#24292f">单机核心知识点（前六章）</text>
  <text x="710" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#24292f">对应的生产问题</text>

  <!-- 左列：知识点 -->
  <rect x="40" y="64" width="340" height="48" rx="8" fill="#f6f8fa" stroke="#9aa4af"/>
  <text x="210" y="86" text-anchor="middle" font-size="13" fill="#24292f">单线程模型，命令串行执行</text>
  <text x="210" y="103" text-anchor="middle" font-size="11" fill="#57606a">chapter-01 §1</text>

  <rect x="40" y="136" width="340" height="48" rx="8" fill="#f6f8fa" stroke="#9aa4af"/>
  <text x="210" y="158" text-anchor="middle" font-size="13" fill="#24292f">慢查询日志与命令统计</text>
  <text x="210" y="175" text-anchor="middle" font-size="11" fill="#57606a">chapter-02 §5</text>

  <rect x="40" y="208" width="340" height="48" rx="8" fill="#f6f8fa" stroke="#9aa4af"/>
  <text x="210" y="230" text-anchor="middle" font-size="13" fill="#24292f">fork 写时复制 + 透明大页</text>
  <text x="210" y="247" text-anchor="middle" font-size="11" fill="#57606a">chapter-03 §2</text>

  <rect x="40" y="280" width="340" height="48" rx="8" fill="#f6f8fa" stroke="#9aa4af"/>
  <text x="210" y="302" text-anchor="middle" font-size="13" fill="#24292f">AOF 追加写与损坏修复</text>
  <text x="210" y="319" text-anchor="middle" font-size="11" fill="#57606a">chapter-04 §4</text>

  <rect x="40" y="352" width="340" height="48" rx="8" fill="#f6f8fa" stroke="#9aa4af"/>
  <text x="210" y="374" text-anchor="middle" font-size="13" fill="#24292f">惰性删除 + 定期删除</text>
  <text x="210" y="391" text-anchor="middle" font-size="11" fill="#57606a">chapter-05 §3</text>

  <rect x="40" y="424" width="340" height="48" rx="8" fill="#f6f8fa" stroke="#9aa4af"/>
  <text x="210" y="446" text-anchor="middle" font-size="13" fill="#24292f">maxmemory 与淘汰策略</text>
  <text x="210" y="463" text-anchor="middle" font-size="11" fill="#57606a">chapter-06 §2</text>

  <!-- 右列：生产问题 -->
  <rect x="540" y="64" width="340" height="48" rx="8" fill="#fff8e1" stroke="#f0b429"/>
  <text x="710" y="86" text-anchor="middle" font-size="13" fill="#24292f">慢命令阻塞、CPU 100%、雪崩</text>
  <text x="710" y="103" text-anchor="middle" font-size="11" fill="#57606a">案例一</text>

  <rect x="540" y="136" width="340" height="48" rx="8" fill="#fff8e1" stroke="#f0b429"/>
  <text x="710" y="158" text-anchor="middle" font-size="13" fill="#24292f">慢命令排查第一步</text>
  <text x="710" y="175" text-anchor="middle" font-size="11" fill="#57606a">案例二</text>

  <rect x="540" y="208" width="340" height="48" rx="8" fill="#fff8e1" stroke="#f0b429"/>
  <text x="710" y="230" text-anchor="middle" font-size="13" fill="#24292f">BGSAVE 卡顿、内存暴涨</text>
  <text x="710" y="247" text-anchor="middle" font-size="11" fill="#57606a">案例三</text>

  <rect x="540" y="280" width="340" height="48" rx="8" fill="#fff8e1" stroke="#f0b429"/>
  <text x="710" y="302" text-anchor="middle" font-size="13" fill="#24292f">宕机重启失败、数据截断</text>
  <text x="710" y="319" text-anchor="middle" font-size="11" fill="#57606a">案例四</text>

  <rect x="540" y="352" width="340" height="48" rx="8" fill="#fff8e1" stroke="#f0b429"/>
  <text x="710" y="374" text-anchor="middle" font-size="13" fill="#24292f">集中过期 CPU 飙升</text>
  <text x="710" y="391" text-anchor="middle" font-size="11" fill="#57606a">案例五</text>

  <rect x="540" y="424" width="340" height="48" rx="8" fill="#fff8e1" stroke="#f0b429"/>
  <text x="710" y="446" text-anchor="middle" font-size="13" fill="#24292f">淘汰误伤、数据丢失</text>
  <text x="710" y="463" text-anchor="middle" font-size="11" fill="#57606a">案例六</text>

  <!-- 连线 -->
  <g stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="380" y1="88" x2="536" y2="88"/>
    <line x1="380" y1="160" x2="536" y2="160"/>
    <line x1="380" y1="232" x2="536" y2="232"/>
    <line x1="380" y1="304" x2="536" y2="304"/>
    <line x1="380" y1="376" x2="536" y2="376"/>
    <line x1="380" y1="448" x2="536" y2="448"/>
  </g>

  <!-- 图例 -->
  <text x="460" y="512" text-anchor="middle" font-size="12" fill="#57606a">左列是前六章的知识点，右列是它能在生产环境解释的现象——问题不在 Redis，而在机制被误用</text>
</svg>
