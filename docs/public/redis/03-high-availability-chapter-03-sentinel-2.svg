<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#57606a"/></marker>
  </defs>
  <rect width="300" height="400" fill="#ffffff"/>

  <rect x="35" y="20" width="230" height="44" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="150" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">主观下线（单个哨兵判定）</text>

  <rect x="35" y="115" width="230" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="150" y="137" text-anchor="middle" font-size="13" fill="#24292f">客观下线（多数哨兵确认）</text>

  <rect x="35" y="210" width="230" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="150" y="232" text-anchor="middle" font-size="13" fill="#24292f">选举领头哨兵</text>

  <rect x="35" y="305" width="230" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="150" y="327" text-anchor="middle" font-size="13" fill="#24292f">执行故障转移</text>

  <line x1="150" y1="64" x2="150" y2="105" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="159" x2="150" y2="200" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="254" x2="150" y2="295" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
