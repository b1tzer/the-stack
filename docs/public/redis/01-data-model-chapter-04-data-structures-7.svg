<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC382D"/>
    </marker>
  </defs>
  <rect width="920" height="300" fill="#ffffff"/>

  <!-- 上半：ziplist 连锁更新 -->
  <text x="40" y="34" font-size="14" font-weight="700" fill="#DC382D">ziplist：prevlen 记录前一个节点长度</text>

  <rect x="40" y="50" width="150" height="52" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="115" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#DC382D">节点 A</text>
  <text x="115" y="90" text-anchor="middle" font-size="11" fill="#57606a">254 字节</text>

  <rect x="260" y="50" width="180" height="52" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="350" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#DC382D">节点 B</text>
  <text x="350" y="90" text-anchor="middle" font-size="11" fill="#57606a">prevlen 1→5 字节</text>

  <rect x="510" y="50" width="180" height="52" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="600" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#DC382D">节点 C</text>
  <text x="600" y="90" text-anchor="middle" font-size="11" fill="#57606a">prevlen 1→5 字节</text>

  <g stroke="#DC382D" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="190" y1="76" x2="252" y2="76"/>
    <line x1="440" y1="76" x2="502" y2="76"/>
  </g>
  <text x="350" y="126" text-anchor="middle" font-size="12" fill="#DC382D">A 变长 → B 的 prevlen 扩展 → B 变长 → C 的 prevlen 扩展 → 连锁，最坏 O(n²)</text>

  <!-- 分隔虚线 -->
  <line x1="40" y1="150" x2="880" y2="150" stroke="#c0c8d0" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- 下半：listpack -->
  <text x="40" y="184" font-size="14" font-weight="700" fill="#1a7f37">listpack：self-len 只记录自身长度</text>

  <rect x="40" y="200" width="150" height="52" rx="8" fill="#e6f4ea" stroke="#1a7f37"/>
  <text x="115" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#1a7f37">节点 A′</text>
  <text x="115" y="240" text-anchor="middle" font-size="11" fill="#57606a">变长</text>

  <rect x="260" y="200" width="180" height="52" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="350" y="222" text-anchor="middle" font-size="12" fill="#24292f">节点 B′</text>
  <text x="350" y="240" text-anchor="middle" font-size="11" fill="#57606a">不受影响</text>

  <rect x="510" y="200" width="180" height="52" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="600" y="222" text-anchor="middle" font-size="12" fill="#24292f">节点 C′</text>
  <text x="600" y="240" text-anchor="middle" font-size="11" fill="#57606a">不受影响</text>

  <text x="350" y="280" text-anchor="middle" font-size="12" fill="#1a7f37">节点变长只影响自己，不波及其他节点</text>
</svg>
