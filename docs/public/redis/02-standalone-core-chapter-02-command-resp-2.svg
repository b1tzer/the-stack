  <line x1="150" y1="360" x2="150" y2="380" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="434" x2="150" y2="454" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
