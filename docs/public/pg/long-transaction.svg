<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-lt" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="20" y="30" width="180" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="110" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">长事务（运行1小时）</text>
  <text x="110" y="72" text-anchor="middle" font-size="10" fill="#6b7280">事务ID = 100</text>
  <line x1="200" y1="60" x2="270" y2="60" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-lt)"/>
  <text x="235" y="52" font-size="9" fill="#dc2626">阻止清理</text>
  <rect x="270" y="30" width="200" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="370" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Dead Tuple</text>
  <text x="370" y="72" text-anchor="middle" font-size="10" fill="#6b7280">xmax ≥ 100 都不能清理</text>
  <line x1="470" y1="60" x2="540" y2="60" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-lt)"/>
  <rect x="540" y="30" width="140" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="610" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">表膨胀</text>
  <text x="610" y="72" text-anchor="middle" font-size="10" fill="#6b7280">无法清理</text>
</svg>
