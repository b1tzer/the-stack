<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-tl" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#6b7280"/>
    </marker>
  </defs>
  <line x1="40" y1="100" x2="790" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-tl)"/>
  <g text-anchor="middle">
    <circle cx="80" cy="100" r="6" fill="#3b82f6"/>
    <text x="80" y="85" font-size="11" font-weight="600" fill="#1e40af">1996</text>
    <text x="80" y="130" font-size="10" fill="#374151">v6.0</text>
    <text x="80" y="145" font-size="9" fill="#6b7280">正式命名</text>

    <circle cx="200" cy="100" r="6" fill="#3b82f6"/>
    <text x="200" y="85" font-size="11" font-weight="600" fill="#1e40af">2010</text>
    <text x="200" y="130" font-size="10" fill="#374151">v9.0</text>
    <text x="200" y="145" font-size="9" fill="#6b7280">流复制</text>

    <circle cx="300" cy="100" r="6" fill="#3b82f6"/>
    <text x="300" y="85" font-size="11" font-weight="600" fill="#1e40af">2014</text>
    <text x="300" y="130" font-size="10" fill="#374151">v9.4</text>
    <text x="300" y="145" font-size="9" fill="#6b7280">JSONB</text>

    <circle cx="400" cy="100" r="6" fill="#3b82f6"/>
    <text x="400" y="85" font-size="11" font-weight="600" fill="#1e40af">2017</text>
    <text x="400" y="130" font-size="10" fill="#374151">v10</text>
    <text x="400" y="145" font-size="9" fill="#6b7280">逻辑复制</text>

    <circle cx="520" cy="100" r="6" fill="#3b82f6"/>
    <text x="520" y="85" font-size="11" font-weight="600" fill="#1e40af">2021</text>
    <text x="520" y="130" font-size="10" fill="#374151">v14</text>
    <text x="520" y="145" font-size="9" fill="#6b7280">存储过程 INOUT</text>

    <circle cx="610" cy="100" r="6" fill="#3b82f6"/>
    <text x="610" y="85" font-size="11" font-weight="600" fill="#1e40af">2022</text>
    <text x="610" y="130" font-size="10" fill="#374151">v15</text>
    <text x="610" y="145" font-size="9" fill="#6b7280">MERGE / WAL 压缩</text>

    <circle cx="700" cy="100" r="6" fill="#3b82f6"/>
    <text x="700" y="85" font-size="11" font-weight="600" fill="#1e40af">2023</text>
    <text x="700" y="130" font-size="10" fill="#374151">v16</text>
    <text x="700" y="145" font-size="9" fill="#6b7280">逻辑复制增强</text>

    <circle cx="780" cy="100" r="6" fill="#f59e0b"/>
    <text x="780" y="85" font-size="11" font-weight="600" fill="#92400e">2024</text>
    <text x="780" y="130" font-size="10" fill="#374151">v17</text>
    <text x="780" y="145" font-size="9" fill="#6b7280">增量备份</text>
  </g>
  <text x="410" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">PostgreSQL 关键版本</text>
</svg>
