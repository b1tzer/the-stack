<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrowN" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#57606a"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#24292f">@Configuration vs @Component 单例失效</text>

  <!-- 起点 -->
  <rect x="230" y="46" width="260" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="360" y="73" text-anchor="middle" font-size="13" fill="#24292f">jdbcTemplate() 调用 dataSource()</text>
  <line x1="360" y1="90" x2="360" y2="112" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrowN)"/>

  <!-- 决策点 -->
  <polygon points="360,115 530,150 360,185 190,150" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="360" y="154" text-anchor="middle" font-size="13" fill="#bf360c">这次调用被代理拦截了吗？</text>

  <!-- 左分支：是 -->
  <path d="M 190 150 L 160 150 L 160 208" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="176" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">是</text>

  <rect x="60" y="210" width="200" height="44" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text x="160" y="227" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">@Configuration</text>
  <text x="160" y="243" text-anchor="middle" font-size="11" fill="#2e7d32">CGLIB 代理拦截</text>
  <line x1="160" y1="254" x2="160" y2="280" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="60" y="284" width="200" height="44" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text x="160" y="301" text-anchor="middle" font-size="13" fill="#24292f">查容器缓存</text>
  <text x="160" y="317" text-anchor="middle" font-size="11" fill="#57606a">返回已有实例</text>
  <line x1="160" y1="328" x2="160" y2="354" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="60" y="358" width="200" height="48" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="160" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">容器里 1 个实例 ✅</text>
  <text x="160" y="394" text-anchor="middle" font-size="11" fill="#1b5e20">单例语义正常</text>

  <!-- 右分支：否 -->
  <path d="M 530 150 L 560 150 L 560 208" fill="none" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="544" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">否</text>

  <rect x="460" y="210" width="200" height="44" rx="8" fill="#ffffff" stroke="#c62828"/>
  <text x="560" y="227" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">@Component</text>
  <text x="560" y="243" text-anchor="middle" font-size="11" fill="#c62828">无代理，普通 Java 调用</text>
  <line x1="560" y1="254" x2="560" y2="280" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <rect x="460" y="284" width="200" height="44" rx="8" fill="#ffffff" stroke="#c62828"/>
  <text x="560" y="301" text-anchor="middle" font-size="13" fill="#24292f">直接执行方法体</text>
  <text x="560" y="317" text-anchor="middle" font-size="11" fill="#57606a">new DataSource()</text>
  <line x1="560" y1="328" x2="560" y2="354" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <rect x="460" y="358" width="200" height="48" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.3"/>
  <text x="560" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">容器里 2 个实例 ❌</text>
  <text x="560" y="394" text-anchor="middle" font-size="11" fill="#b71c1c">连接池翻倍，连接数超限</text>
</svg>
