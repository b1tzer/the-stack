<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-ssi" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="30" y="20" width="240" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="150" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">事务A</text>
  <text x="150" y="58" text-anchor="middle" font-size="10" fill="#6b7280">读取数据集X → 基于X写入Y</text>
  <rect x="330" y="20" width="240" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="450" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">事务B</text>
  <text x="450" y="58" text-anchor="middle" font-size="10" fill="#6b7280">读取数据集Y → 基于Y写入X</text>
  <line x1="150" y1="70" x2="150" y2="110" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-ssi)"/>
  <line x1="450" y1="70" x2="450" y2="110" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-ssi)"/>
  <rect x="180" y="110" width="240" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="300" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">检测到读写依赖环</text>
  <text x="300" y="145" text-anchor="middle" font-size="9" fill="#6b7280">serialization_failure</text>
  <line x1="300" y1="150" x2="300" y2="180" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-ssi)"/>
  <rect x="180" y="180" width="240" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="300" y="200" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">回滚其中一个事务</text>
  <text x="300" y="215" text-anchor="middle" font-size="9" fill="#6b7280">应用层重试即可</text>
</svg>
