<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-v" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="280" y="15" width="260" height="36" rx="6" fill="#3b82f6"/>
  <text x="410" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">执行 UPDATE 操作</text>
  <line x1="410" y1="51" x2="410" y2="70" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-v)"/>
  <rect x="240" y="70" width="340" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="410" y="93" text-anchor="middle" font-size="11" fill="#374151">旧行标记为 Dead Tuple（xmax = 当前事务ID）</text>
  <line x1="410" y1="106" x2="410" y2="125" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-v)"/>
  <rect x="260" y="125" width="300" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="410" y="148" text-anchor="middle" font-size="11" fill="#374151">新版本行插入堆表</text>
  <line x1="410" y1="161" x2="410" y2="180" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-v)"/>
  <polygon points="410,180 510,210 410,240 310,210" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="410" y="214" text-anchor="middle" font-size="10" fill="#374151">是否 VACUUM？</text>
  <line x1="310" y1="210" x2="160" y2="210" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-v)"/>
  <text x="235" y="203" font-size="9" fill="#dc2626">否</text>
  <line x1="510" y1="210" x2="660" y2="210" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-v)"/>
  <text x="585" y="203" font-size="9" fill="#16a34a">是</text>
  <rect x="40" y="190" width="120" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="100" y="208" text-anchor="middle" font-size="10" fill="#991b1b">Dead Tuple 堆积</text>
  <text x="100" y="222" text-anchor="middle" font-size="10" fill="#991b1b">表膨胀</text>
  <rect x="660" y="190" width="130" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="725" y="208" text-anchor="middle" font-size="10" fill="#166534">清理 Dead Tuple</text>
  <text x="725" y="222" text-anchor="middle" font-size="10" fill="#166534">空间可复用</text>
  <line x1="100" y1="230" x2="100" y2="270" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-v)"/>
  <line x1="725" y1="230" x2="725" y2="270" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-v)"/>
  <rect x="30" y="270" width="140" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="100" y="293" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">查询性能下降</text>
  <rect x="655" y="270" width="140" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="725" y="293" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">表空间稳定</text>
</svg>
