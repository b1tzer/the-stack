<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" font-family="system-ui, -apple-system, sans-serif">
  <rect x="20" y="20" width="660" height="140" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="350" y="45" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">薪资数据: 5000, 4000, 4000, 3000</text>
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="90" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">ROW_NUMBER()</text>
    <text x="90" y="42" text-anchor="middle" font-size="13" fill="#374151">1, 2, 3, 4</text>
    <text x="90" y="62" text-anchor="middle" font-size="9" fill="#6b7280">每行唯一编号</text>
  </g>
  <g transform="translate(260, 60)">
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="90" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">RANK()</text>
    <text x="90" y="42" text-anchor="middle" font-size="13" fill="#374151">1, 2, 2, 4</text>
    <text x="90" y="62" text-anchor="middle" font-size="9" fill="#6b7280">并列后跳过排名</text>
  </g>
  <g transform="translate(480, 60)">
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="90" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">DENSE_RANK()</text>
    <text x="90" y="42" text-anchor="middle" font-size="13" fill="#374151">1, 2, 2, 3</text>
    <text x="90" y="62" text-anchor="middle" font-size="9" fill="#6b7280">并列后不跳过</text>
  </g>
</svg>
