<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-m" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#6b7280"/>
    </marker>
    <marker id="arrow-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
  </defs>
  <!-- MySQL -->
  <rect x="20" y="30" width="370" height="210" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="205" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">MySQL MVCC (Undo Log)</text>
  <rect x="50" y="75" width="130" height="40" rx="6" fill="#fff" stroke="#d97706" stroke-width="1"/>
  <text x="115" y="100" text-anchor="middle" font-size="11" fill="#374151">当前行数据</text>
  <rect x="50" y="135" width="130" height="40" rx="6" fill="#fff" stroke="#d97706" stroke-width="1"/>
  <text x="115" y="160" text-anchor="middle" font-size="11" fill="#374151">Undo Log 旧版本链</text>
  <rect x="50" y="195" width="130" height="30" rx="6" fill="#fff" stroke="#d97706" stroke-width="1"/>
  <text x="115" y="214" text-anchor="middle" font-size="10" fill="#374151">Read View 判断可见性</text>
  <line x1="115" y1="115" x2="115" y2="135" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-m)"/>
  <line x1="115" y1="175" x2="115" y2="195" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-m)"/>
  <line x1="180" y1="210" x2="180" y2="225" stroke="#6b7280" stroke-width="1" stroke-dasharray="4"/>
  <text x="250" y="155" font-size="10" fill="#92400e">事务提交后自动回收</text>
  <text x="250" y="170" font-size="10" fill="#92400e">无表膨胀风险</text>
  <!-- PostgreSQL -->
  <rect x="430" y="30" width="370" height="210" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="615" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">PostgreSQL MVCC (堆表)</text>
  <rect x="460" y="75" width="130" height="40" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1"/>
  <text x="525" y="100" text-anchor="middle" font-size="11" fill="#374151">堆表 Heap</text>
  <text x="525" y="113" text-anchor="middle" font-size="9" fill="#6b7280">多版本共存</text>
  <rect x="460" y="135" width="130" height="40" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1"/>
  <text x="525" y="160" text-anchor="middle" font-size="11" fill="#374151">xmin / xmax</text>
  <rect x="460" y="195" width="130" height="30" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1"/>
  <text x="525" y="214" text-anchor="middle" font-size="10" fill="#374151">Snapshot 判断可见性</text>
  <line x1="525" y1="115" x2="525" y2="135" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-b)"/>
  <line x1="525" y1="175" x2="525" y2="195" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-b)"/>
  <line x1="590" y1="210" x2="590" y2="225" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4"/>
  <text x="660" y="145" font-size="10" fill="#1e40af">需要 VACUUM 清理</text>
  <text x="660" y="160" font-size="10" fill="#dc2626">有表膨胀风险</text>
  <text x="660" y="175" font-size="10" fill="#1e40af">读性能更稳定</text>
</svg>
