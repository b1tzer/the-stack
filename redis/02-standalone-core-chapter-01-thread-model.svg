<svg xmlns="http://www.w3.org/2000/svg" width="780" height="260" viewBox="0 0 780 260" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#57606a"/></marker>
  </defs>
  <rect width="780" height="260" fill="#ffffff"/>

  <rect x="20" y="108" width="170" height="44" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="105" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">事件循环（单线程）</text>

  <rect x="300" y="30" width="200" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="400" y="52" text-anchor="middle" font-size="13" fill="#24292f">Acceptor：接受新连接</text>

  <rect x="300" y="108" width="200" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="400" y="130" text-anchor="middle" font-size="13" fill="#24292f">Handler：读取并解析命令</text>

  <rect x="300" y="186" width="170" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="385" y="208" text-anchor="middle" font-size="13" fill="#24292f">Handler：写回响应</text>

  <rect x="620" y="108" width="120" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="680" y="130" text-anchor="middle" font-size="13" fill="#24292f">命令执行</text>

  <line x1="190" y1="130" x2="290.41" y2="53.21" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="228" y="82" font-size="11" fill="#57606a">连接事件</text>

  <line x1="190" y1="130" x2="290" y2="130" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="120" text-anchor="middle" font-size="11" fill="#57606a">读事件</text>

  <line x1="190" y1="130" x2="290.41" y2="206.79" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="228" y="182" font-size="11" fill="#57606a">写事件</text>

  <line x1="500" y1="130" x2="610" y2="130" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="556" y="120" text-anchor="middle" font-size="11" fill="#57606a">执行命令</text>

  <line x1="680" y1="152" x2="471.97" y2="185.68" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
