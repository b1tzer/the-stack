  <line x1="110" y1="60" x2="212" y2="60" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="161" y="50" text-anchor="middle" font-size="11" fill="#57606a">序列化快照</text>

  <line x1="390" y1="60" x2="492" y2="60" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="441" y="50" text-anchor="middle" font-size="11" fill="#57606a">重启时加载</text>
</svg>
