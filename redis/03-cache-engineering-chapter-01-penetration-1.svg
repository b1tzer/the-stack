<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="760" height="240" fill="#ffffff"/>

  <rect x="20" y="98" width="70" height="44" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="55" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">请求</text>

  <rect x="140" y="98" width="90" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="185" y="120" text-anchor="middle" font-size="13" fill="#24292f">查缓存</text>

  <rect x="345" y="98" width="110" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="400" y="120" text-anchor="middle" font-size="13" fill="#24292f">查数据库</text>

  <rect x="265" y="22" width="70" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="300" y="44" text-anchor="middle" font-size="13" fill="#24292f">返回</text>

  <rect x="515" y="22" width="90" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="560" y="44" text-anchor="middle" font-size="13" fill="#24292f">写缓存</text>

  <rect x="515" y="176" width="90" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="560" y="198" text-anchor="middle" font-size="13" fill="#24292f">返回空</text>

  <line x1="90" y1="120" x2="140" y2="120" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="185" y1="98" x2="300" y2="66" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="76" text-anchor="middle" font-size="11" fill="#57606a">命中</text>

  <line x1="230" y1="120" x2="345" y2="120" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="287" y="110" text-anchor="middle" font-size="11" fill="#57606a">未命中</text>

  <line x1="400" y1="98" x2="560" y2="66" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="478" y="72" text-anchor="middle" font-size="11" fill="#57606a">存在</text>

  <line x1="400" y1="142" x2="560" y2="176" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="478" y="166" text-anchor="middle" font-size="11" fill="#57606a">不存在</text>
</svg>
