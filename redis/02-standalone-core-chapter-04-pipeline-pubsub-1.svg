<svg xmlns="http://www.w3.org/2000/svg" width="540" height="190" viewBox="0 0 540 190" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="540" height="190" fill="#ffffff"/>

  <rect x="20" y="73" width="110" height="44" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="75" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">客户端</text>

  <rect x="400" y="73" width="110" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="455" y="95" text-anchor="middle" font-size="13" fill="#24292f">Redis</text>

  <line x1="130" y1="82" x2="392" y2="82" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="261" y="72" text-anchor="middle" font-size="11" fill="#57606a">一次发送 N 条命令</text>

  <line x1="392" y1="108" x2="130" y2="108" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="261" y="126" text-anchor="middle" font-size="11" fill="#57606a">一次返回 N 个结果</text>
</svg>
