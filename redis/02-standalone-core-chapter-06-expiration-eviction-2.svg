<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="860" height="220" fill="#ffffff"/>

  <rect x="20" y="90" width="300" height="80" rx="10" fill="#f6f8fa" stroke="#9aa4af" stroke-dasharray="5 4"/>
  <text x="32" y="112" font-size="13" font-weight="700" fill="#57606a">定期删除（主动）</text>
  <rect x="40" y="124" width="240" height="34" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="160" y="141" text-anchor="middle" font-size="12" fill="#24292f">每 100ms 随机抽 20 个，删过期的</text>

  <rect x="400" y="90" width="260" height="80" rx="10" fill="#f6f8fa" stroke="#9aa4af" stroke-dasharray="5 4"/>
  <text x="412" y="112" font-size="13" font-weight="700" fill="#57606a">惰性删除（被动）</text>
  <rect x="420" y="124" width="220" height="34" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="530" y="141" text-anchor="middle" font-size="12" fill="#24292f">访问时检查，过期就删</text>

  <rect x="720" y="90" width="120" height="44" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="780" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">内存</text>

  <line x1="320" y1="112" x2="712" y2="112" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="516" y="104" text-anchor="middle" font-size="11" fill="#57606a">兜底大部分过期键</text>

  <line x1="660" y1="130" x2="712" y2="118" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="650" y="160" text-anchor="middle" font-size="11" fill="#57606a">兜底被访问的过期键</text>
</svg>
