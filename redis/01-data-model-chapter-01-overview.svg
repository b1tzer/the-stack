    <g>
      <rect x="1120" y="142" width="170" height="116" rx="10" fill="#ffffff" stroke="#e3e6ea"/>
      <text x="1205" y="162" font-weight="700" fill="#DC382D">Redis 7.0</text>
      <text x="1205" y="184" fill="#57606a">Redis Functions</text>
      <text x="1205" y="206" fill="#57606a">ACL v2、分片</text>
      <text x="1205" y="228" fill="#57606a">Pub/Sub、MP-AOF</text>
    </g>
    <g>
      <rect x="1280" y="142" width="170" height="116" rx="10" fill="#ffffff" stroke="#e3e6ea"/>
      <text x="1365" y="162" font-weight="700" fill="#DC382D">Redis 7.2</text>
      <text x="1365" y="184" fill="#57606a">哨兵 TLS</text>
      <text x="1365" y="206" fill="#57606a">listpack 全面替代</text>
      <text x="1365" y="228" fill="#57606a">ziplist</text>
    </g>
