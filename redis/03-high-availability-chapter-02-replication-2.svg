<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#57606a"/></marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>

  <rect x="40" y="30" width="120" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="100" y="52" text-anchor="middle" font-size="13" fill="#24292f">从节点</text>

  <rect x="250" y="30" width="130" height="44" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="315" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">主节点</text>

  <rect x="250" y="150" width="150" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="325" y="172" text-anchor="middle" font-size="13" fill="#24292f">RDB 快照</text>

  <rect x="545" y="150" width="170" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="630" y="172" text-anchor="middle" font-size="13" fill="#24292f">复制缓冲区</text>

  <rect x="310" y="275" width="150" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="385" y="297" text-anchor="middle" font-size="13" fill="#24292f">从节点加载</text>

  <line x1="160" y1="52" x2="240" y2="52" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="201" y="42" text-anchor="middle" font-size="11" fill="#57606a">PSYNC</text>

  <line x1="315" y1="74" x2="324.71" y2="140.02" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="105" font-size="11" fill="#57606a">BGSAVE 生成 RDB</text>

  <line x1="380" y1="74" x2="618.08" y2="141.45" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="545" y="98" font-size="11" fill="#57606a">同步期间的写命令</text>

  <line x1="325" y1="194" x2="383.73" y2="265.45" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="235" text-anchor="end" font-size="11" fill="#57606a">发送给从节点</text>

  <line x1="630" y1="194" x2="461.84" y2="266.21" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="590" y="238" font-size="11" fill="#57606a">继续发送</text>
</svg>
