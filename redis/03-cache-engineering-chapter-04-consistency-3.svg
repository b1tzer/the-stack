<svg xmlns="http://www.w3.org/2000/svg" width="880" height="120" viewBox="0 0 880 120" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="880" height="120" fill="#ffffff"/>

  <rect x="5" y="38" width="120" height="44" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="65" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">应用写数据库</text>

  <rect x="175" y="38" width="80" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="215" y="60" text-anchor="middle" font-size="13" fill="#24292f">MySQL</text>

  <rect x="305" y="38" width="150" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="380" y="60" text-anchor="middle" font-size="13" fill="#24292f">Canal 监听 Binlog</text>

  <rect x="515" y="38" width="90" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="560" y="60" text-anchor="middle" font-size="13" fill="#24292f">消息队列</text>

  <rect x="655" y="38" width="170" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
