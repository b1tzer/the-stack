  <line x1="125" y1="60" x2="175" y2="60" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="255" y1="60" x2="305" y2="60" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#57606a">产生 Binlog</text>

  <line x1="455" y1="60" x2="515" y2="60" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="485" y="50" text-anchor="middle" font-size="11" fill="#57606a">解析变更</text>

  <line x1="605" y1="60" x2="655" y2="60" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="630" y="50" text-anchor="middle" font-size="11" fill="#57606a">消费</text>
