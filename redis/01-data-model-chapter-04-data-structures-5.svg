<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="920" height="300" fill="#ffffff"/>

  <!-- 左侧 dict 结构框 -->
  <rect x="30" y="50" width="180" height="210" rx="8" fill="#f6f8fa" stroke="#9aa4af"/>
  <text x="120" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">dict</text>
  <text x="48" y="104" font-size="13" fill="#57606a">type</text>
  <text x="48" y="132" font-size="13" fill="#57606a">privdata</text>
  <text x="48" y="160" font-size="13" font-weight="700" fill="#DC382D">ht[0]</text>
  <text x="48" y="188" font-size="13" fill="#57606a">ht[1]</text>
  <text x="48" y="216" font-size="13" fill="#57606a">rehashidx</text>
  <text x="48" y="244" font-size="12" fill="#9aa4af">ht[2] 两个哈希表，</text>
  <text x="48" y="260" font-size="12" fill="#9aa4af">rehash 时同时使用</text>

  <!-- 右侧 ht[0] 桶数组 -->
  <text x="330" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">ht[0] 桶数组（table）</text>

  <!-- 桶0 -->
  <rect x="280" y="94" width="100" height="36" rx="6" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="330" y="116" text-anchor="middle" font-size="12" fill="#57606a">桶0</text>
  <!-- 桶1 -->
  <rect x="280" y="146" width="100" height="36" rx="6" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="330" y="168" text-anchor="middle" font-size="12" fill="#57606a">桶1</text>
  <!-- 桶2（有冲突链） -->
  <rect x="280" y="198" width="100" height="36" rx="6" fill="#fff1f0" stroke="#DC382D"/>
  <text x="330" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#DC382D">桶2</text>
  <!-- 桶3 -->
  <rect x="280" y="250" width="100" height="36" rx="6" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="330" y="272" text-anchor="middle" font-size="12" fill="#57606a">桶3</text>

  <!-- 桶2 的冲突链 -->
  <line x1="380" y1="216" x2="430" y2="216" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="440" y="198" width="140" height="36" rx="6" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="510" y="220" text-anchor="middle" font-size="12" fill="#24292f">keyA → valA</text>

  <line x1="580" y1="216" x2="620" y2="216" stroke="#DC382D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="630" y="198" width="140" height="36" rx="6" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="700" y="220" text-anchor="middle" font-size="12" fill="#24292f">keyC → valC</text>
  <text x="645" y="252" font-size="11" fill="#DC382D">next 指针（链地址法）</text>

  <!-- 桶3 的 dictEntry -->
  <line x1="380" y1="268" x2="430" y2="268" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="440" y="250" width="140" height="36" rx="6" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="510" y="272" text-anchor="middle" font-size="12" fill="#24292f">keyB → valB</text>
</svg>
