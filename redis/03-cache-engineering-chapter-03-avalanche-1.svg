<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="600" height="330" fill="#ffffff"/>

  <rect x="20" y="30" width="180" height="175" rx="10" fill="#f6f8fa" stroke="#9aa4af" stroke-dasharray="5 4"/>
  <text x="30" y="52" font-size="13" font-weight="700" fill="#57606a">成因一：同时过期</text>

  <rect x="55" y="53" width="110" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="110" y="75" text-anchor="middle" font-size="13" fill="#24292f">key1 过期</text>

  <rect x="55" y="98" width="110" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="110" y="120" text-anchor="middle" font-size="13" fill="#24292f">key2 过期</text>

  <rect x="55" y="143" width="110" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="110" y="165" text-anchor="middle" font-size="13" fill="#24292f">key3 过期</text>

  <rect x="20" y="235" width="180" height="75" rx="10" fill="#f6f8fa" stroke="#9aa4af" stroke-dasharray="5 4"/>
  <text x="30" y="257" font-size="13" font-weight="700" fill="#57606a">成因二：服务宕机</text>

  <rect x="55" y="258" width="110" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="110" y="280" text-anchor="middle" font-size="13" fill="#24292f">Redis 宕机</text>

  <rect x="380" y="138" width="180" height="44" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="470" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">数据库承受瞬时洪峰</text>

  <line x1="165" y1="75" x2="380" y2="160" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="165" y1="120" x2="380" y2="160" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="165" y1="165" x2="380" y2="160" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="165" y1="280" x2="380" y2="160" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
