<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#ffffff"/>

  <rect x="115" y="13" width="70" height="44" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="150" y="35" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">请求</text>

  <rect x="35" y="88" width="230" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="150" y="110" text-anchor="middle" font-size="13" fill="#24292f">缓存命中，但检查逻辑过期时间</text>

  <rect x="345" y="88" width="130" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="410" y="110" text-anchor="middle" font-size="13" fill="#24292f">直接返回旧值</text>

  <rect x="85" y="163" width="130" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="150" y="185" text-anchor="middle" font-size="13" fill="#24292f">尝试获取锁</text>

  <rect x="55" y="238" width="190" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="150" y="260" text-anchor="middle" font-size="13" fill="#24292f">开线程异步重建缓存</text>

  <rect x="355" y="238" width="110" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="410" y="260" text-anchor="middle" font-size="13" fill="#24292f">返回旧值</text>

  <rect x="65" y="313" width="170" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="150" y="335" text-anchor="middle" font-size="13" fill="#24292f">主线程先返回旧值</text>

  <line x1="150" y1="57" x2="150" y2="88" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="265" y1="110" x2="345" y2="110" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="100" text-anchor="middle" font-size="11" fill="#57606a">未过期</text>

  <line x1="150" y1="132" x2="150" y2="163" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="152" text-anchor="end" font-size="11" fill="#57606a">已过期</text>

  <line x1="150" y1="207" x2="150" y2="238" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="226" text-anchor="end" font-size="11" fill="#57606a">拿到锁</text>

  <line x1="185" y1="207" x2="395" y2="238" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="285" y="230" text-anchor="middle" font-size="11" fill="#57606a">没拿到锁</text>

  <line x1="150" y1="282" x2="150" y2="313" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
