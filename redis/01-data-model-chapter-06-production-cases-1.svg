<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#ffffff"/>

  <!-- 列标题 -->
  <text x="210" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#24292f">数据模型知识点（前五章）</text>
  <text x="710" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#24292f">对应的生产问题</text>

  <!-- 左列：知识点 -->
  <rect x="40" y="64" width="340" height="48" rx="8" fill="#f6f8fa" stroke="#9aa4af"/>
  <text x="210" y="86" text-anchor="middle" font-size="13" fill="#24292f">String 单值结构，整存整取</text>
  <text x="210" y="103" text-anchor="middle" font-size="11" fill="#57606a">chapter-02 §1</text>

  <rect x="40" y="136" width="340" height="48" rx="8" fill="#f6f8fa" stroke="#9aa4af"/>
  <text x="210" y="158" text-anchor="middle" font-size="13" fill="#24292f">BitMap 建立在 String 之上</text>
  <text x="210" y="175" text-anchor="middle" font-size="11" fill="#57606a">chapter-03 §1</text>

  <rect x="40" y="208" width="340" height="48" rx="8" fill="#f6f8fa" stroke="#9aa4af"/>
  <text x="210" y="230" text-anchor="middle" font-size="13" fill="#24292f">紧凑编码 ↔ 普通编码切换</text>
  <text x="210" y="247" text-anchor="middle" font-size="11" fill="#57606a">chapter-05 §4 / chapter-04 §5</text>

  <rect x="40" y="280" width="340" height="48" rx="8" fill="#f6f8fa" stroke="#9aa4af"/>
  <text x="210" y="302" text-anchor="middle" font-size="13" fill="#24292f">HyperLogLog 概率基数统计</text>
  <text x="210" y="319" text-anchor="middle" font-size="11" fill="#57606a">chapter-03 §2</text>

  <rect x="40" y="352" width="340" height="48" rx="8" fill="#f6f8fa" stroke="#9aa4af"/>
  <text x="210" y="374" text-anchor="middle" font-size="13" fill="#24292f">SDS 惰性释放 + 分配器碎片</text>
  <text x="210" y="391" text-anchor="middle" font-size="11" fill="#57606a">chapter-04 §1</text>

  <!-- 右列：生产问题 -->
  <rect x="540" y="64" width="340" height="48" rx="8" fill="#fff8e1" stroke="#f0b429"/>
  <text x="710" y="86" text-anchor="middle" font-size="13" fill="#24292f">大 Key 阻塞、带宽打满</text>
  <text x="710" y="103" text-anchor="middle" font-size="11" fill="#57606a">案例一</text>

  <rect x="540" y="136" width="340" height="48" rx="8" fill="#fff8e1" stroke="#f0b429"/>
  <text x="710" y="158" text-anchor="middle" font-size="13" fill="#24292f">稀疏偏移量撑爆内存</text>
  <text x="710" y="175" text-anchor="middle" font-size="11" fill="#57606a">案例二</text>

  <rect x="540" y="208" width="340" height="48" rx="8" fill="#fff8e1" stroke="#f0b429"/>
  <text x="710" y="230" text-anchor="middle" font-size="13" fill="#24292f">编码不可逆升级、内存翻倍</text>
  <text x="710" y="247" text-anchor="middle" font-size="11" fill="#57606a">案例三</text>

  <rect x="540" y="280" width="340" height="48" rx="8" fill="#fff8e1" stroke="#f0b429"/>
  <text x="710" y="302" text-anchor="middle" font-size="13" fill="#24292f">UV 对账对不上</text>
  <text x="710" y="319" text-anchor="middle" font-size="11" fill="#57606a">案例四</text>

  <rect x="540" y="352" width="340" height="48" rx="8" fill="#fff8e1" stroke="#f0b429"/>
  <text x="710" y="374" text-anchor="middle" font-size="13" fill="#24292f">内存只涨不降（RSS 偏高）</text>
  <text x="710" y="391" text-anchor="middle" font-size="11" fill="#57606a">案例五</text>

  <!-- 连线 -->
  <g stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="380" y1="88" x2="536" y2="88"/>
    <line x1="380" y1="160" x2="536" y2="160"/>
    <line x1="380" y1="232" x2="536" y2="232"/>
    <line x1="380" y1="304" x2="536" y2="304"/>
    <line x1="380" y1="376" x2="536" y2="376"/>
  </g>

  <!-- 图例 -->
  <text x="460" y="452" text-anchor="middle" font-size="12" fill="#57606a">左列是前五章的知识点，右列是它能在生产环境解释的现象——问题不在 Redis，而在结构与编码的选择</text>
</svg>
