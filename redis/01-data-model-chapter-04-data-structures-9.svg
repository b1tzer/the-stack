<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="920" height="300" fill="#ffffff"/>

  <!-- 第一层：quicklist 头 -->
  <rect x="30" y="24" width="860" height="48" rx="8" fill="#f6f8fa" stroke="#9aa4af"/>
  <text x="460" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">quicklist（head / tail / count / len / fill / compress）</text>
  <text x="460" y="62" text-anchor="middle" font-size="11" fill="#57606a">第一层：外层对象</text>

  <line x1="160" y1="72" x2="160" y2="96" stroke="#9aa4af" stroke-width="1.5"/>
  <line x1="460" y1="72" x2="460" y2="96" stroke="#9aa4af" stroke-width="1.5"/>
  <line x1="760" y1="72" x2="760" y2="96" stroke="#9aa4af" stroke-width="1.5"/>

  <!-- 第二层：三个 quicklistNode -->
  <text x="160" y="112" text-anchor="middle" font-size="12" fill="#57606a">quicklistNode 1</text>
  <rect x="60" y="120" width="200" height="36" rx="6" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="160" y="143" text-anchor="middle" font-size="12" fill="#24292f">prev | next | listpack</text>

  <text x="460" y="112" text-anchor="middle" font-size="12" fill="#57606a">quicklistNode 2</text>
  <rect x="360" y="120" width="200" height="36" rx="6" fill="#fff8e1" stroke="#f0b429"/>
  <text x="460" y="143" text-anchor="middle" font-size="12" fill="#24292f">prev | next | listpack（LZF 压缩）</text>

  <text x="760" y="112" text-anchor="middle" font-size="12" fill="#57606a">quicklistNode 3</text>
  <rect x="660" y="120" width="200" height="36" rx="6" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="760" y="143" text-anchor="middle" font-size="12" fill="#24292f">prev | next | listpack</text>

  <!-- 双向箭头 -->
  <g stroke="#57606a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="260" y1="138" x2="352" y2="138"/>
    <line x1="560" y1="138" x2="652" y2="138"/>
  </g>

  <line x1="160" y1="156" x2="160" y2="180" stroke="#9aa4af" stroke-width="1.5"/>
  <line x1="460" y1="156" x2="460" y2="180" stroke="#9aa4af" stroke-width="1.5"/>
  <line x1="760" y1="156" x2="760" y2="180" stroke="#9aa4af" stroke-width="1.5"/>

  <!-- 第三层：listpack 内的元素 -->
  <rect x="60" y="184" width="200" height="44" rx="6" fill="#ffffff" stroke="#c0c8d0"/>
  <g stroke="#c0c8d0" stroke-width="1">
    <line x1="127" y1="184" x2="127" y2="228"/>
    <line x1="194" y1="184" x2="194" y2="228"/>
  </g>
  <text x="93" y="211" text-anchor="middle" font-size="13" fill="#DC382D">A</text>
  <text x="160" y="211" text-anchor="middle" font-size="13" fill="#DC382D">B</text>
  <text x="227" y="211" text-anchor="middle" font-size="13" fill="#DC382D">C</text>

  <rect x="360" y="184" width="200" height="44" rx="6" fill="#fff8e1" stroke="#f0b429"/>
  <text x="460" y="211" text-anchor="middle" font-size="13" fill="#24292f">D E F（压缩存储）</text>

  <rect x="660" y="184" width="200" height="44" rx="6" fill="#ffffff" stroke="#c0c8d0"/>
  <g stroke="#c0c8d0" stroke-width="1">
    <line x1="727" y1="184" x2="727" y2="228"/>
    <line x1="794" y1="184" x2="794" y2="228"/>
  </g>
  <text x="693" y="211" text-anchor="middle" font-size="13" fill="#DC382D">G</text>
  <text x="760" y="211" text-anchor="middle" font-size="13" fill="#DC382D">H</text>
  <text x="827" y="211" text-anchor="middle" font-size="13" fill="#DC382D">I</text>

  <!-- 图例 -->
  <text x="460" y="270" text-anchor="middle" font-size="11" fill="#57606a">两端节点不压缩（常用 LPUSH/LPOP/RPUSH/RPOP），中间节点 LZF 压缩省内存</text>
</svg>
