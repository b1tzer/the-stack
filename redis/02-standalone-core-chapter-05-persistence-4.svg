<svg xmlns="http://www.w3.org/2000/svg" width="620" height="320" viewBox="0 0 620 320" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="620" height="320" fill="#ffffff"/>

  <rect x="40" y="30" width="110" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="95" y="52" text-anchor="middle" font-size="13" fill="#24292f">当前内存数据</text>

  <rect x="410" y="30" width="120" height="44" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="470" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">新 AOF 文件</text>

  <line x1="150" y1="52" x2="402" y2="52" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="276" y="42" text-anchor="middle" font-size="11" fill="#57606a">生成最小命令集</text>

  <rect x="30" y="140" width="500" height="140" rx="10" fill="#f6f8fa" stroke="#9aa4af" stroke-dasharray="5 4"/>
  <text x="42" y="162" font-size="13" font-weight="700" fill="#57606a">重写期间</text>

  <rect x="60" y="180" width="110" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="115" y="202" text-anchor="middle" font-size="13" fill="#24292f">增量写命令</text>

  <rect x="350" y="180" width="110" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="405" y="202" text-anchor="middle" font-size="13" fill="#24292f">重写缓冲区</text>

  <line x1="170" y1="202" x2="342" y2="202" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="405" y1="180" x2="470" y2="82" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="128" font-size="11" fill="#57606a">重写完成后追加</text>
</svg>
