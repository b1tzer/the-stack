<svg xmlns="http://www.w3.org/2000/svg" width="780" height="250" viewBox="0 0 780 250" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="780" height="250" fill="#ffffff"/>

  <rect x="30" y="30" width="120" height="44" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="90" y="57" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">生产者</text>

  <rect x="210" y="30" width="160" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="290" y="52" text-anchor="middle" font-size="13" fill="#24292f">ZSet 延迟队列</text>
  <text x="290" y="67" text-anchor="middle" font-size="10" fill="#57606a">score = 执行时间</text>

  <rect x="430" y="30" width="150" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="505" y="52" text-anchor="middle" font-size="13" fill="#24292f">调度器</text>
  <text x="505" y="67" text-anchor="middle" font-size="10" fill="#57606a">定时搬移</text>

  <rect x="300" y="180" width="150" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="375" y="202" text-anchor="middle" font-size="13" fill="#24292f">Stream</text>
  <text x="375" y="217" text-anchor="middle" font-size="10" fill="#57606a">可靠投递</text>

  <rect x="520" y="180" width="150" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="595" y="202" text-anchor="middle" font-size="13" fill="#24292f">消费组</text>
  <text x="595" y="217" text-anchor="middle" font-size="10" fill="#57606a">PEL / ACK</text>

  <line x1="150" y1="52" x2="202" y2="52" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="176" y="42" text-anchor="middle" font-size="10" fill="#57606a">写任务</text>

  <line x1="370" y1="52" x2="422" y2="52" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="396" y="42" text-anchor="middle" font-size="10" fill="#57606a">取到期</text>

  <path d="M 505 74 L 375 172" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="468" y="130" text-anchor="middle" font-size="10" fill="#57606a">XADD + ZREM</text>

  <line x1="450" y1="202" x2="512" y2="202" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="481" y="192" text-anchor="middle" font-size="10" fill="#57606a">XREADGROUP</text>

  <line x1="595" y1="224" x2="595" y2="240" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="612" y="237" text-anchor="start" font-size="10" fill="#57606a">XACK 确认</text>
</svg>
