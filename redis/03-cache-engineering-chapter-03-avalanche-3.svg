  <line x1="90" y1="115" x2="135" y2="115" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="215" y1="93" x2="440" y2="62" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="66" text-anchor="middle" font-size="11" fill="#57606a">正常</text>

  <line x1="215" y1="137" x2="460" y2="168" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="160" text-anchor="middle" font-size="11" fill="#57606a">异常</text>
</svg>
