<svg xmlns="http://www.w3.org/2000/svg" width="620" height="240" viewBox="0 0 620 240" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="620" height="240" fill="#ffffff"/>

  <rect x="20" y="93" width="70" height="44" rx="8" fill="#fff1f0" stroke="#DC382D"/>
  <text x="55" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#DC382D">请求</text>

  <rect x="135" y="93" width="160" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
  <text x="215" y="115" text-anchor="middle" font-size="13" fill="#24292f">检测缓存/DB 健康</text>

  <rect x="385" y="18" width="110" height="44" rx="8" fill="#ffffff" stroke="#c0c8d0"/>
