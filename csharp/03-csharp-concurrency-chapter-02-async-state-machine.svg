<svg height="210" xmlns="http://www.w3.org/2000/svg" width="560" viewBox="0 0 560 210" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="280" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">async 方法的执行模型</text>

  <!-- Segment 1 -->
  <rect x="30" y="70" width="150" height="64" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="105" y="95" text-anchor="middle" fill="#0d47a1" font-weight="bold">片段 1</text>
  <text x="105" y="115" text-anchor="middle" fill="#1565c0">await 之前的代码</text>

  <!-- Await suspension -->
  <rect x="205" y="78" width="110" height="48" rx="7" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="260" y="98" text-anchor="middle" fill="#bf360c" font-weight="bold">await</text>
  <text x="260" y="115" text-anchor="middle" fill="#ef6c00">让出线程</text>

  <!-- Segment 2 -->
  <rect x="380" y="70" width="150" height="64" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="455" y="95" text-anchor="middle" fill="#1b5e20" font-weight="bold">片段 2</text>
  <text x="455" y="115" text-anchor="middle" fill="#388e3c">await 之后的代码</text>

  <!-- Flow arrows -->
  <line x1="180" y1="102" x2="205" y2="102" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="315" y1="102" x2="380" y2="102" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="347" y="95" text-anchor="middle" fill="#888888">完成后恢复</text>

  <text x="280" y="180" text-anchor="middle" fill="#888888" font-size="11">方法体被 await 切分为片段；等待期间让出线程，完成后从暂停点恢复</text>

  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#555555"/></marker></defs>
</svg>
