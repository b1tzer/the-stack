<svg height="220" xmlns="http://www.w3.org/2000/svg" width="560" viewBox="0 0 560 220" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="280" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">中间件管道：请求向下、响应向上</text>

  <!-- Middleware boxes -->
  <rect x="140" y="90" width="120" height="44" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="200" y="117" text-anchor="middle" fill="#0d47a1" font-weight="bold">中间件 A</text>
  <rect x="300" y="90" width="120" height="44" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="360" y="117" text-anchor="middle" fill="#1b5e20" font-weight="bold">中间件 B</text>
  <rect x="450" y="90" width="90" height="44" rx="7" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="495" y="117" text-anchor="middle" fill="#bf360c" font-weight="bold">端点</text>

  <!-- Response path (top, leftward) -->
  <line x1="495" y1="48" x2="360" y2="48" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="360" y1="48" x2="200" y2="48" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="200" y1="48" x2="40" y2="48" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="40" y="40" fill="#888888">响应</text>

  <!-- Request path (bottom, rightward) -->
  <line x1="40" y1="160" x2="200" y2="160" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="200" y1="160" x2="360" y2="160" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="360" y1="160" x2="495" y2="160" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="40" y="176" fill="#888888">请求</text>

  <!-- Vertical connectors -->
  <line x1="200" y1="90" x2="200" y2="48" stroke="#90caf9" stroke-width="1.3"/>
  <line x1="200" y1="134" x2="200" y2="160" stroke="#90caf9" stroke-width="1.3"/>
  <line x1="360" y1="90" x2="360" y2="48" stroke="#a5d6a7" stroke-width="1.3"/>
  <line x1="360" y1="134" x2="360" y2="160" stroke="#a5d6a7" stroke-width="1.3"/>
  <line x1="495" y1="90" x2="495" y2="48" stroke="#ffcc80" stroke-width="1.3"/>
  <line x1="495" y1="134" x2="495" y2="160" stroke="#ffcc80" stroke-width="1.3"/>

  <text x="280" y="205" text-anchor="middle" fill="#888888" font-size="11">请求依次流经中间件到达端点，响应逆序返回；中间件可短路</text>

  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#555555"/></marker></defs>
</svg>
