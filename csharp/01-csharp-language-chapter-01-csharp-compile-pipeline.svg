<svg height="398" xmlns="http://www.w3.org/2000/svg" width="374" viewBox="0 0 374 398" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="187" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">C# 程序的执行流程</text>

  <!-- Step 1: Source -->
  <rect x="107" y="41" width="160" height="37" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="187" y="65" text-anchor="middle" fill="#0d47a1" font-weight="bold">Program.cs（源码）</text>
  <line x1="187" y1="78" x2="187" y2="94" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="201" y="93" fill="#888888" font-size="11">Roslyn 编译</text>

  <!-- Step 2: IL + metadata -->
  <rect x="107" y="104" width="160" height="37" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="187" y="128" text-anchor="middle" fill="#1b5e20" font-weight="bold">IL + 元数据（程序集 .dll）</text>
  <line x1="187" y1="141" x2="187" y2="157" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="201" y="156" fill="#888888" font-size="11">运行时加载</text>

  <!-- Step 3: Runtime -->
  <rect x="107" y="167" width="160" height="37" rx="7" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.3"/>
  <text x="187" y="190" text-anchor="middle" fill="#4a148c" font-weight="bold">.NET 运行时加载并验证</text>
  <line x1="187" y1="204" x2="187" y2="220" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Step 4: JIT / AOT -->
  <rect x="107" y="230" width="160" height="37" rx="7" fill="#fff3e0" stroke="#e65100" stroke-width="1.3"/>
  <text x="187" y="253" text-anchor="middle" fill="#bf360c" font-weight="bold">JIT 编译 / NativeAOT</text>
  <line x1="187" y1="267" x2="187" y2="283" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="201" y="282" fill="#888888" font-size="11">机器码</text>

  <!-- Step 5: CPU -->
  <rect x="107" y="292" width="160" height="37" rx="7" fill="#ffcdd2" stroke="#c62828" stroke-width="1.3"/>
  <text x="187" y="315" text-anchor="middle" fill="#b71c1c" font-weight="bold">CPU 执行机器码</text>

  <text x="187" y="375" text-anchor="middle" fill="#888888" font-size="11">C# 源码先编译成平台无关的 IL，再由运行时 JIT 或 AOT 生成机器码</text>

  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#555555"/></marker></defs>
</svg>
