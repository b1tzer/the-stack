<svg height="290" xmlns="http://www.w3.org/2000/svg" width="560" viewBox="0 0 560 290" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="280" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">C# 类型体系</text>

  <!-- Root: Type -->
  <rect x="220" y="41" width="120" height="37" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="280" y="65" text-anchor="middle" fill="#0d47a1" font-weight="bold">Type</text>

  <!-- Branch lines -->
  <line x1="250" y1="78" x2="145" y2="112" stroke="#555555" stroke-width="1.8"/>
  <line x1="310" y1="78" x2="415" y2="112" stroke="#555555" stroke-width="1.8"/>

  <!-- Value Type -->
  <rect x="40" y="112" width="210" height="37" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="145" y="136" text-anchor="middle" fill="#1b5e20" font-weight="bold">值类型（按值存储）</text>

  <!-- Reference Type -->
  <rect x="310" y="112" width="210" height="37" rx="7" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.3"/>
  <text x="415" y="136" text-anchor="middle" fill="#4a148c" font-weight="bold">引用类型（通过引用指向）</text>

  <!-- Value type connectors -->
  <line x1="66" y1="149" x2="66" y2="172" stroke="#555555" stroke-width="0.8"/>
  <line x1="114" y1="149" x2="114" y2="172" stroke="#555555" stroke-width="0.8"/>
  <line x1="170" y1="149" x2="170" y2="172" stroke="#555555" stroke-width="0.8"/>
  <line x1="68" y1="149" x2="68" y2="202" stroke="#555555" stroke-width="0.8"/>
  <line x1="121" y1="149" x2="121" y2="202" stroke="#555555" stroke-width="0.8"/>
  <line x1="177" y1="149" x2="177" y2="202" stroke="#555555" stroke-width="0.8"/>

  <!-- Value type children row 1 -->
  <rect x="46" y="172" width="40" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="66" y="189" text-anchor="middle" fill="#333333">int</text>
  <rect x="92" y="172" width="44" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="114" y="189" text-anchor="middle" fill="#333333">long</text>
  <rect x="142" y="172" width="56" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="170" y="189" text-anchor="middle" fill="#333333">double</text>

  <!-- Value type children row 2 -->
  <rect x="46" y="202" width="44" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="68" y="219" text-anchor="middle" fill="#333333">bool</text>
  <rect x="96" y="202" width="50" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="121" y="219" text-anchor="middle" fill="#333333">struct</text>
  <rect x="152" y="202" width="50" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="177" y="219" text-anchor="middle" fill="#333333">enum</text>

  <!-- Reference type connectors -->
  <line x1="339" y1="149" x2="339" y2="172" stroke="#555555" stroke-width="0.8"/>
  <line x1="400" y1="149" x2="400" y2="172" stroke="#555555" stroke-width="0.8"/>
  <line x1="469" y1="149" x2="469" y2="172" stroke="#555555" stroke-width="0.8"/>
  <line x1="339" y1="149" x2="339" y2="202" stroke="#555555" stroke-width="0.8"/>
  <line x1="394" y1="149" x2="394" y2="202" stroke="#555555" stroke-width="0.8"/>

  <!-- Reference type children row 1 -->
  <rect x="316" y="172" width="46" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="339" y="189" text-anchor="middle" fill="#333333">class</text>
  <rect x="368" y="172" width="64" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="400" y="189" text-anchor="middle" fill="#333333">interface</text>
  <rect x="438" y="172" width="62" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="469" y="189" text-anchor="middle" fill="#333333">delegate</text>

  <!-- Reference type children row 2 -->
  <rect x="316" y="202" width="46" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="339" y="219" text-anchor="middle" fill="#333333">array</text>
  <rect x="368" y="202" width="52" height="26" rx="3" fill="#f8f9fa" stroke="#bdbdbd" stroke-width="0.8"/>
  <text x="394" y="219" text-anchor="middle" fill="#333333">record</text>

  <text x="280" y="265" text-anchor="middle" fill="#888888" font-size="11">值类型直接存值；引用类型的变量保存引用，对象在堆上</text>
</svg>
